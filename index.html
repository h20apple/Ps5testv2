<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 WebKit V12 Probe</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button, select {
    font:16px monospace;
    padding:9px;
    margin:4px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:10px;
    white-space:pre-wrap;
}
.ok   { color:#59ff7a; }
.bad  { color:#ff6868; }
.warn { color:#ffd166; }
.info { color:#63caff; }

#sandbox {
    position:absolute;
    left:-20000px;
    top:0;
}
</style>
</head>

<body>

<h2>PS5 WebKit 13.60 — V12 Trigger Probe</h2>

<select id="runs">
    <option value="10">10 runs</option>
    <option value="100" selected>100 runs</option>
    <option value="500">500 runs</option>
</select>

<button onclick="runAll()">RUN ALL</button>
<button onclick="replay()">REPLAY CHECKPOINT</button>
<button onclick="stopRun()">STOP</button>
<button onclick="clearLog()">CLEAR</button>

<div id="sandbox"></div>
<div id="log"></div>

<script>
"use strict";

const logBox = document.getElementById("log");
const sandbox = document.getElementById("sandbox");

let stopping = false;

let stats = {
    pass:0,
    fail:0,
    exception:0
};

function log(s, cls="") {
    const d = document.createElement("div");
    d.textContent = s;
    d.className = cls;
    logBox.appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
}

function clearLog() {
    logBox.innerHTML = "";
}

function stopRun() {
    stopping = true;
    log("STOP REQUESTED", "warn");
}

/* ---------------------------
   Persistent checkpoint
---------------------------- */

function saveCP(test, iteration, phase, state="RUNNING") {

    try {
        localStorage.setItem(
            "ps5-v12-cp",
            JSON.stringify({
                test,
                iteration,
                phase,
                state,
                time:Date.now()
            })
        );
    } catch(e) {}
}

function getCP() {

    try {

        const s =
            localStorage.getItem(
                "ps5-v12-cp"
            );

        return s ?
            JSON.parse(s) :
            null;

    } catch(e) {

        return null;
    }
}

function showPrevious() {

    const c = getCP();

    if (!c || c.state !== "RUNNING")
        return;

    log(
        "********************************",
        "bad"
    );

    log(
        "PREVIOUS EXECUTION INCOMPLETE",
        "bad"
    );

    log("TEST: " + c.test, "bad");
    log("ITERATION: " + c.iteration, "bad");
    log("PHASE: " + c.phase, "bad");

    log(
        "********************************",
        "bad"
    );
}

/* ---------------------------
   Capability fingerprint
---------------------------- */

function capabilities() {

    log("CAPABILITIES", "info");

    log(
        "UA: " +
        navigator.userAgent
    );

    log(
        "ArrayBuffer: " +
        typeof ArrayBuffer
    );

    log(
        "DataView: " +
        typeof DataView
    );

    log(
        "BigInt: " +
        typeof BigInt
    );

    log(
        "FontFace: " +
        typeof FontFace
    );

    log(
        "Worker: " +
        typeof Worker
    );

    log(
        "WebAssembly: " +
        typeof WebAssembly
    );

    log("");
}

/* ===========================
   TEST 1
   Typed-array lifetime
=========================== */

async function typedLifetime(i) {

    saveCP(
        "typedLifetime",
        i,
        "allocate"
    );

    const buffer =
        new ArrayBuffer(0x4000);

    const a =
        new Uint8Array(buffer);

    const b =
        new Uint32Array(buffer);

    const dv =
        new DataView(buffer);

    saveCP(
        "typedLifetime",
        i,
        "write"
    );

    for (let x=0; x<256; x++)
        a[x] = (x+i) & 255;

    dv.setUint32(
        0x100,
        0x41424344,
        true
    );

    saveCP(
        "typedLifetime",
        i,
        "verify"
    );

    if (
        dv.getUint32(
            0x100,
            true
        ) !== 0x41424344
    )
        return false;

    for (let x=0; x<64; x++) {
        const n = b[x];
        void n;
    }

    return true;
}

/* ===========================
   TEST 2
   DOM wrapper lifetime
=========================== */

async function wrapperLifetime(i) {

    saveCP(
        "wrapperLifetime",
        i,
        "create"
    );

    const outer =
        document.createElement("div");

    const inner =
        document.createElement("span");

    inner.textContent =
        "wrapper-" + i;

    outer.appendChild(inner);
    sandbox.appendChild(outer);

    saveCP(
        "wrapperLifetime",
        i,
        "detach"
    );

    outer.remove();

    saveCP(
        "wrapperLifetime",
        i,
        "mutate-detached"
    );

    inner.textContent =
        "detached-" + i;

    outer.appendChild(
        document.createTextNode("x")
    );

    return (
        inner.textContent ===
        "detached-" + i
    );
}

/* ===========================
   TEST 3
   Document replacement
=========================== */

async function documentLifetime(i) {

    saveCP(
        "documentLifetime",
        i,
        "iframe"
    );

    const frame =
        document.createElement("iframe");

    sandbox.appendChild(frame);

    await new Promise(
        r => setTimeout(r,0)
    );

    const doc =
        frame.contentDocument;

    if (!doc) {
        frame.remove();
        return false;
    }

    const retained =
        doc.createElement("div");

    retained.textContent =
        "old-" + i;

    doc.body.appendChild(retained);

    saveCP(
        "documentLifetime",
        i,
        "replace-document"
    );

    doc.open();

    doc.write(
        "<!doctype html><body>" +
        "<p>replacement</p>"
    );

    doc.close();

    saveCP(
        "documentLifetime",
        i,
        "retained-wrapper"
    );

    retained.textContent =
        "after-" + i;

    const result =
        retained.textContent;

    saveCP(
        "documentLifetime",
        i,
        "remove-frame"
    );

    frame.remove();

    return result === "after-" + i;
}

/* ===========================
   TEST 4
   Range lifetime
=========================== */

async function rangeLifetime(i) {

    saveCP(
        "rangeLifetime",
        i,
        "create"
    );

    const host =
        document.createElement("div");

    const text =
        document.createTextNode(
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        );

    host.appendChild(text);
    sandbox.appendChild(host);

    const range =
        document.createRange();

    range.setStart(text, 3);
    range.setEnd(text, 20);

    saveCP(
        "rangeLifetime",
        i,
        "remove-tree"
    );

    host.remove();

    saveCP(
        "rangeLifetime",
        i,
        "mutate"
    );

    text.data =
        "abcdefghijklmnopqrstuvwxyz";

    saveCP(
        "rangeLifetime",
        i,
        "inspect"
    );

    const value =
        range.toString();

    return (
        typeof value === "string"
    );
}

/* ===========================
   TEST 5
   Font object lifecycle
=========================== */

async function fontLifetime(i) {

    if (typeof FontFace !== "function")
        return true;

    saveCP(
        "fontLifetime",
        i,
        "construct"
    );

    const face =
        new FontFace(
            "V12Font" + i,
            "local(Arial)"
        );

    saveCP(
        "fontLifetime",
        i,
        "add"
    );

    document.fonts.add(face);

    const e =
        document.createElement("span");

    e.style.fontFamily =
        "V12Font" + i;

    e.textContent =
        "font-" + i;

    sandbox.appendChild(e);

    saveCP(
        "fontLifetime",
        i,
        "layout"
    );

    void e.offsetWidth;

    saveCP(
        "fontLifetime",
        i,
        "remove"
    );

    e.remove();

    document.fonts.delete(face);

    return true;
}

/* ===========================
   TEST 6
   Event re-entry/lifetime
=========================== */

async function eventLifetime(i) {

    saveCP(
        "eventLifetime",
        i,
        "create"
    );

    const parent =
        document.createElement("div");

    const target =
        document.createElement("button");

    parent.appendChild(target);
    sandbox.appendChild(parent);

    let fired = false;

    target.addEventListener(
        "v12",
        function() {

            saveCP(
                "eventLifetime",
                i,
                "callback"
            );

            parent.remove();

            target.textContent =
                "detached";

            fired = true;
        }
    );

    saveCP(
        "eventLifetime",
        i,
        "dispatch"
    );

    target.dispatchEvent(
        new Event(
            "v12",
            {bubbles:true}
        )
    );

    return fired;
}

/* --------------------------- */

const tests = [
    ["typedLifetime", typedLifetime],
    ["wrapperLifetime", wrapperLifetime],
    ["documentLifetime", documentLifetime],
    ["rangeLifetime", rangeLifetime],
    ["fontLifetime", fontLifetime],
    ["eventLifetime", eventLifetime]
];

async function execute(name, fn, i) {

    saveCP(
        name,
        i,
        "BEGIN"
    );

    try {

        const result =
            await fn(i);

        if (result) {

            stats.pass++;

        } else {

            stats.fail++;

            log(
                "[FAIL] " +
                name +
                " #" + i,
                "bad"
            );

            stopping = true;
        }

    } catch(e) {

        stats.exception++;

        log(
            "[EXCEPTION] " +
            name +
            " #" + i +
            " : " + e,
            "bad"
        );

        stopping = true;
    }

    saveCP(
        name,
        i,
        "COMPLETE",
        "COMPLETE"
    );
}

/* --------------------------- */

async function runAll() {

    clearLog();

    showPrevious();

    capabilities();

    stopping = false;

    stats = {
        pass:0,
        fail:0,
        exception:0
    };

    const runs =
        Number(
            document.getElementById(
                "runs"
            ).value
        );

    log(
        "V12 START",
        "info"
    );

    log(
        "Runs/test: " +
        runs
    );

    log("");

    const start =
        performance.now();

    for (
        const [name,fn]
        of tests
    ) {

        if (stopping)
            break;

        log(
            ">>> " + name,
            "info"
        );

        for (
            let i=0;
            i<runs &&
            !stopping;
            i++
        ) {

            await execute(
                name,
                fn,
                i
            );

            if (i % 10 === 0) {

                log(
                    name +
                    " " +
                    i +
                    "/" +
                    runs
                );

                await new Promise(
                    r => setTimeout(r,0)
                );
            }
        }
    }

    const runtime =
        performance.now() -
        start;

    log("");

    log(
        "======= V12 RESULT =======",
        "info"
    );

    log(
        "PASS:       " +
        stats.pass,
        "ok"
    );

    log(
        "FAIL:       " +
        stats.fail,
        stats.fail ?
            "bad":"ok"
    );

    log(
        "EXCEPTIONS: " +
        stats.exception,
        stats.exception ?
            "bad":"ok"
    );

    log(
        "RUNTIME:    " +
        runtime.toFixed(0) +
        " ms"
    );

    log(
        "==========================",
        "info"
    );
}

/* --------------------------- */

async function replay() {

    clearLog();

    const cp =
        getCP();

    if (!cp) {

        log(
            "No checkpoint.",
            "warn"
        );

        return;
    }

    const entry =
        tests.find(
            t => t[0] === cp.test
        );

    if (!entry) {

        log(
            "Unknown checkpoint test.",
            "bad"
        );

        return;
    }

    log(
        "REPLAYING CHECKPOINT",
        "warn"
    );

    log(
        "TEST: " +
        cp.test
    );

    log(
        "ITERATION: " +
        cp.iteration
    );

    log(
        "PHASE: " +
        cp.phase
    );

    stopping = false;

    for (
        let i=0;
        i<=cp.iteration &&
        !stopping;
        i++
    ) {

        await execute(
            entry[0],
            entry[1],
            i
        );

        await new Promise(
            r => setTimeout(r,0)
        );
    }

    if (!stopping)
        log(
            "Replay completed.",
            "ok"
        );
}

showPrevious();

</script>
</body>
</html>
