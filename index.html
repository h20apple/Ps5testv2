<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V33.1 SSV UAF Crash Detector</title>

<style>
body {
    background:#111;
    color:#eee;
    font:15px monospace;
    padding:18px
}
button {
    font:18px monospace;
    padding:10px 18px
}
#status {
    padding:10px;
    border:1px solid #555;
    margin:15px 0
}
pre {
    white-space:pre-wrap;
    word-break:break-word
}
input,.focusTarget {
    position:absolute;
    left:-5000px
}
</style>

<h2>PS5 13.60 — V33.1</h2>
<div>SSV lifetime / natural-crash detector</div>

<p><button id="run">RUN V33.1</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

/*
 * V33.1
 *
 * SerializedScriptValue lifetime diagnostic.
 *
 * Goal:
 * Detect a naturally observable crash or state/lifetime
 * inconsistency around:
 *
 * same-document traversal
 *      ->
 * focus transition / blur
 *      ->
 * replaceState()
 *
 * Deliberately DOES NOT:
 *   reclaim freed native objects
 *   spray the heap
 *   disclose addresses
 *   construct arbitrary read/write
 *   execute native code
 */

const logBox = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const runButton = document.querySelector("#run");

let anomalies = 0;
let exceptions = 0;
let completed = 0;

function log(x) {
    logBox.textContent += x + "\n";
    console.log(x);
}

function checkpoint(x) {
    try {
        localStorage.setItem(
            "PS5_V331_CHECKPOINT",
            x
        );
    } catch (_) {}

    log("[CP] " + x);
}

function delay(ms) {
    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

function stateInfo(x) {

    try {

        if (!x)
            return String(x);

        return JSON.stringify({
            marker:x.marker,
            run:x.run,
            size:
                typeof x.data === "string"
                ? x.data.length
                : -1,
            value:
                x.nested &&
                x.nested.value
        });

    } catch(e) {

        return "STATE_ERROR:" + e.name;
    }
}

function makeState(
    marker,
    run,
    size,
    value
) {

    return {
        marker,
        run,
        data:"X".repeat(size),

        nested:{
            value,
            text:"V331"
        },

        array:[
            run,
            run + 1,
            run + 2,
            run + 3
        ]
    };
}


/*
 * Each case performs only one traversal.
 *
 * We vary serialized-state size rather than
 * performing allocator manipulation.
 */

async function runCase(
    number,
    size
) {

    const prefix =
        "CASE_" + number;

    checkpoint(
        prefix + ":CREATE"
    );

    const input =
        document.createElement("input");

    const target =
        document.createElement("div");

    target.tabIndex = -1;
    target.className = "focusTarget";

    document.body.appendChild(input);
    document.body.appendChild(target);

    const original =
        makeState(
            "ORIGINAL",
            number,
            size,
            0x1000 + number
        );

    const second =
        makeState(
            "SECOND",
            number,
            size,
            0x2000 + number
        );

    const replacement =
        makeState(
            "REPLACEMENT",
            number,
            size,
            0x3000 + number
        );

    let blurCount = 0;
    let popCount = 0;
    let replacementReturned = false;
    let eventState = null;

    function blurHandler() {

        blurCount++;

        checkpoint(
            prefix +
            ":BLUR_ENTER"
        );

        log(
            "[" + prefix +
            "] before replace = " +
            stateInfo(history.state)
        );

        try {

            checkpoint(
                prefix +
                ":BEFORE_REPLACE"
            );

            history.replaceState(
                replacement,
                "",
                location.href
            );

            replacementReturned = true;

            checkpoint(
                prefix +
                ":AFTER_REPLACE"
            );

            log(
                "[" + prefix +
                "] after replace = " +
                stateInfo(history.state)
            );

        } catch(e) {

            exceptions++;

            log(
                "[" + prefix +
                "] replace exception: " +
                e
            );
        }

        checkpoint(
            prefix +
            ":BLUR_EXIT"
        );
    }

    input.addEventListener(
        "blur",
        blurHandler,
        {once:true}
    );

    const popPromise =
        new Promise(resolve => {

            function handler(e) {

                window.removeEventListener(
                    "popstate",
                    handler
                );

                popCount++;

                eventState =
                    e.state;

                checkpoint(
                    prefix +
                    ":POPSTATE"
                );

                log(
                    "[" + prefix +
                    "] event.state = " +
                    stateInfo(e.state)
                );

                log(
                    "[" + prefix +
                    "] history.state = " +
                    stateInfo(history.state)
                );

                resolve();
            }

            window.addEventListener(
                "popstate",
                handler
            );
        });

    try {

        checkpoint(
            prefix +
            ":BASE_STATE"
        );

        history.replaceState(
            original,
            "",
            "#v331-" +
            number +
            "-base"
        );

        checkpoint(
            prefix +
            ":PUSH_STATE"
        );

        history.pushState(
            second,
            "",
            "#v331-" +
            number +
            "-second"
        );

        input.focus();

        await delay(40);

        checkpoint(
            prefix +
            ":BEFORE_BACK"
        );

        history.back();

        checkpoint(
            prefix +
            ":BACK_RETURNED"
        );

        /*
         * Trigger the focus transition which
         * produces the blur callback.
         */

        target.focus();

        checkpoint(
            prefix +
            ":FOCUS_CHANGED"
        );

        await Promise.race([
            popPromise,
            delay(1500)
        ]);

        checkpoint(
            prefix +
            ":VERIFY"
        );

        log(
            "[" + prefix +
            "] blur=" +
            blurCount +
            " pop=" +
            popCount +
            " replaceReturned=" +
            replacementReturned
        );

        /*
         * Check the ordinary JS objects themselves.
         */

        if (
            original.marker !== "ORIGINAL" ||
            original.data.length !== size ||
            original.nested.value !==
                0x1000 + number
        ) {

            anomalies++;

            log(
                "[ANOMALY] " +
                prefix +
                " original JS object changed"
            );
        }

        if (
            replacement.marker !==
                "REPLACEMENT" ||
            replacement.data.length !== size
        ) {

            anomalies++;

            log(
                "[ANOMALY] " +
                prefix +
                " replacement JS object changed"
            );
        }

        if (blurCount !== 1) {

            anomalies++;

            log(
                "[ANOMALY] " +
                prefix +
                " blurCount=" +
                blurCount
            );
        }

        if (!replacementReturned) {

            anomalies++;

            log(
                "[ANOMALY] " +
                prefix +
                " replaceState did not return"
            );
        }

        if (popCount !== 1) {

            anomalies++;

            log(
                "[ANOMALY] " +
                prefix +
                " popCount=" +
                popCount
            );
        }

        if (
            eventState &&
            typeof eventState.marker
            !== "string"
        ) {

            anomalies++;

            log(
                "[ANOMALY] " +
                prefix +
                " malformed event.state"
            );
        }

        completed++;

        checkpoint(
            prefix +
            ":COMPLETE"
        );

    } catch(e) {

        exceptions++;

        log(
            "[EXCEPTION] " +
            prefix +
            " :: " +
            e
        );

        checkpoint(
            prefix +
            ":EXCEPTION"
        );

    } finally {

        try {
            input.remove();
            target.remove();
        } catch (_) {}
    }
}


async function run() {

    runButton.disabled = true;

    logBox.textContent = "";

    anomalies = 0;
    exceptions = 0;
    completed = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    const previous =
        localStorage.getItem(
            "PS5_V331_CHECKPOINT"
        );

    if (previous) {

        log(
            "PREVIOUS CHECKPOINT: " +
            previous
        );

        log("");
    }

    log("PS5 13.60 — V33.1");
    log("SSV LIFETIME / NATURAL CRASH DETECTOR");
    log(navigator.userAgent);
    log("");

    /*
     * A small matrix of ordinary serialized-state
     * sizes. This is intentionally NOT a heap spray.
     */

    const sizes = [
        1024,
        4096,
        16384,
        65536
    ];

    for (
        let i = 0;
        i < sizes.length;
        i++
    ) {

        log("");
        log(
            "=== CASE " +
            (i + 1) +
            " / size " +
            sizes[i] +
            " ==="
        );

        await runCase(
            i + 1,
            sizes[i]
        );

        /*
         * Avoid History API rate limiting.
         */

        await delay(800);
    }

    checkpoint(
        "V33.1:COMPLETE"
    );

    log("");
    log("============================");
    log("V33.1 RESULT");
    log("============================");

    log(
        "CASES COMPLETED: " +
        completed +
        "/4"
    );

    log(
        "EXCEPTIONS: " +
        exceptions
    );

    log(
        "ANOMALIES: " +
        anomalies
    );

    log("============================");

    statusBox.textContent =
        exceptions || anomalies
        ? "STATUS: CHECK RESULT"
        : "STATUS: NORMAL";

    runButton.disabled = false;
}

runButton.onclick = run;
</script>
