<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 V15 SerializedScriptValue Regression</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:17px monospace;
    padding:20px;
}
button {
    font:17px monospace;
    padding:10px 18px;
}
#log {
    background:#17233a;
    margin-top:15px;
    padding:15px;
    white-space:pre-wrap;
}
.ok { color:#59ff7a; }
.bad { color:#ff6868; }
.info { color:#63caff; }
.warn { color:#ffd166; }
</style>
</head>

<body>

<h2>PS5 13.60 — V15 SSV Regression</h2>

<button onclick="runV15()">RUN V15</button>

<div id="log"></div>

<script>
"use strict";

const KEY = "PS5_V15_CHECKPOINT";
const box = document.getElementById("log");

function log(text, cls="") {
    const d = document.createElement("div");
    d.textContent = text;
    d.className = cls;
    box.appendChild(d);
}

function checkpoint(phase) {
    try {
        localStorage.setItem(KEY, JSON.stringify({
            state: "RUNNING",
            phase: phase,
            time: Date.now()
        }));
    } catch(e) {}
}

function complete() {
    try {
        localStorage.setItem(KEY, JSON.stringify({
            state: "COMPLETE",
            time: Date.now()
        }));
    } catch(e) {}
}

function showPrevious() {
    try {
        const cp = JSON.parse(
            localStorage.getItem(KEY)
        );

        if (cp && cp.state === "RUNNING") {
            log(
                "PREVIOUS RUN DID NOT COMPLETE",
                "bad"
            );

            log(
                "LAST CHECKPOINT: " + cp.phase,
                "bad"
            );

            log(
                "Do not immediately rerun it.",
                "warn"
            );
        }
    } catch(e) {}
}

async function runV15() {

    box.innerHTML = "";

    showPrevious();

    log("V15 START", "info");
    log(navigator.userAgent);
    log("");

    try {

        /*
         * Historical WebKit SerializedScriptValue
         * regression concept.
         *
         * Based on:
         *
         * fast/history/replacestate-nocrash.html
         *
         * No heap spray.
         * No memory inspection.
         * No arbitrary R/W.
         */

        checkpoint("INSTALL_SETTER");

        let callbackCount = 0;

        Object.prototype.__defineSetter__(
            "foo",
            function() {

                callbackCount++;

                checkpoint(
                    "SETTER_CALLBACK_" +
                    callbackCount
                );

                history.replaceState(
                    "",
                    ""
                );
            }
        );

        log(
            "Setter installed",
            "ok"
        );

        checkpoint("CREATE_STATE");

        /*
         * Keep this deliberately modest.
         *
         * The historical testcase used a large
         * string. We're reproducing the control
         * flow rather than attempting allocator
         * manipulation.
         */

        const state = {
            foo: 1,
            zzz: "A".repeat(1024 * 1024)
        };

        log(
            "State object created",
            "ok"
        );

        checkpoint(
            "FIRST_REPLACE_STATE"
        );

        history.replaceState(
            state,
            "",
            location.pathname + "#v15"
        );

        log(
            "replaceState returned",
            "ok"
        );

        checkpoint(
            "READ_HISTORY_STATE"
        );

        const returned =
            history.state;

        log(
            "history.state returned",
            "ok"
        );

        checkpoint(
            "PROPERTY_ACCESS"
        );

        /*
         * Exercise the returned structured-clone
         * value normally.
         */

        const foo =
            returned ?
            returned.foo :
            undefined;

        const len =
            returned &&
            returned.zzz ?
            returned.zzz.length :
            -1;

        checkpoint(
            "VERIFY_RESULT"
        );

        log(
            "foo = " + foo
        );

        log(
            "zzz.length = " + len
        );

        log(
            "setter callbacks = " +
            callbackCount
        );

        /*
         * Cleanup the prototype modification.
         */

        checkpoint("CLEANUP");

        delete Object.prototype.foo;

        history.replaceState(
            null,
            "",
            location.pathname
        );

        complete();

        log("");
        log(
            "====== V15 RESULT ======",
            "info"
        );

        log(
            "STATUS: NORMAL",
            "ok"
        );

        log(
            "CALLBACKS: " +
            callbackCount
        );

        log(
            "========================",
            "info"
        );

    } catch(e) {

        checkpoint(
            "JS_EXCEPTION: " +
            String(e)
        );

        log("");
        log(
            "V15 JS EXCEPTION",
            "bad"
        );

        log(
            String(e),
            "bad"
        );

        /*
         * Try to restore Object.prototype.
         */

        try {
            delete Object.prototype.foo;
        } catch(x) {}
    }
}

showPrevious();

</script>

</body>
</html>
