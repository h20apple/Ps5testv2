<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 — V22 Frame Lifetime Probe</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:16px monospace;
    padding:10px;
}
#log {
    margin-top:12px;
    padding:14px;
    background:#17233a;
    white-space:pre-wrap;
}
.ok   { color:#59ff7a; }
.bad  { color:#ff6868; }
.info { color:#63caff; }
.warn { color:#ffd166; }
</style>
</head>

<body>

<h2>PS5 13.60 — V22 Frame Lifetime Probe</h2>

<button onclick="runV22()">RUN V22</button>

<div id="log"></div>
<div id="host"></div>

<script>
"use strict";

const KEY = "PS5_V22_CHECKPOINT";

const logBox = document.getElementById("log");
const host = document.getElementById("host");

let seq = 0;
let pass = 0;
let exceptions = 0;
let anomalies = 0;

function log(s, cls="") {
    const d = document.createElement("div");
    d.textContent = s;
    d.className = cls;
    logBox.appendChild(d);
}

function cp(test, phase) {

    seq++;

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"RUNNING",
                test:test,
                phase:phase,
                sequence:seq,
                time:Date.now()
            })
        );
    } catch(e) {}

    log(
        seq + ": [" + test + "] " + phase,
        "info"
    );
}

function completed() {

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"COMPLETE",
                time:Date.now()
            })
        );
    } catch(e) {}
}

function previous() {

    try {

        const raw = localStorage.getItem(KEY);

        if (!raw)
            return;

        const x = JSON.parse(raw);

        if (x.status === "RUNNING") {

            log(
                "********************************",
                "bad"
            );

            log(
                "PREVIOUS V22 DID NOT COMPLETE",
                "bad"
            );

            log(
                "TEST: " + x.test,
                "bad"
            );

            log(
                "LAST PHASE: " + x.phase,
                "bad"
            );

            log(
                "********************************",
                "bad"
            );
        }

    } catch(e) {}
}

function delay(ms) {
    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

function makeFrame() {

    const f = document.createElement("iframe");

    f.srcdoc =
        "<!doctype html>" +
        "<html><body>" +
        "<div id='inside'>FRAME_OK</div>" +
        "<input id='input'>" +
        "</body></html>";

    host.appendChild(f);

    return f;
}

function waitFrame(frame) {

    return new Promise((resolve,reject) => {

        const timer = setTimeout(
            () => reject(
                new Error("FRAME_LOAD_TIMEOUT")
            ),
            4000
        );

        frame.onload = function() {
            clearTimeout(timer);
            resolve();
        };
    });
}


/* TEST A
 *
 * Keep contentWindow/document references,
 * then remove iframe.
 */

async function testA() {

    const name = "A_RETAIN_AFTER_REMOVE";

    cp(name,"CREATE_FRAME");

    const frame = makeFrame();

    await waitFrame(frame);

    cp(name,"FRAME_LOADED");

    const win = frame.contentWindow;
    const doc = frame.contentDocument;

    const inside =
        doc.getElementById("inside");

    cp(name,"REFERENCES_CAPTURED");

    if (
        !inside ||
        inside.textContent !== "FRAME_OK"
    ) {
        anomalies++;
        log("Initial frame state unexpected","bad");
    }

    cp(name,"REMOVE_FRAME");

    frame.remove();

    cp(name,"FRAME_REMOVED");

    await Promise.resolve();

    cp(name,"READ_RETAINED_REFERENCES");

    /*
     * Merely observe JS-visible state.
     */

    try {
        void win.closed;
        void doc.readyState;
        void inside.textContent;
    } catch(e) {
        exceptions++;
        log(
            "Retained reference exception: " +
            e.name + ": " + e.message,
            "warn"
        );
    }

    cp(name,"COMPLETE");
    pass++;
}


/* TEST B
 *
 * Remove iframe from an event dispatched
 * inside its own document.
 */

async function testB() {

    const name = "B_EVENT_REMOVAL";

    cp(name,"CREATE_FRAME");

    const frame = makeFrame();

    await waitFrame(frame);

    const win = frame.contentWindow;
    const doc = frame.contentDocument;

    const input =
        doc.getElementById("input");

    cp(name,"INSTALL_EVENT");

    input.addEventListener(
        "focus",
        function() {

            cp(name,"FOCUS_ENTER");

            frame.remove();

            cp(name,"FRAME_REMOVED_IN_EVENT");

            /*
             * Observe references while the
             * callback is still executing.
             */

            void doc.readyState;
            void win.closed;

            cp(name,"FOCUS_EXIT");
        }
    );

    cp(name,"BEFORE_FOCUS");

    input.focus();

    cp(name,"AFTER_FOCUS");

    await delay(100);

    cp(name,"COMPLETE");
    pass++;
}


/* TEST C
 *
 * Replace iframe document while retaining
 * references to the old document/nodes.
 */

async function testC() {

    const name = "C_DOCUMENT_REPLACE";

    cp(name,"CREATE_FRAME");

    const frame = makeFrame();

    await waitFrame(frame);

    const win = frame.contentWindow;

    const oldDoc =
        frame.contentDocument;

    const oldNode =
        oldDoc.getElementById("inside");

    cp(name,"OLD_REFERENCES_CAPTURED");

    const newDoc =
        win.document;

    cp(name,"DOCUMENT_OPEN");

    newDoc.open();

    cp(name,"DOCUMENT_WRITE");

    newDoc.write(
        "<!doctype html>" +
        "<html><body>" +
        "<div id='new'>NEW_DOCUMENT</div>" +
        "</body></html>"
    );

    cp(name,"DOCUMENT_CLOSE");

    newDoc.close();

    cp(name,"READ_OLD_REFERENCES");

    try {
        void oldDoc.readyState;
        void oldNode.textContent;
        void oldNode.ownerDocument;
    } catch(e) {

        exceptions++;

        log(
            "Old document exception: " +
            e.name + ": " + e.message,
            "warn"
        );
    }

    cp(name,"CHECK_NEW_DOCUMENT");

    const n =
        frame.contentDocument
             .getElementById("new");

    if (
        !n ||
        n.textContent !== "NEW_DOCUMENT"
    ) {
        anomalies++;
        log(
            "New document mismatch",
            "bad"
        );
    }

    frame.remove();

    cp(name,"COMPLETE");
    pass++;
}


/* TEST D
 *
 * Remove and then reattach the same iframe
 * element while retaining old references.
 */

async function testD() {

    const name = "D_REMOVE_REATTACH";

    cp(name,"CREATE_FRAME");

    const frame = makeFrame();

    await waitFrame(frame);

    const oldWin =
        frame.contentWindow;

    const oldDoc =
        frame.contentDocument;

    cp(name,"REMOVE");

    frame.remove();

    await Promise.resolve();

    cp(name,"REATTACH");

    host.appendChild(frame);

    await delay(150);

    cp(name,"READ_REFERENCES");

    try {

        void oldWin.closed;
        void oldDoc.readyState;

        const currentWin =
            frame.contentWindow;

        void currentWin.closed;

    } catch(e) {

        exceptions++;

        log(
            "Reattach exception: " +
            e.name + ": " + e.message,
            "warn"
        );
    }

    frame.remove();

    cp(name,"COMPLETE");
    pass++;
}


async function runV22() {

    logBox.innerHTML = "";
    host.innerHTML = "";

    previous();

    seq = 0;
    pass = 0;
    exceptions = 0;
    anomalies = 0;

    log("V22 START","info");
    log(navigator.userAgent);
    log("");

    try {

        await testA();
        await delay(200);

        await testB();
        await delay(200);

        await testC();
        await delay(200);

        await testD();

        completed();

        log("");
        log(
            "======= V22 RESULT =======",
            "info"
        );

        log(
            "STATUS: " +
            (
                anomalies === 0
                    ? "NORMAL"
                    : "ANOMALY"
            ),
            anomalies === 0
                ? "ok"
                : "bad"
        );

        log("TESTS COMPLETED: 4");
        log("PASS: " + pass);
        log("EXCEPTIONS: " + exceptions);
        log("ANOMALIES: " + anomalies);

        log(
            "==========================",
            "info"
        );

    } catch(e) {

        cp(
            "HARNESS",
            "UNCAUGHT_EXCEPTION"
        );

        log("");
        log("V22 STOPPED","bad");

        log(
            e.name + ": " + e.message,
            "bad"
        );
    }
}

previous();

</script>
</body>
</html>
