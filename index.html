<!doctype html>
<meta charset="utf-8">
<title>PS5 WebKit 13.60 V7</title>

<style>
body {
  background:#101827;
  color:#eee;
  font:17px monospace;
  padding:20px
}
button,select {
  font:17px monospace;
  padding:10px;
  margin:4px
}
#log {
  background:#17233a;
  padding:15px;
  white-space:pre-wrap
}
.ok {color:#59ff7a}
.bad {color:#ff6868}
.info {color:#63caff}
.warn {color:#ffd166}

/* Based on the behaviour exercised by the
   upstream WebKit regression testcase. */

.v7box {
  position:absolute;
  left:-10000px;
  width:20px;
  height:20px;

  -webkit-animation-duration:0.02s;
  -webkit-animation-name:v7move;
}

@-webkit-keyframes v7move {
  from {
    -webkit-transform:translate(0,0);
  }
  to {
    -webkit-transform:translate(10px,0);
  }
}
</style>

<h2>PS5 WebKit 13.60 — V7</h2>

<select id="runs">
<option value="10">10 runs</option>
<option value="100" selected>100 runs</option>
<option value="500">500 runs</option>
<option value="2000">2000 runs</option>
</select>

<button onclick="start()">Run upstream regression</button>
<button onclick="stopRun()">Stop</button>
<button onclick="clearLog()">Clear</button>

<div id="sandbox"></div>
<div id="log"></div>

<script>
"use strict";

const output =
  document.getElementById("log");

const sandbox =
  document.getElementById("sandbox");

let stopping=false;

let stats={
  pass:0,
  fail:0,
  timeout:0,
  exceptions:0
};

function log(text,cls="") {
  const e=document.createElement("div");
  e.textContent=text;
  e.className=cls;
  output.appendChild(e);
}

function clearLog() {
  output.innerHTML="";
}

function stopRun() {
  stopping=true;
  log("STOP requested","warn");
}

/*
 Keep a checkpoint BEFORE the operation.

 If WebContent disappears before COMPLETE
 is written, reopening the page exposes the
 last testcase/iteration.
*/

function checkpoint(iter,state) {

  try {

    localStorage.setItem(
      "v7-checkpoint",
      JSON.stringify({
        test:
          "animation-start-event-destroy-renderer",
        iteration:iter,
        state:state,
        time:Date.now()
      })
    );

  } catch(e) {}
}

function showPrevious() {

  try {

    const raw=
      localStorage.getItem(
        "v7-checkpoint"
      );

    if(!raw)
      return;

    const c=JSON.parse(raw);

    if(c.state==="RUNNING") {

      log(
        "PREVIOUS RUN DID NOT COMPLETE",
        "warn"
      );

      log(
        "Test: "+c.test,
        "warn"
      );

      log(
        "Iteration: "+
        c.iteration,
        "warn"
      );
    }

  } catch(e) {}
}

/*
 Adaptation of WebKit's
 animation-start-event-destroy-renderer
 regression behaviour.

 Element A is removed from its animation
 callback.

 Element B has its renderer hidden from
 its animation callback.
*/

function regressionCase(iter) {

  return new Promise(resolve=>{

    const container=
      document.createElement("div");

    const a=
      document.createElement("div");

    const b=
      document.createElement("div");

    a.className="v7box";
    b.className="v7box";

    /*
     Give each iteration unique animation
     names so WebKit must establish fresh
     animation state.
    */

    a.style.webkitAnimationName=
      "v7move";

    b.style.webkitAnimationName=
      "v7move";

    container.appendChild(a);
    container.appendChild(b);

    sandbox.appendChild(container);

    let completed=0;
    let finished=false;

    function done() {

      completed++;

      if(completed!==2)
        return;

      if(finished)
        return;

      finished=true;

      clearTimeout(timer);

      try {
        container.remove();
      } catch(e) {}

      resolve(true);
    }

    a.addEventListener(
      "webkitAnimationStart",
      function handler(){

        a.removeEventListener(
          "webkitAnimationStart",
          handler
        );

        /*
         Critical regression operation:
         destroy/remove the element while
         its animation callback executes.
        */

        if(a.parentNode)
          a.parentNode.removeChild(a);

        done();
      },
      false
    );

    b.addEventListener(
      "webkitAnimationStart",
      function handler(){

        b.removeEventListener(
          "webkitAnimationStart",
          handler
        );

        /*
         Second upstream behaviour:
         destroy/hide its renderer during
         the callback.
        */

        b.style.display="none";

        done();
      },
      false
    );

    /*
     Force style/layout observation after
     insertion.
    */

    void container.offsetHeight;

    const timer=setTimeout(()=>{

      if(finished)
        return;

      finished=true;

      try {
        container.remove();
      } catch(e) {}

      resolve(false);

    },1000);
  });
}

async function start() {

  clearLog();
  showPrevious();

  stopping=false;

  stats={
    pass:0,
    fail:0,
    timeout:0,
    exceptions:0
  };

  const runs=
    Number(
      document.getElementById(
        "runs"
      ).value
    );

  log(
    "V7 upstream regression test",
    "info"
  );

  log(
    "Test: animation-start-event-destroy-renderer"
  );

  log(
    "UA: "+navigator.userAgent
  );

  log(
    "Runs: "+runs
  );

  log("");

  for(let i=0;i<runs;i++) {

    if(stopping)
      break;

    checkpoint(
      i,
      "RUNNING"
    );

    try {

      const result=
        await regressionCase(i);

      if(result) {

        stats.pass++;

      } else {

        stats.timeout++;

        log(
          "[TIMEOUT] iteration "+
          i,
          "warn"
        );
      }

    } catch(e) {

      stats.exceptions++;

      log(
        "[EXCEPTION] iteration "+
        i+
        ": "+
        e,
        "bad"
      );
    }

    checkpoint(
      i,
      "COMPLETE"
    );

    if(i%10===0) {

      log(
        "Iteration "+
        i+
        "/"+
        runs,
        "info"
      );

      await new Promise(
        r=>setTimeout(r,0)
      );
    }
  }

  log("");
  log(
    "======= V7 RESULT =======",
    "info"
  );

  log(
    "PASS:       "+
    stats.pass,
    "ok"
  );

  log(
    "TIMEOUT:    "+
    stats.timeout,
    stats.timeout ?
      "warn":"ok"
  );

  log(
    "EXCEPTIONS: "+
    stats.exceptions,
    stats.exceptions ?
      "bad":"ok"
  );

  log(
    "=========================",
    "info"
  );
}

showPrevious();

</script>
