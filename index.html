<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V26 SVG/SMIL Lifecycle Probe</title>

<style>
body {
    background:#111;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:16px 0;
    padding:12px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
svg {
    position:absolute;
    left:-10000px;
    top:-10000px;
}
</style>

<h2>PS5 WebKit V26</h2>
<div>SVG / SMIL lifecycle & re-entrancy probe</div>

<p>
<button id="run">RUN V26</button>
</p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const logBox = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const NS = "http://www.w3.org/2000/svg";

let pass = 0;
let exceptions = 0;
let anomalies = 0;
let current = "NONE";

function log(s) {
    logBox.textContent += s + "\n";
    console.log(s);
}

function checkpoint(name, stage) {
    current = name + ":" + stage;

    try {
        localStorage.setItem("PS5_V26_CHECKPOINT", current);
    } catch (_) {}

    log("[CP] " + current);
}

function ok(name) {
    pass++;
    log("[PASS] " + name);
}

function anomaly(name, text) {
    anomalies++;
    log("[ANOMALY] " + name + " :: " + text);
}

function exception(name, e) {
    exceptions++;
    log("[EXCEPTION] " + name + " :: " + e);
}

function svgElement(name) {
    return document.createElementNS(NS, name);
}

function forceLayout(node) {
    try {
        void node.getBoundingClientRect();
        void document.body.offsetHeight;
    } catch (_) {}
}

function cleanup(node) {
    try {
        if (node && node.parentNode)
            node.parentNode.removeChild(node);
    } catch (_) {}
}

async function delay(ms) {
    return new Promise(r => setTimeout(r, ms));
}


/* ---------------------------------------------------------
   A - remove animation target from beginEvent
   --------------------------------------------------------- */

async function testA() {

    const name = "A_REMOVE_TARGET_BEGIN";

    checkpoint(name, "CREATE");

    let svg, rect, anim;

    try {

        svg = svgElement("svg");
        svg.setAttribute("width", "100");
        svg.setAttribute("height", "100");

        rect = svgElement("rect");
        rect.setAttribute("width", "20");
        rect.setAttribute("height", "20");

        anim = svgElement("animate");

        anim.setAttribute("attributeName", "x");
        anim.setAttribute("from", "0");
        anim.setAttribute("to", "50");
        anim.setAttribute("dur", "0.05s");
        anim.setAttribute("begin", "indefinite");

        rect.appendChild(anim);
        svg.appendChild(rect);
        document.body.appendChild(svg);

        let fired = false;

        anim.addEventListener("beginEvent", function () {

            fired = true;

            checkpoint(name, "BEGIN_ENTER");

            rect.remove();

            checkpoint(name, "TARGET_REMOVED");

            /* retained references */
            void rect.ownerDocument;
            void anim.ownerDocument;

            forceLayout(svg);

            checkpoint(name, "BEGIN_EXIT");
        });

        checkpoint(name, "BEGIN_CALL");

        anim.beginElement();

        await delay(120);

        checkpoint(name, "VERIFY");

        if (!fired)
            log("[INFO] beginEvent not dispatched");

        ok(name);

    } catch(e) {

        exception(name, e);

    } finally {

        cleanup(svg);
    }
}


/* ---------------------------------------------------------
   B - remove entire SVG tree from animation callback
   --------------------------------------------------------- */

async function testB() {

    const name = "B_REMOVE_SVG_BEGIN";

    checkpoint(name, "CREATE");

    let svg, path, anim;

    try {

        svg = svgElement("svg");

        path = svgElement("path");
        path.setAttribute("d", "M0 0 L50 50");

        anim = svgElement("animate");

        anim.setAttribute("attributeName", "opacity");
        anim.setAttribute("from", "1");
        anim.setAttribute("to", "0");
        anim.setAttribute("dur", "0.05s");
        anim.setAttribute("begin", "indefinite");

        path.appendChild(anim);
        svg.appendChild(path);
        document.body.appendChild(svg);

        anim.addEventListener("beginEvent", function () {

            checkpoint(name, "CALLBACK_ENTER");

            svg.remove();

            checkpoint(name, "SVG_REMOVED");

            /* Read retained wrappers after removal. */
            void path.getAttribute("d");
            void anim.getAttribute("dur");

            forceLayout(document.body);

            checkpoint(name, "CALLBACK_EXIT");
        });

        anim.beginElement();

        await delay(120);

        checkpoint(name, "VERIFY");

        ok(name);

    } catch(e) {

        exception(name, e);

    } finally {

        cleanup(svg);
    }
}


/* ---------------------------------------------------------
   C - replace target subtree during callback
   --------------------------------------------------------- */

async function testC() {

    const name = "C_REPLACE_SUBTREE";

    checkpoint(name, "CREATE");

    let svg, group, rect, anim;

    try {

        svg = svgElement("svg");
        group = svgElement("g");
        rect = svgElement("rect");

        rect.setAttribute("width", "20");
        rect.setAttribute("height", "20");

        anim = svgElement("animate");

        anim.setAttribute("attributeName", "width");
        anim.setAttribute("from", "20");
        anim.setAttribute("to", "80");
        anim.setAttribute("dur", "0.05s");
        anim.setAttribute("begin", "indefinite");

        rect.appendChild(anim);
        group.appendChild(rect);
        svg.appendChild(group);
        document.body.appendChild(svg);

        anim.addEventListener("beginEvent", function () {

            checkpoint(name, "CALLBACK_ENTER");

            const oldRect = rect;

            group.textContent = "";

            checkpoint(name, "SUBTREE_CLEARED");

            const replacement = svgElement("circle");
            replacement.setAttribute("r", "10");

            group.appendChild(replacement);

            /* retained old wrapper */
            void oldRect.ownerSVGElement;
            void anim.ownerSVGElement;

            forceLayout(svg);

            checkpoint(name, "CALLBACK_EXIT");
        });

        anim.beginElement();

        await delay(120);

        checkpoint(name, "VERIFY");

        ok(name);

    } catch(e) {

        exception(name, e);

    } finally {

        cleanup(svg);
    }
}


/* ---------------------------------------------------------
   D - reparent animation element during callback
   --------------------------------------------------------- */

async function testD() {

    const name = "D_REPARENT_ANIMATION";

    checkpoint(name, "CREATE");

    let svg, a, b, anim;

    try {

        svg = svgElement("svg");

        a = svgElement("rect");
        b = svgElement("rect");

        a.setAttribute("width", "20");
        b.setAttribute("width", "30");

        anim = svgElement("animate");

        anim.setAttribute("attributeName", "width");
        anim.setAttribute("from", "20");
        anim.setAttribute("to", "60");
        anim.setAttribute("dur", "0.05s");
        anim.setAttribute("begin", "indefinite");

        a.appendChild(anim);

        svg.appendChild(a);
        svg.appendChild(b);

        document.body.appendChild(svg);

        anim.addEventListener("beginEvent", function () {

            checkpoint(name, "CALLBACK_ENTER");

            b.appendChild(anim);

            checkpoint(name, "ANIMATION_REPARENTED");

            void a.getBoundingClientRect();
            void b.getBoundingClientRect();

            forceLayout(svg);

            checkpoint(name, "CALLBACK_EXIT");
        });

        anim.beginElement();

        await delay(120);

        checkpoint(name, "VERIFY");

        ok(name);

    } catch(e) {

        exception(name, e);

    } finally {

        cleanup(svg);
    }
}


/* ---------------------------------------------------------
   E - animation end callback removes parent
   --------------------------------------------------------- */

async function testE() {

    const name = "E_REMOVE_PARENT_END";

    checkpoint(name, "CREATE");

    let svg, group, rect, anim;

    try {

        svg = svgElement("svg");
        group = svgElement("g");
        rect = svgElement("rect");

        rect.setAttribute("width", "20");
        rect.setAttribute("height", "20");

        anim = svgElement("animate");

        anim.setAttribute("attributeName", "opacity");
        anim.setAttribute("from", "1");
        anim.setAttribute("to", "0");
        anim.setAttribute("dur", "0.03s");
        anim.setAttribute("begin", "indefinite");

        rect.appendChild(anim);
        group.appendChild(rect);
        svg.appendChild(group);

        document.body.appendChild(svg);

        anim.addEventListener("endEvent", function () {

            checkpoint(name, "END_ENTER");

            group.remove();

            checkpoint(name, "GROUP_REMOVED");

            void rect.ownerDocument;
            void anim.ownerDocument;

            forceLayout(svg);

            checkpoint(name, "END_EXIT");
        });

        anim.beginElement();

        await delay(150);

        checkpoint(name, "VERIFY");

        ok(name);

    } catch(e) {

        exception(name, e);

    } finally {

        cleanup(svg);
    }
}


/* ---------------------------------------------------------
   F - nested/re-entrant animation start
   --------------------------------------------------------- */

async function testF() {

    const name = "F_NESTED_BEGIN";

    checkpoint(name, "CREATE");

    let svg, r1, r2, a1, a2;

    try {

        svg = svgElement("svg");

        r1 = svgElement("rect");
        r2 = svgElement("rect");

        r1.setAttribute("width", "10");
        r2.setAttribute("width", "10");

        a1 = svgElement("animate");
        a2 = svgElement("animate");

        for (const a of [a1, a2]) {

            a.setAttribute("attributeName", "width");
            a.setAttribute("from", "10");
            a.setAttribute("to", "50");
            a.setAttribute("dur", "0.05s");
            a.setAttribute("begin", "indefinite");
        }

        r1.appendChild(a1);
        r2.appendChild(a2);

        svg.appendChild(r1);
        svg.appendChild(r2);

        document.body.appendChild(svg);

        let nested = false;

        a1.addEventListener("beginEvent", function () {

            checkpoint(name, "A1_ENTER");

            if (!nested) {

                nested = true;

                checkpoint(name, "START_A2");

                a2.beginElement();
            }

            r1.remove();

            checkpoint(name, "R1_REMOVED");

            forceLayout(svg);

            checkpoint(name, "A1_EXIT");
        });

        a2.addEventListener("beginEvent", function () {

            checkpoint(name, "A2_ENTER");

            void r1.ownerDocument;
            void r2.ownerDocument;

            forceLayout(svg);

            checkpoint(name, "A2_EXIT");
        });

        a1.beginElement();

        await delay(150);

        checkpoint(name, "VERIFY");

        ok(name);

    } catch(e) {

        exception(name, e);

    } finally {

        cleanup(svg);
    }
}


async function run() {

    document.querySelector("#run").disabled = true;

    pass = 0;
    exceptions = 0;
    anomalies = 0;

    logBox.textContent = "";

    const old = localStorage.getItem("PS5_V26_CHECKPOINT");

    if (old)
        log("Previous checkpoint: " + old);

    log("User agent:");
    log(navigator.userAgent);
    log("");

    log("SVGElement: " + typeof SVGElement);
    log("SVGPathElement: " + typeof SVGPathElement);
    log("SVGAnimationElement: " + typeof SVGAnimationElement);

    log("");
    log("Starting V26...");
    log("");

    await testA();
    await testB();
    await testC();
    await testD();
    await testE();
    await testF();

    checkpoint("V26", "COMPLETE");

    statusBox.textContent =
        anomalies || exceptions ?
        "STATUS: ANOMALY" :
        "STATUS: NORMAL";

    log("");
    log("==============================");
    log("TESTS COMPLETED: 6");
    log("PASS: " + pass);
    log("EXCEPTIONS: " + exceptions);
    log("ANOMALIES: " + anomalies);
    log("==============================");

    document.querySelector("#run").disabled = false;
}

document.querySelector("#run").onclick = run;
</script>
