<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V34 Popover Removal Crash Probe</title>

<style>
body {
    background:#111;
    color:#eee;
    font:15px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

<h2>PS5 13.60 — V34</h2>
<div>Popover removal / style invalidation crash probe</div>

<p><button id="run">RUN V34</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

/*
 * V34
 *
 * Based on WebKit bug 301879:
 *
 * "Fix crash in style invalidation when element
 *  has no parent during removal"
 *
 * Upstream regression:
 * fast/dom/Element/
 * nth-child-of-popover-open-crash.html
 *
 * Reported cause:
 * hidePopoverInternal() could trigger style
 * invalidation during removal after parentNode
 * had become null.
 *
 * Browser crash/regression probe only.
 */

const out =
    document.querySelector("#log");

const statusBox =
    document.querySelector("#status");

const button =
    document.querySelector("#run");

let pass = 0;
let exceptions = 0;
let anomalies = 0;
let unsupported = 0;

function log(s) {
    out.textContent += s + "\n";
    console.log(s);
}

function cp(s) {

    try {
        localStorage.setItem(
            "PS5_V34_CP",
            s
        );
    } catch (_) {}

    log("[CP] " + s);
}

function good(name) {
    pass++;
    log("[PASS] " + name);
}

function bad(name, why) {
    anomalies++;

    log(
        "[ANOMALY] " +
        name +
        " :: " +
        why
    );
}

function caught(name, e) {
    exceptions++;

    log(
        "[EXCEPTION] " +
        name +
        " :: " +
        e
    );
}

function delay(ms) {
    return new Promise(
        r => setTimeout(r, ms)
    );
}

function forceLayout(node) {

    try {
        return node.offsetHeight;
    } catch(e) {
        return -1;
    }
}


/* ==============================
   A — CAPABILITY
   ============================== */

async function testA() {

    const name =
        "A_POPOVER_CAPABILITY";

    cp(name + ":START");

    try {

        const el =
            document.createElement("div");

        log(
            "[A] popover property=" +
            ("popover" in el)
        );

        log(
            "[A] showPopover=" +
            typeof el.showPopover
        );

        log(
            "[A] hidePopover=" +
            typeof el.hidePopover
        );

        log(
            "[A] togglePopover=" +
            typeof el.togglePopover
        );

        if (
            typeof el.showPopover
            !== "function"
        ) {

            unsupported++;

            log(
                "[A] Popover API unavailable"
            );

            cp(
                name +
                ":UNSUPPORTED"
            );

            return false;
        }

        cp(name + ":COMPLETE");

        good(name);

        return true;

    } catch(e) {

        caught(name, e);

        return false;
    }
}


/* ==============================
   B — BASIC POPOVER
   ============================== */

async function testB() {

    const name =
        "B_BASIC_POPOVER";

    cp(name + ":CREATE");

    let el;

    try {

        el =
            document.createElement("div");

        el.popover = "manual";

        el.textContent =
            "V34 basic popover";

        document.body.appendChild(el);

        cp(name + ":SHOW");

        el.showPopover();

        forceLayout(el);

        log(
            "[B] :popover-open=" +
            el.matches(":popover-open")
        );

        cp(name + ":HIDE");

        el.hidePopover();

        forceLayout(el);

        log(
            "[B] after hide=" +
            el.matches(":popover-open")
        );

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        try {
            el.remove();
        } catch (_) {}
    }
}


/* ==============================
   C — REMOVE OPEN POPOVER
   ============================== */

async function testC() {

    const name =
        "C_REMOVE_OPEN_POPOVER";

    cp(name + ":CREATE");

    let host;
    let pop;

    try {

        host =
            document.createElement("div");

        pop =
            document.createElement("div");

        pop.popover = "manual";

        pop.textContent =
            "V34-C";

        host.appendChild(pop);

        document.body.appendChild(host);

        pop.showPopover();

        forceLayout(pop);

        cp(name + ":OPEN");

        log(
            "[C] open=" +
            pop.matches(":popover-open")
        );

        cp(name + ":REMOVE");

        pop.remove();

        cp(name + ":AFTER_REMOVE");

        log(
            "[C] connected=" +
            pop.isConnected
        );

        log(
            "[C] parent=" +
            pop.parentNode
        );

        /*
         * Ordinary retained-wrapper reads.
         */

        log(
            "[C] text=" +
            pop.textContent
        );

        await delay(50);

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        try {
            host.remove();
        } catch (_) {}
    }
}


/* ==============================
   D — outerText REMOVAL

   This is the important upstream condition.
   ============================== */

async function testD() {

    const name =
        "D_OUTERTEXT_OPEN_POPOVER";

    cp(name + ":CREATE");

    let host;

    try {

        host =
            document.createElement("div");

        /*
         * nth-child dependency intentionally
         * included because the upstream test
         * specifically exercises nth-child
         * style invalidation.
         */

        const style =
            document.createElement("style");

        style.textContent = `
            #v34-host > :nth-child(1) {
                padding: 1px;
            }

            #v34-host > :nth-child(2) {
                margin: 1px;
            }

            #v34-host > :popover-open {
                border-width: 1px;
                border-style: solid;
            }
        `;

        document.head.appendChild(style);

        host.id = "v34-host";

        const first =
            document.createElement("div");

        first.textContent =
            "first";

        const pop =
            document.createElement("div");

        pop.popover = "manual";

        pop.textContent =
            "V34 TARGET";

        const third =
            document.createElement("div");

        third.textContent =
            "third";

        host.appendChild(first);
        host.appendChild(pop);
        host.appendChild(third);

        document.body.appendChild(host);

        forceLayout(host);

        cp(name + ":SHOW");

        pop.showPopover();

        forceLayout(host);

        log(
            "[D] open=" +
            pop.matches(":popover-open")
        );

        log(
            "[D] parent before=" +
            (
                pop.parentNode
                ? pop.parentNode.nodeName
                : "null"
            )
        );

        /*
         * Critical transition.

         * Setting outerText removes/replaces the
         * element. WebKit bug 301879 describes
         * hidePopoverInternal being entered while
         * this removal is occurring.
         */

        cp(
            name +
            ":BEFORE_OUTERTEXT"
        );

        pop.outerText =
            "V34 replacement text";

        cp(
            name +
            ":AFTER_OUTERTEXT"
        );

        log(
            "[D] connected after=" +
            pop.isConnected
        );

        log(
            "[D] parent after=" +
            pop.parentNode
        );

        /*
         * Trigger normal style/layout processing
         * after the removal.
         */

        cp(
            name +
            ":BEFORE_LAYOUT"
        );

        const h =
            forceLayout(host);

        cp(
            name +
            ":AFTER_LAYOUT"
        );

        log(
            "[D] host height=" +
            h
        );

        log(
            "[D] child count=" +
            host.childNodes.length
        );

        await delay(100);

        cp(name + ":COMPLETE");

        good(name);

        style.remove();

    } catch(e) {

        caught(name, e);

    } finally {

        try {
            host.remove();
        } catch (_) {}
    }
}


/* ==============================
   E — parent outerText
   ============================== */

async function testE() {

    const name =
        "E_PARENT_OUTERTEXT";

    cp(name + ":CREATE");

    let wrapper;

    try {

        wrapper =
            document.createElement("div");

        const parent =
            document.createElement("section");

        const pop =
            document.createElement("div");

        pop.popover = "manual";

        pop.textContent =
            "V34-E";

        parent.appendChild(pop);
        wrapper.appendChild(parent);

        document.body.appendChild(wrapper);

        pop.showPopover();

        forceLayout(wrapper);

        cp(name + ":OPEN");

        log(
            "[E] open=" +
            pop.matches(":popover-open")
        );

        cp(
            name +
            ":BEFORE_PARENT_OUTERTEXT"
        );

        parent.outerText =
            "parent replaced";

        cp(
            name +
            ":AFTER_PARENT_OUTERTEXT"
        );

        log(
            "[E] pop connected=" +
            pop.isConnected
        );

        log(
            "[E] parent connected=" +
            parent.isConnected
        );

        forceLayout(wrapper);

        await delay(50);

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        try {
            wrapper.remove();
        } catch (_) {}
    }
}


/* ==============================
   F — callback removal
   ============================== */

async function testF() {

    const name =
        "F_TOGGLE_CALLBACK_REMOVAL";

    cp(name + ":CREATE");

    let host;

    try {

        host =
            document.createElement("div");

        const pop =
            document.createElement("div");

        pop.popover = "manual";

        pop.textContent =
            "V34-F";

        host.appendChild(pop);

        document.body.appendChild(host);

        let toggleEvents = 0;

        pop.addEventListener(
            "toggle",
            function() {

                toggleEvents++;

                cp(
                    name +
                    ":TOGGLE_" +
                    toggleEvents
                );

                log(
                    "[F] toggle #" +
                    toggleEvents
                );

                log(
                    "[F] connected=" +
                    pop.isConnected
                );
            }
        );

        cp(name + ":SHOW");

        pop.showPopover();

        await delay(50);

        cp(name + ":OUTERTEXT");

        pop.outerText =
            "V34-F replacement";

        cp(
            name +
            ":OUTERTEXT_RETURNED"
        );

        forceLayout(host);

        await delay(100);

        log(
            "[F] toggle events=" +
            toggleEvents
        );

        log(
            "[F] retained connected=" +
            pop.isConnected
        );

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        try {
            host.remove();
        } catch (_) {}
    }
}


/* ============================== */

async function run() {

    button.disabled = true;

    out.textContent = "";

    pass = 0;
    exceptions = 0;
    anomalies = 0;
    unsupported = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    const old =
        localStorage.getItem(
            "PS5_V34_CP"
        );

    if (old) {

        log(
            "PREVIOUS CHECKPOINT: " +
            old
        );

        log("");
    }

    log("PS5 13.60 — V34");
    log(
        "Popover Removal Crash Probe"
    );

    log("");

    log(navigator.userAgent);

    log("");

    const supported =
        await testA();

    if (supported) {

        await testB();
        await testC();
        await testD();
        await testE();
        await testF();

        cp("V34:COMPLETE");
    }

    log("");
    log("============================");
    log("V34 RESULT");
    log("============================");

    log("PASS: " + pass);

    log(
        "EXCEPTIONS: " +
        exceptions
    );

    log(
        "ANOMALIES: " +
        anomalies
    );

    log(
        "UNSUPPORTED: " +
        unsupported
    );

    log("============================");

    if (unsupported) {

        statusBox.textContent =
            "STATUS: UNSUPPORTED";

    } else if (
        exceptions ||
        anomalies
    ) {

        statusBox.textContent =
            "STATUS: CHECK RESULT";

    } else {

        statusBox.textContent =
            "STATUS: NORMAL";
    }

    button.disabled = false;
}

button.onclick = run;
</script>
