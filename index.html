<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 — V19.1 SSV Repro Probe</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button,input {
    font:16px monospace;
    padding:9px;
    margin:4px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok   { color:#59ff7a; }
.bad  { color:#ff6868; }
.warn { color:#ffd166; }
.info { color:#63caff; }

#space {
    height:1500px;
}
</style>
</head>

<body>

<h2>PS5 13.60 — V19.1 SSV Repro Probe</h2>

Runs:
<input id="runs"
       type="number"
       value="25"
       min="1"
       max="50">

<button onclick="start()">RUN V19.1</button>
<button onclick="clearCP()">CLEAR CHECKPOINT</button>

<div id="log"></div>

<div id="space"></div>
<a id="target">V19.1 fragment target</a>

<script>
"use strict";

const KEY = "PS5_V19_1_CP";

const box =
    document.getElementById("log");

let blurCount = 0;
let replaceCount = 0;
let anomalyCount = 0;
let rateLimitCount = 0;

function log(text, cls="") {

    const d =
        document.createElement("div");

    d.textContent = text;
    d.className = cls;

    box.appendChild(d);
}

function delay(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

function save(run, phase, extra="") {

    const data = {
        status:"RUNNING",
        run:run,
        phase:phase,
        extra:extra,
        time:Date.now(),
        href:location.href
    };

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify(data)
        );
    } catch(e) {}
}

function finish(runs) {

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"COMPLETE",
                runs:runs,
                blur:blurCount,
                replace:replaceCount,
                anomalies:anomalyCount,
                rateLimits:rateLimitCount
            })
        );

    } catch(e) {}
}

function clearCP() {

    localStorage.removeItem(KEY);

    log(
        "Checkpoint cleared.",
        "warn"
    );
}

function previous() {

    try {

        const raw =
            localStorage.getItem(KEY);

        if (!raw)
            return;

        const cp =
            JSON.parse(raw);

        if (cp.status !== "RUNNING")
            return;

        log(
            "*******************************",
            "bad"
        );

        log(
            "PREVIOUS RUN DID NOT COMPLETE",
            "bad"
        );

        log(
            "RUN: " + cp.run,
            "bad"
        );

        log(
            "LAST PHASE: " + cp.phase,
            "bad"
        );

        if (cp.extra) {
            log(
                cp.extra,
                "bad"
            );
        }

        log(
            "*******************************",
            "bad"
        );

    } catch(e) {}
}

function waitPop(timeout=5000) {

    return new Promise(
        (resolve,reject) => {

            let finished = false;

            const timer =
                setTimeout(() => {

                    if (finished)
                        return;

                    finished = true;

                    removeEventListener(
                        "popstate",
                        handler
                    );

                    reject(
                        new Error(
                            "POPSTATE_TIMEOUT"
                        )
                    );

                },timeout);

            function handler(e) {

                if (finished)
                    return;

                finished = true;

                clearTimeout(timer);

                resolve(e);
            }

            addEventListener(
                "popstate",
                handler
            );
        }
    );
}

function isRateLimit(e) {

    const s =
        String(e);

    return (
        e &&
        e.name === "SecurityError" &&
        (
            s.indexOf("100 times") !== -1 ||
            s.indexOf("replaceState") !== -1
        )
    );
}

async function oneRun(n) {

    save(n,"RUN_START");

    /*
     * Known starting entry.
     */

    try {

        history.replaceState(
            "v19-base-" + n,
            "",
            location.pathname
        );

    } catch(e) {

        if (isRateLimit(e)) {

            rateLimitCount++;

            save(
                n,
                "HISTORY_RATE_LIMIT",
                String(e)
            );

            throw new Error(
                "RATE_LIMIT"
            );
        }

        throw e;
    }

    /*
     * Focus element.
     */

    const input =
        document.createElement("input");

    input.value =
        "V19.1 run " + n;

    document.body.insertBefore(
        input,
        document.body.firstChild
    );

    save(n,"PUSH_FRAGMENT");

    history.pushState(
        "v19-original-" + n,
        "",
        location.pathname + "#target"
    );

    save(n,"PUSH_CURRENT");

    history.pushState(
        "v19-current-" + n,
        "",
        location.pathname
    );

    let sawBlur = false;
    let sawReplace = false;

    input.onblur = function() {

        sawBlur = true;
        blurCount++;

        save(
            n,
            "BLUR_ENTER"
        );

        try {

            save(
                n,
                "BEFORE_REPLACE"
            );

            history.replaceState(
                "v19-replacement-" + n,
                "",
                location.href
            );

            sawReplace = true;
            replaceCount++;

            save(
                n,
                "AFTER_REPLACE"
            );

        } catch(e) {

            if (isRateLimit(e)) {

                rateLimitCount++;

                save(
                    n,
                    "HISTORY_RATE_LIMIT_IN_BLUR",
                    String(e)
                );

                return;
            }

            save(
                n,
                "BLUR_JS_EXCEPTION",
                String(e)
            );

            throw e;
        }

        save(
            n,
            "BLUR_EXIT"
        );
    };

    save(
        n,
        "BEFORE_FOCUS"
    );

    input.focus();

    await delay(50);

    const pop =
        waitPop();

    save(
        n,
        "BEFORE_HISTORY_BACK"
    );

    history.back();

    save(
        n,
        "HISTORY_BACK_RETURNED"
    );

    const event =
        await pop;

    save(
        n,
        "POPSTATE_RECEIVED"
    );

    await delay(100);

    /*
     * Observable integrity checks.
     */

    if (!sawBlur) {

        anomalyCount++;

        log(
            "Run " + n +
            ": BLUR MISSING",
            "bad"
        );
    }

    if (!sawReplace) {

        anomalyCount++;

        log(
            "Run " + n +
            ": REPLACE MISSING",
            "bad"
        );
    }

    if (
        sawReplace &&
        history.state !==
            "v19-replacement-" + n
    ) {

        anomalyCount++;

        log(
            "Run " + n +
            ": HISTORY STATE MISMATCH",
            "bad"
        );
    }

    if (event.state == null) {

        anomalyCount++;

        log(
            "Run " + n +
            ": POPSTATE STATE NULL",
            "bad"
        );
    }

    save(
        n,
        "CLEANUP"
    );

    input.onblur = null;

    input.remove();

    try {

        history.replaceState(
            null,
            "",
            location.pathname
        );

    } catch(e) {

        if (isRateLimit(e)) {

            rateLimitCount++;

            save(
                n,
                "HISTORY_RATE_LIMIT_CLEANUP",
                String(e)
            );

        } else {

            throw e;
        }
    }

    save(
        n,
        "RUN_COMPLETE"
    );
}

async function start() {

    box.innerHTML = "";

    previous();

    blurCount = 0;
    replaceCount = 0;
    anomalyCount = 0;
    rateLimitCount = 0;

    let runs =
        Number(
            document.getElementById("runs").value
        );

    runs =
        Math.max(
            1,
            Math.min(
                50,
                Number.isFinite(runs)
                    ? runs
                    : 25
            )
        );

    log(
        "V19.1 START",
        "info"
    );

    log(
        navigator.userAgent
    );

    log(
        "Runs requested: " + runs
    );

    log(
        "Inter-run delay: 750 ms"
    );

    log("");

    try {

        for (
            let n=1;
            n<=runs;
            n++
        ) {

            log(
                "RUN " +
                n +
                "/" +
                runs
            );

            try {

                await oneRun(n);

            } catch(e) {

                if (
                    String(e).indexOf(
                        "RATE_LIMIT"
                    ) !== -1
                ) {

                    log(
                        "RATE LIMIT encountered",
                        "warn"
                    );

                    /*
                     * Wait for the History API
                     * rate window to clear.
                     */

                    await delay(11000);

                    continue;
                }

                save(
                    n,
                    "JS_EXCEPTION",
                    String(e)
                );

                throw e;
            }

            /*
             * Deliberately slower than V19.
             */

            await delay(750);
        }

        finish(runs);

        log("");
        log(
            "======= V19.1 RESULT =======",
            "info"
        );

        log(
            "STATUS: " +
            (
                anomalyCount === 0
                    ? "NORMAL"
                    : "ANOMALY"
            ),
            anomalyCount === 0
                ? "ok"
                : "bad"
        );

        log(
            "COMPLETED: " + runs
        );

        log(
            "BLUR CALLBACKS: " +
            blurCount
        );

        log(
            "REPLACE CALLBACKS: " +
            replaceCount
        );

        log(
            "ANOMALIES: " +
            anomalyCount
        );

        log(
            "RATE LIMITS: " +
            rateLimitCount
        );

        log(
            "============================",
            "info"
        );

    } catch(e) {

        log("");
        log(
            "V19.1 STOPPED",
            "bad"
        );

        log(
            String(e),
            "bad"
        );
    }
}

previous();

</script>
</body>
</html>
