<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V35.2 TransformStream Substitution</title>

<style>
body {
    background:#111;
    color:#eee;
    font:16px monospace;
    padding:20px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

<h2>PS5 13.60 — V35.2</h2>
<p>Single TransformStream iterator substitution</p>

<button id="run">RUN V35.2</button>
<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const out = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const button = document.querySelector("#run");

const originalIterator =
    Array.prototype[Symbol.iterator];

let iteratorCalls = 0;
let nextCalls = 0;
let substitutionCount = 0;

function log(x) {
    out.textContent += x + "\n";
    console.log(x);
}

function cp(x) {
    try {
        localStorage.setItem(
            "V352_CHECKPOINT",
            x
        );
    } catch (_) {}

    log("[CP] " + x);
}

function restore() {
    Array.prototype[Symbol.iterator] =
        originalIterator;
}

function previous() {
    try {
        const x =
            localStorage.getItem(
                "V352_CHECKPOINT"
            );

        if (x)
            log(
                "PREVIOUS CHECKPOINT: " +
                x
            );

    } catch (_) {}
}

function run() {

    button.disabled = true;
    out.textContent = "";

    iteratorCalls = 0;
    nextCalls = 0;
    substitutionCount = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    log("PS5 13.60 — V35.2");
    log(
        "TransformStream Single Substitution"
    );
    log("");
    log(navigator.userAgent);
    log("");

    if (
        typeof TransformStream !==
        "function"
    ) {
        log("TransformStream unsupported");

        statusBox.textContent =
            "STATUS: UNSUPPORTED";

        button.disabled = false;
        return;
    }

    cp("01_BEFORE_OVERRIDE");

    Array.prototype[Symbol.iterator] =
        function() {

            iteratorCalls++;

            const thisIterator =
                iteratorCalls;

            const array = this;

            let index = 0;

            return {
                next() {

                    nextCalls++;

                    if (
                        index >= array.length
                    ) {
                        return {
                            done:true,
                            value:undefined
                        };
                    }

                    let value =
                        array[index];

                    /*
                     * V35.1 showed two apparent
                     * 3-element iterations.
                     *
                     * Change ONE value only:
                     *
                     * second value returned from
                     * the first 3-element array.
                     */

                    if (
                        thisIterator === 1 &&
                        array.length === 3 &&
                        index === 1
                    ) {

                        cp(
                            "03_BEFORE_SUBSTITUTION"
                        );

                        value = {
                            marker:
                                "V352_SUBSTITUTE",
                            index:1
                        };

                        substitutionCount++;

                        cp(
                            "04_SUBSTITUTION_READY"
                        );
                    }

                    index++;

                    return {
                        done:false,
                        value:value
                    };
                }
            };
        };

    cp("02_OVERRIDE_INSTALLED");

    let stream = null;
    let thrown = null;

    try {

        cp(
            "05_BEFORE_TRANSFORMSTREAM"
        );

        stream =
            new TransformStream();

        cp(
            "06_TRANSFORMSTREAM_RETURNED"
        );

    } catch(e) {

        thrown = e;

        cp(
            "06_TRANSFORMSTREAM_EXCEPTION"
        );
    }

    /*
     * Restore the global iterator before doing
     * any further logging/DOM operations.
     */

    restore();

    cp("07_ITERATOR_RESTORED");

    log("");
    log(
        "iteratorCalls = " +
        iteratorCalls
    );

    log(
        "nextCalls = " +
        nextCalls
    );

    log(
        "substitutions = " +
        substitutionCount
    );

    if (thrown) {

        log("");
        log(
            "Constructor threw:"
        );

        log(
            thrown.name +
            ": " +
            thrown.message
        );

        /*
         * A normal TypeError is useful:
         * the implementation rejected our
         * substituted JS value.
         */

        if (
            thrown instanceof TypeError
        ) {
            log(
                "RESULT: NORMAL TYPE CHECK"
            );
        } else {
            log(
                "RESULT: OTHER EXCEPTION"
            );
        }

    } else {

        log("");
        log(
            "TransformStream returned normally"
        );

        if (stream) {

            log(
                "readable = " +
                typeof stream.readable
            );

            log(
                "writable = " +
                typeof stream.writable
            );
        }

        log(
            "RESULT: SUBSTITUTION ACCEPTED"
        );
    }

    cp("08_COMPLETE");

    statusBox.textContent =
        "STATUS: COMPLETE";

    button.disabled = false;
}

previous();

button.onclick = run;

window.addEventListener(
    "pagehide",
    restore
);

window.addEventListener(
    "beforeunload",
    restore
);
</script>
