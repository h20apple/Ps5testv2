<!doctype html>
<meta charset="utf-8">
<title>PS5 WebKit 13.60 V5</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:17px monospace;
    padding:20px
}
button,select {
    font:17px monospace;
    padding:10px;
    margin:4px
}
#log {
    background:#17233a;
    padding:15px;
    white-space:pre-wrap
}
.ok {color:#59ff7a}
.bad {color:#ff6868}
.info {color:#63caff}
.warn {color:#ffd166}
</style>

<h2>PS5 WebKit 13.60 — V5 Regression Runner</h2>

<select id="test">
<option value="dom">DOM detach</option>
<option value="iframe">Document teardown</option>
<option value="event">Event mutation</option>
<option value="array">ArrayBuffer lifecycle</option>
<option value="all">Run all</option>
</select>

<select id="runs">
<option>10</option>
<option selected>100</option>
<option>500</option>
<option>2000</option>
</select>

<button onclick="start()">Run</button>
<button onclick="stopRun()">Stop</button>
<button onclick="clearLog()">Clear</button>

<div id="log"></div>

<script>
"use strict";

const box =
    document.getElementById("log");

let stopped=false;

let stats;

function log(s,c="") {
    const d=document.createElement("div");
    d.textContent=s;
    d.className=c;
    box.appendChild(d);
}

function clearLog() {
    box.innerHTML="";
}

function stopRun() {
    stopped=true;
    log("STOP requested","warn");
}

function saveCheckpoint(test,i,state) {

    try {

        localStorage.setItem(
            "v5-last",
            JSON.stringify({
                test:test,
                iteration:i,
                state:state,
                time:Date.now()
            })
        );

    } catch(e) {}
}

function previousCrashCandidate() {

    try {

        const raw=
            localStorage.getItem("v5-last");

        if(!raw)
            return;

        const x=JSON.parse(raw);

        /*
         If the previous page disappeared while
         state was RUNNING, that particular test
         didn't reach its completion checkpoint.
        */

        if(x.state==="RUNNING") {

            log(
                "Previous incomplete testcase:",
                "warn"
            );

            log(
                x.test+
                " iteration "+
                x.iteration,
                "warn"
            );
        }

    } catch(e) {}
}

/* =====================================
   CASE A — detached DOM wrapper
===================================== */

async function testDOM(i) {

    const parent=
        document.createElement("div");

    const child=
        document.createElement("span");

    child.textContent="before";

    parent.appendChild(child);
    document.body.appendChild(parent);

    child.remove();

    child.textContent=
        "after-"+i;

    const result=
        child.textContent===
        "after-"+i;

    parent.remove();

    return result;
}

/* =====================================
   CASE B — document teardown
===================================== */

async function testIframe(i) {

    return new Promise(resolve=>{

        const frame=
            document.createElement("iframe");

        let finished=false;

        const timeout=setTimeout(()=>{

            if(finished)
                return;

            finished=true;

            try { frame.remove(); }
            catch(e) {}

            resolve(false);

        },1000);

        frame.onload=function(){

            if(finished)
                return;

            try {

                const doc=
                    frame.contentDocument;

                const node=
                    doc.createElement("div");

                node.textContent=
                    "frame-"+i;

                doc.body.appendChild(node);

                frame.remove();

                const result=
                    node.textContent===
                    "frame-"+i;

                finished=true;
                clearTimeout(timeout);

                resolve(result);

            } catch(e) {

                finished=true;
                clearTimeout(timeout);

                resolve(false);
            }
        };

        frame.src="about:blank";

        document.body.appendChild(frame);
    });
}

/* =====================================
   CASE C — mutation during event
===================================== */

async function testEvent(i) {

    const root=
        document.createElement("div");

    document.body.appendChild(root);

    for(let n=0;n<100;n++) {

        const x=
            document.createElement("span");

        x.textContent=String(n);

        root.appendChild(x);
    }

    let fired=0;

    function callback() {

        fired++;

        while(root.firstChild)
            root.removeChild(root.firstChild);

        const replacement=
            document.createElement("div");

        replacement.textContent=
            "replacement-"+i;

        root.appendChild(replacement);
    }

    root.addEventListener(
        "v5-event",
        callback
    );

    root.dispatchEvent(
        new Event("v5-event")
    );

    root.removeEventListener(
        "v5-event",
        callback
    );

    const result=
        fired===1 &&
        root.childNodes.length===1;

    root.remove();

    return result;
}

/* =====================================
   CASE D — ArrayBuffer lifecycle
===================================== */

async function testArray(i) {

    const buffer=
        new ArrayBuffer(0x10000);

    const a=
        new Uint32Array(buffer);

    for(let n=0;n<a.length;n++) {

        a[n]=(
            0x41410000 ^
            n ^
            i
        )>>>0;
    }

    for(let n=0;n<a.length;n++) {

        const expected=(
            0x41410000 ^
            n ^
            i
        )>>>0;

        if(a[n]!==expected)
            return false;
    }

    return true;
}

const tests={
    dom:testDOM,
    iframe:testIframe,
    event:testEvent,
    array:testArray
};

async function execute(name,i) {

    saveCheckpoint(
        name,
        i,
        "RUNNING"
    );

    const start=
        performance.now();

    try {

        const result=
            await tests[name](i);

        const elapsed=
            performance.now()-start;

        if(result!==true) {

            stats.fail++;

            log(
                "[FAIL] "+
                name+
                " #"+
                i,
                "bad"
            );

            return;
        }

        /*
         A very long execution isn't proof
         of a security problem, but flag it
         for reproduction.
        */

        if(elapsed>500) {

            stats.slow++;

            log(
                "[SLOW] "+
                name+
                " #"+
                i+
                " "+
                elapsed.toFixed(1)+
                "ms",
                "warn"
            );
        }

        stats.pass++;

    } catch(e) {

        stats.exception++;

        log(
            "[EXCEPTION] "+
            name+
            " #"+
            i+
            " : "+
            e,
            "bad"
        );
    }

    saveCheckpoint(
        name,
        i,
        "COMPLETE"
    );
}

async function start() {

    clearLog();

    previousCrashCandidate();

    stopped=false;

    stats={
        pass:0,
        fail:0,
        exception:0,
        slow:0
    };

    const selected=
        document.getElementById("test").value;

    const iterations=
        Number(
            document.getElementById("runs").value
        );

    const queue=
        selected==="all"
        ? Object.keys(tests)
        : [selected];

    log(
        "V5 starting",
        "info"
    );

    log(
        navigator.userAgent
    );

    log(
        "Tests: "+
        queue.join(", ")
    );

    log(
        "Iterations: "+
        iterations
    );

    for(let i=0;i<iterations;i++) {

        if(stopped)
            break;

        for(const name of queue) {

            if(stopped)
                break;

            await execute(name,i);
        }

        if(i%25===0) {

            log(
                "Iteration "+
                i+
                "/"+
                iterations,
                "info"
            );

            await new Promise(
                r=>setTimeout(r,0)
            );
        }
    }

    log("");
    log(
        "======= V5 RESULT =======",
        "info"
    );

    log(
        "PASS:       "+
        stats.pass,
        "ok"
    );

    log(
        "FAIL:       "+
        stats.fail,
        stats.fail ?
        "bad":"ok"
    );

    log(
        "EXCEPTIONS: "+
        stats.exception,
        stats.exception ?
        "bad":"ok"
    );

    log(
        "SLOW:       "+
        stats.slow,
        stats.slow ?
        "warn":"ok"
    );

    log(
        "=========================",
        "info"
    );
}
</script>
