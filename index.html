<!doctype html>
<meta charset="utf-8">
<title>PS5 WebKit 13.60 V10 FontFace Probe</title>

<style>
body{
  background:#101827;
  color:#eee;
  font:16px monospace;
  padding:18px
}
button,select{
  font:16px monospace;
  padding:9px;
  margin:4px
}
#log{
  background:#17233a;
  padding:14px;
  margin-top:10px;
  white-space:pre-wrap
}
.ok{color:#59ff7a}
.bad{color:#ff6868}
.warn{color:#ffd166}
.info{color:#63caff}
#sandbox{
  position:absolute;
  left:-20000px;
  top:0
}
</style>

<h2>PS5 WebKit 13.60 — V10 FontFace Probe</h2>

<select id="runs">
<option value="10">10 runs</option>
<option value="100" selected>100 runs</option>
<option value="500">500 runs</option>
</select>

<button onclick="start()">RUN</button>
<button onclick="stopRun()">STOP</button>
<button onclick="replay()">REPLAY CHECKPOINT</button>
<button onclick="clearLog()">CLEAR</button>

<div id="sandbox"></div>
<div id="log"></div>

<script>
"use strict";

const output=document.getElementById("log");
const sandbox=document.getElementById("sandbox");

let stopping=false;

let stats={
  pass:0,
  fail:0,
  exceptions:0,
  unsupported:0
};

function log(s,c=""){
  const e=document.createElement("div");
  e.textContent=s;
  e.className=c;
  output.appendChild(e);
  window.scrollTo(0,document.body.scrollHeight);
}

function clearLog(){
  output.innerHTML="";
}

function stopRun(){
  stopping=true;
  log("STOP REQUESTED","warn");
}

/* -----------------------------
   Persistent checkpoint
------------------------------ */

function checkpoint(test,i,phase,state="RUNNING"){

  try{

    localStorage.setItem(
      "v10-checkpoint",
      JSON.stringify({
        test:test,
        iteration:i,
        phase:phase,
        state:state,
        time:Date.now()
      })
    );

  }catch(e){}
}

function readCheckpoint(){

  try{

    const x=
      localStorage.getItem(
        "v10-checkpoint"
      );

    return x ?
      JSON.parse(x) :
      null;

  }catch(e){

    return null;
  }
}

function previous(){

  const c=readCheckpoint();

  if(c && c.state==="RUNNING"){

    log(
      "================================",
      "bad"
    );

    log(
      "PREVIOUS EXECUTION INCOMPLETE",
      "bad"
    );

    log("TEST: "+c.test,"bad");
    log("ITERATION: "+c.iteration,"bad");
    log("PHASE: "+c.phase,"bad");

    log(
      "================================",
      "bad"
    );
  }
}

/* -----------------------------
   Capability report
------------------------------ */

function capabilities(){

  log("CAPABILITY CHECK","info");

  log(
    "FontFace: "+
    (typeof FontFace)
  );

  log(
    "document.fonts: "+
    (document.fonts ?
      "available":"missing")
  );

  if(document.fonts){

    log(
      "FontFaceSet.add: "+
      typeof document.fonts.add
    );

    log(
      "FontFaceSet.delete: "+
      typeof document.fonts.delete
    );

    log(
      "FontFaceSet.check: "+
      typeof document.fonts.check
    );

    log(
      "FontFaceSet.load: "+
      typeof document.fonts.load
    );
  }

  log("");
}

/* =============================
   TEST 1
   FontFace construction
============================= */

async function constructFace(i){

  checkpoint(
    "constructFace",
    i,
    "construct"
  );

  const name=
    "V10Construct"+i;

  const f=
    new FontFace(
      name,
      "local(Arial)"
    );

  checkpoint(
    "constructFace",
    i,
    "properties"
  );

  f.style="normal";
  f.weight="400";
  f.stretch="normal";

  return f.family===name;
}

/* =============================
   TEST 2
   Add / remove lifecycle
============================= */

async function addRemove(i){

  checkpoint(
    "addRemove",
    i,
    "construct"
  );

  const name=
    "V10AddRemove"+i;

  const f=
    new FontFace(
      name,
      "local(Arial)"
    );

  checkpoint(
    "addRemove",
    i,
    "add"
  );

  document.fonts.add(f);

  checkpoint(
    "addRemove",
    i,
    "check"
  );

  document.fonts.check(
    "16px "+name
  );

  checkpoint(
    "addRemove",
    i,
    "delete"
  );

  document.fonts.delete(f);

  return true;
}

/* =============================
   TEST 3
   FontFace property churn
============================= */

async function propertyChurn(i){

  checkpoint(
    "propertyChurn",
    i,
    "construct"
  );

  const f=
    new FontFace(
      "V10Properties"+i,
      "local(Arial)"
    );

  checkpoint(
    "propertyChurn",
    i,
    "properties"
  );

  for(let n=0;n<50;n++){

    f.style=
      (n&1) ?
      "italic":"normal";

    f.weight=
      (n&1) ?
      "700":"400";

    f.stretch=
      (n&1) ?
      "condensed":"normal";
  }

  return true;
}

/* =============================
   TEST 4
   CSS rule lifecycle
============================= */

async function cssRuleLifecycle(i){

  checkpoint(
    "cssRuleLifecycle",
    i,
    "style-create"
  );

  const style=
    document.createElement("style");

  const name=
    "V10Rule"+i;

  style.textContent=
    "@font-face{"+
    "font-family:'"+name+"';"+
    "src:local(Arial);"+
    "}";

  checkpoint(
    "cssRuleLifecycle",
    i,
    "style-append"
  );

  document.head.appendChild(style);

  const element=
    document.createElement("span");

  element.textContent=
    "FontFace regression "+i;

  element.style.fontFamily=
    "'"+name+"'";

  sandbox.appendChild(element);

  checkpoint(
    "cssRuleLifecycle",
    i,
    "layout"
  );

  void element.offsetWidth;

  checkpoint(
    "cssRuleLifecycle",
    i,
    "remove-style"
  );

  style.remove();

  checkpoint(
    "cssRuleLifecycle",
    i,
    "layout-after-remove"
  );

  void element.offsetWidth;

  element.remove();

  return true;
}

/* =============================
   TEST 5
   Document/font lifetime
============================= */

async function frameFontLifetime(i){

  checkpoint(
    "frameFontLifetime",
    i,
    "frame-create"
  );

  const frame=
    document.createElement("iframe");

  sandbox.appendChild(frame);

  await new Promise(
    r=>setTimeout(r,0)
  );

  const doc=
    frame.contentDocument;

  if(!doc)
    return false;

  if(typeof doc.defaultView.FontFace
     !=="function"){

    frame.remove();
    return "unsupported";
  }

  checkpoint(
    "frameFontLifetime",
    i,
    "face-create"
  );

  const Face=
    doc.defaultView.FontFace;

  const face=
    new Face(
      "V10Frame"+i,
      "local(Arial)"
    );

  checkpoint(
    "frameFontLifetime",
    i,
    "font-add"
  );

  doc.fonts.add(face);

  const element=
    doc.createElement("span");

  element.textContent="frame font";
  element.style.fontFamily=
    "V10Frame"+i;

  doc.body.appendChild(element);

  checkpoint(
    "frameFontLifetime",
    i,
    "layout"
  );

  void element.offsetWidth;

  checkpoint(
    "frameFontLifetime",
    i,
    "remove-frame"
  );

  frame.remove();

  checkpoint(
    "frameFontLifetime",
    i,
    "retained-face"
  );

  /*
    Harmless inspection of the retained
    JS wrapper after document teardown.
  */

  const family=face.family;

  return typeof family==="string";
}

/* =============================
   TEST TABLE
============================= */

const tests=[
  ["constructFace",constructFace],
  ["addRemove",addRemove],
  ["propertyChurn",propertyChurn],
  ["cssRuleLifecycle",cssRuleLifecycle],
  ["frameFontLifetime",frameFontLifetime]
];

async function execute(name,fn,i){

  checkpoint(name,i,"BEGIN");

  try{

    const result=
      await fn(i);

    if(result===true){

      stats.pass++;

    }else if(result==="unsupported"){

      stats.unsupported++;

      log(
        "[UNSUPPORTED] "+
        name+" #"+i,
        "warn"
      );

    }else{

      stats.fail++;

      log(
        "[FAIL] "+
        name+" #"+i,
        "bad"
      );

      stopping=true;
    }

  }catch(e){

    stats.exceptions++;

    log(
      "[EXCEPTION] "+
      name+" #"+i+
      " :: "+e,
      "bad"
    );

    stopping=true;
  }

  checkpoint(
    name,
    i,
    "COMPLETE",
    "COMPLETE"
  );
}

async function start(){

  clearLog();
  previous();

  stopping=false;

  stats={
    pass:0,
    fail:0,
    exceptions:0,
    unsupported:0
  };

  capabilities();

  if(typeof FontFace!=="function"){

    log(
      "FontFace unavailable — stopping.",
      "warn"
    );

    return;
  }

  const runs=
    Number(
      document.getElementById(
        "runs"
      ).value
    );

  log(
    "V10 FONTFACE REGRESSION PROBE",
    "info"
  );

  log(
    "UA: "+navigator.userAgent
  );

  log(
    "Runs/test: "+runs
  );

  log("");

  const begin=
    performance.now();

  for(const [name,fn] of tests){

    if(stopping)
      break;

    log(
      ">>> "+name,
      "info"
    );

    for(let i=0;i<runs;i++){

      if(stopping)
        break;

      await execute(
        name,
        fn,
        i
      );

      if(i%10===0){

        log(
          name+" "+
          i+"/"+runs
        );

        await new Promise(
          r=>setTimeout(r,0)
        );
      }
    }
  }

  const elapsed=
    performance.now()-begin;

  log("");

  log(
    "======= V10 RESULT =======",
    "info"
  );

  log(
    "PASS:        "+
    stats.pass,
    "ok"
  );

  log(
    "FAIL:        "+
    stats.fail,
    stats.fail ?
      "bad":"ok"
  );

  log(
    "EXCEPTIONS:  "+
    stats.exceptions,
    stats.exceptions ?
      "bad":"ok"
  );

  log(
    "UNSUPPORTED: "+
    stats.unsupported,
    stats.unsupported ?
      "warn":"ok"
  );

  log(
    "RUNTIME:     "+
    elapsed.toFixed(0)+
    " ms"
  );

  log(
    "==========================",
    "info"
  );
}

async function replay(){

  clearLog();

  const c=
    readCheckpoint();

  if(!c){

    log(
      "No checkpoint available.",
      "warn"
    );

    return;
  }

  const entry=
    tests.find(
      x=>x[0]===c.test
    );

  if(!entry){

    log(
      "Checkpoint testcase unavailable.",
      "bad"
    );

    return;
  }

  log(
    "REPLAYING CHECKPOINT",
    "warn"
  );

  log(
    "Test: "+c.test
  );

  log(
    "Iteration: "+
    c.iteration
  );

  log(
    "Last phase: "+
    c.phase
  );

  stopping=false;

  for(let i=0;i<=c.iteration;i++){

    if(stopping)
      break;

    await execute(
      entry[0],
      entry[1],
      i
    );

    await new Promise(
      r=>setTimeout(r,0)
    );
  }

  if(!stopping){

    log(
      "Replay completed normally.",
      "ok"
    );
  }
}

previous();

</script>
