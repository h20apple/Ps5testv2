<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 — V23 Subframe History Probe</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:16px monospace;
    padding:10px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok { color:#59ff7a; }
.bad { color:#ff6868; }
.info { color:#63caff; }
.warn { color:#ffd166; }
</style>
</head>

<body>

<h2>PS5 13.60 — V23 Subframe History Probe</h2>

<button onclick="runV23()">RUN V23</button>

<div id="log"></div>
<div id="host"></div>

<script>
"use strict";

const KEY = "PS5_V23_CP";

const logBox =
    document.getElementById("log");

const host =
    document.getElementById("host");

let seq = 0;
let pass = 0;
let anomalies = 0;
let exceptions = 0;

function log(s,c="") {
    const d = document.createElement("div");
    d.textContent = s;
    d.className = c;
    logBox.appendChild(d);
}

function cp(test,phase,detail="") {

    seq++;

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"RUNNING",
                test:test,
                phase:phase,
                detail:detail,
                seq:seq,
                time:Date.now()
            })
        );
    } catch(e) {}

    log(
        seq + ": [" + test + "] " +
        phase +
        (detail ? " — " + detail : ""),
        "info"
    );
}

function previous() {

    try {

        const raw =
            localStorage.getItem(KEY);

        if (!raw)
            return;

        const x =
            JSON.parse(raw);

        if (x.status !== "RUNNING")
            return;

        log(
            "*****************************",
            "bad"
        );

        log(
            "PREVIOUS V23 DID NOT COMPLETE",
            "bad"
        );

        log(
            "TEST: " + x.test,
            "bad"
        );

        log(
            "LAST PHASE: " + x.phase,
            "bad"
        );

        if (x.detail)
            log(
                "DETAIL: " + x.detail,
                "bad"
            );

        log(
            "*****************************",
            "bad"
        );

    } catch(e) {}
}

function finish() {

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"COMPLETE",
                time:Date.now()
            })
        );
    } catch(e) {}
}

function delay(ms) {
    return new Promise(
        resolve => setTimeout(resolve,ms)
    );
}

function makeFrame() {

    const frame =
        document.createElement("iframe");

    /*
     * Same-origin about:blank frame so the
     * parent can observe its document/window.
     */

    host.appendChild(frame);

    const doc =
        frame.contentDocument;

    doc.open();

    doc.write(
        "<!doctype html>" +
        "<html>" +
        "<body>" +

        "<div id='top'>TOP</div>" +

        "<div style='height:600px'></div>" +

        "<div id='foo'>FOO</div>" +

        "<div style='height:600px'></div>" +

        "<div id='bar'>BAR</div>" +

        "</body>" +
        "</html>"
    );

    doc.close();

    return frame;
}


/*
 * TEST A
 *
 * Basic fragment navigation inside
 * the child frame.
 */

async function testA() {

    const name =
        "A_HASH_NAVIGATION";

    cp(name,"CREATE_FRAME");

    const frame =
        makeFrame();

    const win =
        frame.contentWindow;

    const doc =
        frame.contentDocument;

    cp(name,"SET_FOO");

    win.location.hash =
        "#foo";

    await delay(100);

    cp(
        name,
        "AFTER_FOO",
        win.location.hash
    );

    if (
        win.location.hash !== "#foo"
    ) {
        anomalies++;
        log(
            "Expected #foo",
            "bad"
        );
    }

    cp(name,"SET_BAR");

    win.location.hash =
        "#bar";

    await delay(100);

    cp(
        name,
        "AFTER_BAR",
        win.location.hash
    );

    if (
        win.location.hash !== "#bar"
    ) {
        anomalies++;
        log(
            "Expected #bar",
            "bad"
        );
    }

    void doc.body.offsetHeight;

    frame.remove();

    cp(name,"COMPLETE");

    pass++;
}


/*
 * TEST B
 *
 * Navigate child history backwards
 * while retaining child references.
 */

async function testB() {

    const name =
        "B_CHILD_BACK";

    cp(name,"CREATE_FRAME");

    const frame =
        makeFrame();

    const win =
        frame.contentWindow;

    const doc =
        frame.contentDocument;

    win.location.hash =
        "#foo";

    await delay(100);

    win.location.hash =
        "#bar";

    await delay(100);

    cp(
        name,
        "BEFORE_BACK",
        win.location.hash
    );

    win.history.back();

    cp(
        name,
        "BACK_RETURNED"
    );

    await delay(300);

    cp(
        name,
        "AFTER_BACK",
        win.location.hash
    );

    /*
     * Observe retained references.
     */

    void doc.readyState;
    void doc.body.offsetHeight;

    frame.remove();

    cp(name,"COMPLETE");

    pass++;
}


/*
 * TEST C
 *
 * Remove the iframe from its own
 * hashchange callback.
 */

async function testC() {

    const name =
        "C_REMOVE_IN_HASHCHANGE";

    cp(name,"CREATE_FRAME");

    const frame =
        makeFrame();

    const win =
        frame.contentWindow;

    const doc =
        frame.contentDocument;

    let callback = 0;

    win.addEventListener(
        "hashchange",
        function handler() {

            callback++;

            cp(
                name,
                "HASHCHANGE_ENTER",
                win.location.hash
            );

            win.removeEventListener(
                "hashchange",
                handler
            );

            cp(
                name,
                "REMOVE_FRAME"
            );

            frame.remove();

            cp(
                name,
                "READ_RETAINED_DOCUMENT"
            );

            /*
             * Browser-visible observation only.
             */

            void doc.readyState;
            void doc.body;

            cp(
                name,
                "HASHCHANGE_EXIT"
            );
        }
    );

    cp(name,"SET_HASH");

    win.location.hash =
        "#foo";

    cp(
        name,
        "HASH_SET_RETURNED"
    );

    await delay(300);

    if (callback !== 1) {

        anomalies++;

        log(
            "Unexpected hashchange count: " +
            callback,
            "bad"
        );
    }

    cp(name,"COMPLETE");

    pass++;
}


/*
 * TEST D
 *
 * Remove and reattach around fragment
 * history while keeping old references.
 */

async function testD() {

    const name =
        "D_REMOVE_REATTACH_HISTORY";

    cp(name,"CREATE_FRAME");

    const frame =
        makeFrame();

    const oldWin =
        frame.contentWindow;

    const oldDoc =
        frame.contentDocument;

    oldWin.location.hash =
        "#foo";

    await delay(100);

    cp(name,"REMOVE");

    frame.remove();

    await Promise.resolve();

    cp(name,"READ_WHILE_DETACHED");

    try {
        void oldWin.closed;
        void oldDoc.readyState;
        void oldDoc.body;
    } catch(e) {

        exceptions++;

        log(
            "Detached read: " +
            e.name + ": " +
            e.message,
            "warn"
        );
    }

    cp(name,"REATTACH");

    host.appendChild(frame);

    await delay(200);

    cp(name,"READ_AFTER_REATTACH");

    try {

        void oldWin.closed;
        void oldDoc.readyState;

        const current =
            frame.contentWindow;

        void current.location.href;

    } catch(e) {

        exceptions++;

        log(
            "Reattach read: " +
            e.name + ": " +
            e.message,
            "warn"
        );
    }

    frame.remove();

    cp(name,"COMPLETE");

    pass++;
}


/*
 * TEST E
 *
 * Replace the child document after
 * fragment navigation while retaining
 * the original document.
 */

async function testE() {

    const name =
        "E_NAV_REPLACE_DOCUMENT";

    cp(name,"CREATE_FRAME");

    const frame =
        makeFrame();

    const win =
        frame.contentWindow;

    const oldDoc =
        frame.contentDocument;

    const oldFoo =
        oldDoc.getElementById("foo");

    cp(name,"NAVIGATE");

    win.location.hash =
        "#foo";

    await delay(100);

    cp(name,"OPEN_DOCUMENT");

    win.document.open();

    cp(name,"WRITE_DOCUMENT");

    win.document.write(
        "<!doctype html>" +
        "<html><body>" +
        "<div id='replacement'>" +
        "REPLACEMENT_OK" +
        "</div>" +
        "</body></html>"
    );

    cp(name,"CLOSE_DOCUMENT");

    win.document.close();

    cp(name,"READ_OLD_REFERENCES");

    try {
        void oldDoc.readyState;
        void oldFoo.textContent;
        void oldFoo.ownerDocument;
    } catch(e) {

        exceptions++;

        log(
            "Old reference exception: " +
            e.name + ": " +
            e.message,
            "warn"
        );
    }

    cp(name,"CHECK_NEW_DOCUMENT");

    const replacement =
        frame.contentDocument
             .getElementById(
                 "replacement"
             );

    if (
        !replacement ||
        replacement.textContent !==
        "REPLACEMENT_OK"
    ) {

        anomalies++;

        log(
            "Replacement document mismatch",
            "bad"
        );
    }

    frame.remove();

    cp(name,"COMPLETE");

    pass++;
}


async function runV23() {

    logBox.innerHTML = "";
    host.innerHTML = "";

    previous();

    seq = 0;
    pass = 0;
    anomalies = 0;
    exceptions = 0;

    log(
        "V23 START",
        "info"
    );

    log(navigator.userAgent);
    log("");

    try {

        await testA();

        await delay(200);

        await testB();

        await delay(200);

        await testC();

        await delay(200);

        await testD();

        await delay(200);

        await testE();

        finish();

        log("");
        log(
            "======= V23 RESULT =======",
            "info"
        );

        log(
            "STATUS: " +
            (
                anomalies === 0
                ? "NORMAL"
                : "ANOMALY"
            ),
            anomalies === 0
            ? "ok"
            : "bad"
        );

        log(
            "TESTS COMPLETED: 5"
        );

        log(
            "PASS: " + pass
        );

        log(
            "EXCEPTIONS: " +
            exceptions
        );

        log(
            "ANOMALIES: " +
            anomalies
        );

        log(
            "==========================",
            "info"
        );

    } catch(e) {

        cp(
            "HARNESS",
            "UNCAUGHT_EXCEPTION",
            e.name + ": " + e.message
        );

        log("");
        log(
            "V23 STOPPED",
            "bad"
        );

        log(
            e.name + ": " +
            e.message,
            "bad"
        );
    }
}

previous();

</script>
</body>
</html>
