<!doctype html>
<meta charset="utf-8">
<title>PS5 WebKit 13.60 V9 Regression Hunter</title>

<style>
body{
  background:#101827;color:#eee;
  font:16px monospace;padding:18px
}
button,select{
  font:16px monospace;padding:9px;margin:4px
}
#log{
  background:#17233a;padding:14px;
  white-space:pre-wrap;margin-top:10px
}
.ok{color:#59ff7a}
.bad{color:#ff6868}
.warn{color:#ffd166}
.info{color:#63caff}
#sandbox{position:absolute;left:-20000px;top:0}
</style>

<h2>PS5 WebKit 13.60 V9 Regression Hunter</h2>

Runs/test:
<select id="runs">
 <option value="10">10</option>
 <option value="100" selected>100</option>
 <option value="500">500</option>
</select>

<button onclick="runAll()">RUN ALL</button>
<button onclick="replay()">REPLAY CHECKPOINT</button>
<button onclick="stop()">STOP</button>
<button onclick="clearLog()">CLEAR</button>

<div id="sandbox"></div>
<div id="log"></div>

<script>
"use strict";

const out=document.getElementById("log");
const sandbox=document.getElementById("sandbox");

let stopping=false;

let stats={
  pass:0,
  fail:0,
  exceptions:0,
  timeout:0
};

function log(s,c=""){
  const d=document.createElement("div");
  d.textContent=s;
  d.className=c;
  out.appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);
}

function clearLog(){ out.innerHTML=""; }

function stop(){
  stopping=true;
  log("STOP REQUESTED","warn");
}

/* ===============================
   Persistent crash checkpoint
================================ */

function cp(test,iteration,phase,state="RUNNING"){
  try{
    localStorage.setItem("v9cp",JSON.stringify({
      test:test,
      iteration:iteration,
      phase:phase,
      state:state,
      time:Date.now()
    }));
  }catch(e){}
}

function readCP(){
  try{
    const x=localStorage.getItem("v9cp");
    return x ? JSON.parse(x) : null;
  }catch(e){
    return null;
  }
}

function previous(){
  const c=readCP();

  if(c && c.state==="RUNNING"){
    log("================================","bad");
    log("PREVIOUS EXECUTION INCOMPLETE","bad");
    log("TEST: "+c.test,"bad");
    log("ITERATION: "+c.iteration,"bad");
    log("PHASE: "+c.phase,"bad");
    log("================================","bad");
  }
}

/* ===============================
   1. IFRAME DOCUMENT RETENTION
================================ */

async function frameRetention(i){

  cp("frameRetention",i,"create-frame");

  const f=document.createElement("iframe");
  f.src="about:blank";
  sandbox.appendChild(f);

  await new Promise(r=>setTimeout(r,0));

  const doc=f.contentDocument;

  if(!doc){
    f.remove();
    return false;
  }

  cp("frameRetention",i,"build-old-document");

  const holder=doc.createElement("div");

  for(let n=0;n<30;n++){
    const x=doc.createElement("span");
    x.textContent=n;
    holder.appendChild(x);
  }

  doc.body.appendChild(holder);

  const retained=holder.children[15];

  cp("frameRetention",i,"remove-frame");

  f.remove();

  cp("frameRetention",i,"mutate-retained-node");

  retained.textContent="retained-"+i;
  retained.setAttribute("data-v9",String(i));

  return (
    retained.textContent==="retained-"+i &&
    retained.getAttribute("data-v9")===String(i)
  );
}

/* ===============================
   2. FRAME DOCUMENT REPLACEMENT
================================ */

async function documentReplacement(i){

  cp("documentReplacement",i,"frame");

  const f=document.createElement("iframe");
  sandbox.appendChild(f);

  await new Promise(r=>setTimeout(r,0));

  const oldDoc=f.contentDocument;

  if(!oldDoc){
    f.remove();
    return false;
  }

  const oldNode=oldDoc.createElement("div");
  oldNode.textContent="old";
  oldDoc.body.appendChild(oldNode);

  cp("documentReplacement",i,"document-open");

  oldDoc.open();

  cp("documentReplacement",i,"document-write");

  oldDoc.write(
    "<!doctype html><body>"+
    "<div id='new'>new-"+i+"</div>"
  );

  cp("documentReplacement",i,"document-close");

  oldDoc.close();

  cp("documentReplacement",i,"old-wrapper");

  oldNode.textContent="still-alive-"+i;

  const ok=
    oldNode.textContent==="still-alive-"+i;

  f.remove();

  return ok;
}

/* ===============================
   3. RANGE + TREE DESTRUCTION
================================ */

async function rangeDestroy(i){

  cp("rangeDestroy",i,"build");

  const root=document.createElement("div");

  root.innerHTML=
    "<section>"+
      "<div><span>ABCDEFGHIJ</span></div>"+
      "<div><b>KLMNOPQRST</b></div>"+
      "<div><em>UVWXYZ</em></div>"+
    "</section>";

  sandbox.appendChild(root);

  const a=root.querySelector("span").firstChild;
  const b=root.querySelector("em").firstChild;

  const r=document.createRange();

  cp("rangeDestroy",i,"set-range");

  r.setStart(a,2);
  r.setEnd(b,4);

  cp("rangeDestroy",i,"extract");

  const frag=r.extractContents();

  cp("rangeDestroy",i,"destroy-original");

  root.textContent="replacement-"+i;

  cp("rangeDestroy",i,"inspect-fragment");

  const ok=
    frag.nodeType===Node.DOCUMENT_FRAGMENT_NODE;

  root.remove();

  return ok;
}

/* ===============================
   4. EVENT LISTENER DESTROYS TREE
================================ */

async function listenerDestroy(i){

  cp("listenerDestroy",i,"build");

  const outer=document.createElement("div");
  const inner=document.createElement("div");
  const child=document.createElement("button");

  outer.appendChild(inner);
  inner.appendChild(child);
  sandbox.appendChild(outer);

  let called=0;

  function h(){
    called++;

    cp("listenerDestroy",i,"inside-listener");

    outer.remove();

    inner.textContent="detached-"+i;

    child.removeEventListener("v9",h);
  }

  child.addEventListener("v9",h);

  cp("listenerDestroy",i,"dispatch");

  child.dispatchEvent(new Event("v9",{
    bubbles:true
  }));

  cp("listenerDestroy",i,"after-dispatch");

  return (
    called===1 &&
    inner.textContent==="detached-"+i
  );
}

/* ===============================
   5. MUTATION OBSERVER RE-ENTRY
================================ */

async function observerReentry(i){

  return new Promise(resolve=>{

    cp("observerReentry",i,"build");

    const root=document.createElement("div");
    sandbox.appendChild(root);

    let callbacks=0;
    let done=false;

    const observer=new MutationObserver(function(){

      callbacks++;

      cp(
        "observerReentry",
        i,
        "observer-callback"
      );

      observer.disconnect();

      while(root.firstChild)
        root.removeChild(root.firstChild);

      root.textContent="observer-"+i;

      Promise.resolve().then(function(){

        if(done) return;
        done=true;

        const ok=
          callbacks===1 &&
          root.textContent==="observer-"+i;

        root.remove();
        resolve(ok);
      });
    });

    observer.observe(root,{
      childList:true,
      subtree:true
    });

    cp("observerReentry",i,"trigger");

    const x=document.createElement("span");
    x.textContent="trigger";
    root.appendChild(x);

    setTimeout(function(){
      if(done) return;

      done=true;
      observer.disconnect();
      root.remove();

      resolve("timeout");
    },500);
  });
}

/* ===============================
   6. ADOPT NODE BETWEEN DOCUMENTS
================================ */

async function adoptNodeTest(i){

  cp("adoptNode",i,"frames");

  const a=document.createElement("iframe");
  const b=document.createElement("iframe");

  sandbox.appendChild(a);
  sandbox.appendChild(b);

  await new Promise(r=>setTimeout(r,0));

  const da=a.contentDocument;
  const db=b.contentDocument;

  if(!da || !db){
    a.remove();
    b.remove();
    return false;
  }

  const node=da.createElement("div");
  node.innerHTML="<span>adopt-"+i+"</span>";
  da.body.appendChild(node);

  cp("adoptNode",i,"adopt");

  const adopted=db.adoptNode(node);

  cp("adoptNode",i,"append-new-document");

  db.body.appendChild(adopted);

  cp("adoptNode",i,"destroy-source-frame");

  a.remove();

  cp("adoptNode",i,"mutate");

  adopted.setAttribute("data-v9","yes");

  const ok=
    adopted.ownerDocument===db &&
    adopted.getAttribute("data-v9")==="yes";

  b.remove();

  return ok;
}

/* ===============================
   7. COMMENT REMOVE REGRESSION

   Mirrors ordinary remove()
   semantics tested upstream.
================================ */

async function repeatedRemove(i){

  cp("repeatedRemove",i,"create");

  const root=document.createElement("div");
  const comment=document.createComment("v9-"+i);

  root.appendChild(comment);
  sandbox.appendChild(root);

  cp("repeatedRemove",i,"remove-1");

  comment.remove();

  cp("repeatedRemove",i,"remove-2");

  comment.remove();

  cp("repeatedRemove",i,"remove-3");

  comment.remove();

  const ok=root.childNodes.length===0;

  root.remove();

  return ok;
}

/* ===============================
   TEST TABLE
================================ */

const tests=[
 ["frameRetention",frameRetention],
 ["documentReplacement",documentReplacement],
 ["rangeDestroy",rangeDestroy],
 ["listenerDestroy",listenerDestroy],
 ["observerReentry",observerReentry],
 ["adoptNode",adoptNodeTest],
 ["repeatedRemove",repeatedRemove]
];

async function execute(name,fn,i){

  cp(name,i,"BEGIN");

  try{

    const result=await fn(i);

    if(result==="timeout"){
      stats.timeout++;
      log(
        "[TIMEOUT] "+name+" #"+i,
        "warn"
      );
    }

    else if(result===true){
      stats.pass++;
    }

    else{
      stats.fail++;

      log(
        "[FAIL] "+name+" #"+i,
        "bad"
      );

      stopping=true;
    }

  }catch(e){

    stats.exceptions++;

    log(
      "[EXCEPTION] "+
      name+" #"+i+" :: "+e,
      "bad"
    );

    stopping=true;
  }

  cp(name,i,"COMPLETE","COMPLETE");
}

async function runAll(){

  clearLog();
  previous();

  stopping=false;

  stats={
    pass:0,
    fail:0,
    exceptions:0,
    timeout:0
  };

  const runs=
    Number(document.getElementById("runs").value);

  log("V9 REGRESSION HUNTER","info");
  log("UA: "+navigator.userAgent);
  log("Tests: "+tests.length);
  log("Runs/test: "+runs);
  log("");

  const begin=performance.now();

  for(const entry of tests){

    if(stopping) break;

    const name=entry[0];
    const fn=entry[1];

    log(">>> "+name,"info");

    for(let i=0;i<runs;i++){

      if(stopping) break;

      await execute(name,fn,i);

      if(i%10===0){

        log(
          name+" "+
          i+"/"+runs
        );

        await new Promise(
          r=>setTimeout(r,0)
        );
      }
    }
  }

  const elapsed=
    performance.now()-begin;

  log("");
  log("======= V9 RESULT =======","info");
  log("PASS:       "+stats.pass,"ok");
  log(
    "FAIL:       "+stats.fail,
    stats.fail?"bad":"ok"
  );
  log(
    "EXCEPTIONS: "+stats.exceptions,
    stats.exceptions?"bad":"ok"
  );
  log(
    "TIMEOUT:    "+stats.timeout,
    stats.timeout?"warn":"ok"
  );
  log(
    "RUNTIME:    "+
    elapsed.toFixed(0)+" ms"
  );
  log("=========================","info");
}

/* ===============================
   REPLAY CHECKPOINT
================================ */

async function replay(){

  clearLog();

  const c=readCP();

  if(!c){
    log("No checkpoint available","warn");
    return;
  }

  const entry=
    tests.find(x=>x[0]===c.test);

  if(!entry){
    log("Checkpoint test unavailable","bad");
    return;
  }

  log("CHECKPOINT REPLAY","warn");
  log("Test: "+c.test);
  log("Iteration: "+c.iteration);
  log("Last phase: "+c.phase);
  log("");

  stopping=false;

  /*
    Replay the selected testcase up through
    the iteration where execution stopped.
  */

  for(let i=0;i<=c.iteration;i++){

    if(stopping) break;

    log(
      "Replay "+
      i+"/"+c.iteration
    );

    await execute(
      entry[0],
      entry[1],
      i
    );

    await new Promise(
      r=>setTimeout(r,0)
    );
  }

  if(!stopping)
    log(
      "Replay completed normally.",
      "ok"
    );
}

previous();
</script>
