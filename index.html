<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V32 MutationObserver Lifetime</title>

<style>
body {
    background:#111;
    color:#eee;
    font:15px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

<h2>PS5 13.60 — V32</h2>
<div>MutationObserver callback / node lifetime probe</div>

<p><button id="run">RUN V32</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

/*
 * V32
 *
 * Lifetime/re-entrancy diagnostic inspired by
 * WebKit bug 179224:
 *
 * "MutationObserver callback should be kept alive
 * as long as its observed nodes are alive"
 *
 * No heap spray/reclaim or memory primitive.
 */

const output = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const button = document.querySelector("#run");

let pass = 0;
let exceptions = 0;
let anomalies = 0;

function log(s) {
    output.textContent += s + "\n";
    console.log(s);
}

function cp(s) {
    try {
        localStorage.setItem("PS5_V32_CP", s);
    } catch (_) {}

    log("[CP] " + s);
}

function good(name) {
    pass++;
    log("[PASS] " + name);
}

function bad(name, reason) {
    anomalies++;
    log("[ANOMALY] " + name + " :: " + reason);
}

function caught(name, e) {
    exceptions++;
    log("[EXCEPTION] " + name + " :: " + e);
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

/*
 * A
 * Basic observer delivery.
 */

async function testA() {

    const name = "A_BASIC_DELIVERY";

    cp(name + ":CREATE");

    try {

        const node = document.createElement("div");
        document.body.appendChild(node);

        let calls = 0;

        const observer =
            new MutationObserver(records => {

                calls++;

                cp(name + ":CALLBACK");

                log(
                    "[A] records=" +
                    records.length
                );

                log(
                    "[A] node connected=" +
                    node.isConnected
                );
            });

        observer.observe(node, {
            attributes:true
        });

        node.setAttribute("data-v32", "1");

        await sleep(50);

        log("[A] callbacks=" + calls);

        if (calls !== 1)
            bad(name, "unexpected callback count " + calls);

        observer.disconnect();
        node.remove();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/*
 * B
 * Remove observed node before callback delivery.
 */

async function testB() {

    const name = "B_REMOVE_BEFORE_DELIVERY";

    cp(name + ":CREATE");

    try {

        const parent =
            document.createElement("div");

        const target =
            document.createElement("span");

        target.textContent = "V32-B";

        parent.appendChild(target);
        document.body.appendChild(parent);

        let calls = 0;

        const observer =
            new MutationObserver(records => {

                calls++;

                cp(name + ":CALLBACK_ENTER");

                log(
                    "[B] records=" +
                    records.length
                );

                log(
                    "[B] target connected=" +
                    target.isConnected
                );

                log(
                    "[B] retained text=" +
                    target.textContent
                );

                cp(name + ":CALLBACK_EXIT");
            });

        observer.observe(target, {
            attributes:true
        });

        cp(name + ":MUTATE");

        target.setAttribute(
            "data-test",
            "removed"
        );

        cp(name + ":REMOVE");

        parent.remove();

        await sleep(50);

        log("[B] callbacks=" + calls);
        log(
            "[B] final connected=" +
            target.isConnected
        );

        if (calls !== 1)
            bad(name, "callback count=" + calls);

        observer.disconnect();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/*
 * C
 * Observer removes its own target synchronously.
 */

async function testC() {

    const name = "C_REMOVE_IN_CALLBACK";

    cp(name + ":CREATE");

    try {

        const outer =
            document.createElement("div");

        const target =
            document.createElement("div");

        target.textContent = "V32-C";

        outer.appendChild(target);
        document.body.appendChild(outer);

        let calls = 0;

        const observer =
            new MutationObserver(records => {

                calls++;

                cp(name + ":CALLBACK_ENTER");

                if (calls === 1) {

                    target.remove();

                    cp(name + ":TARGET_REMOVED");

                    log(
                        "[C] connected=" +
                        target.isConnected
                    );

                    log(
                        "[C] retained text=" +
                        target.textContent
                    );

                    log(
                        "[C] records=" +
                        records.length
                    );
                }

                cp(name + ":CALLBACK_EXIT");
            });

        observer.observe(target, {
            attributes:true,
            childList:true,
            subtree:true
        });

        target.setAttribute(
            "data-trigger",
            "1"
        );

        await sleep(75);

        log("[C] callbacks=" + calls);

        observer.disconnect();
        outer.remove();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/*
 * D
 * Replace observed subtree from callback while
 * retaining references to old nodes.
 */

async function testD() {

    const name = "D_REPLACE_SUBTREE";

    cp(name + ":CREATE");

    try {

        const host =
            document.createElement("div");

        host.innerHTML =
            "<section><b>AAAA</b></section>";

        document.body.appendChild(host);

        const section =
            host.firstChild;

        const oldChild =
            section.firstChild;

        let calls = 0;

        const observer =
            new MutationObserver(records => {

                calls++;

                cp(name + ":CALLBACK_ENTER");

                if (calls === 1) {

                    section.innerHTML =
                        "<i>BBBB</i>";

                    cp(name + ":SUBTREE_REPLACED");

                    log(
                        "[D] old connected=" +
                        oldChild.isConnected
                    );

                    log(
                        "[D] old text=" +
                        oldChild.textContent
                    );

                    log(
                        "[D] new text=" +
                        section.textContent
                    );
                }

                cp(name + ":CALLBACK_EXIT");
            });

        observer.observe(section, {
            attributes:true,
            childList:true,
            subtree:true
        });

        section.setAttribute(
            "data-v32",
            "trigger"
        );

        await sleep(75);

        log("[D] callbacks=" + calls);

        observer.disconnect();
        host.remove();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/*
 * E
 * Disconnect observer from inside callback,
 * remove target, then continue using retained
 * wrappers.
 */

async function testE() {

    const name = "E_DISCONNECT_REENTRANT";

    cp(name + ":CREATE");

    try {

        const target =
            document.createElement("div");

        target.innerHTML =
            "<span>V32-E</span>";

        document.body.appendChild(target);

        const retained =
            target.firstChild;

        let calls = 0;
        let observer;

        observer =
            new MutationObserver(records => {

                calls++;

                cp(name + ":CALLBACK_ENTER");

                observer.disconnect();

                cp(name + ":DISCONNECTED");

                target.remove();

                cp(name + ":REMOVED");

                log(
                    "[E] records=" +
                    records.length
                );

                log(
                    "[E] target connected=" +
                    target.isConnected
                );

                log(
                    "[E] retained connected=" +
                    retained.isConnected
                );

                log(
                    "[E] retained text=" +
                    retained.textContent
                );

                cp(name + ":CALLBACK_EXIT");
            });

        observer.observe(target, {
            attributes:true,
            childList:true,
            subtree:true
        });

        target.setAttribute(
            "data-trigger",
            "1"
        );

        await sleep(75);

        log("[E] callbacks=" + calls);

        if (calls !== 1)
            bad(name, "callback count=" + calls);

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/*
 * F
 * Observer callback causes a second mutation.
 *
 * We deliberately cap this at two callbacks.
 */

async function testF() {

    const name = "F_REENTRANT_MUTATION";

    cp(name + ":CREATE");

    try {

        const target =
            document.createElement("div");

        target.textContent = "V32-F";

        document.body.appendChild(target);

        let calls = 0;

        const observer =
            new MutationObserver(records => {

                calls++;

                cp(
                    name +
                    ":CALLBACK_" +
                    calls
                );

                log(
                    "[F] callback=" +
                    calls +
                    " records=" +
                    records.length
                );

                if (calls === 1) {

                    target.setAttribute(
                        "data-second",
                        "2"
                    );

                    cp(
                        name +
                        ":SECOND_MUTATION"
                    );
                }
            });

        observer.observe(target, {
            attributes:true
        });

        target.setAttribute(
            "data-first",
            "1"
        );

        await sleep(100);

        log("[F] callbacks=" + calls);

        if (calls !== 2) {
            bad(
                name,
                "expected 2 deliveries, got " +
                calls
            );
        }

        observer.disconnect();
        target.remove();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


async function run() {

    button.disabled = true;
    output.textContent = "";

    pass = 0;
    exceptions = 0;
    anomalies = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    const previous =
        localStorage.getItem(
            "PS5_V32_CP"
        );

    if (previous) {
        log(
            "Previous checkpoint: " +
            previous
        );
    }

    log("PS5 13.60 — V32");
    log(
        "MutationObserver Lifetime Probe"
    );
    log("");

    log(navigator.userAgent);

    log("");

    log(
        "MutationObserver=" +
        typeof MutationObserver
    );

    if (
        typeof MutationObserver
        !== "function"
    ) {

        log(
            "[UNSUPPORTED] MutationObserver"
        );

        statusBox.textContent =
            "STATUS: UNSUPPORTED";

        button.disabled = false;
        return;
    }

    await testA();
    await testB();
    await testC();
    await testD();
    await testE();
    await testF();

    cp("V32:COMPLETE");

    log("");
    log("============================");
    log("V32 RESULT");
    log("============================");

    log("TESTS: 6");
    log("PASS: " + pass);
    log(
        "EXCEPTIONS: " +
        exceptions
    );
    log(
        "ANOMALIES: " +
        anomalies
    );

    log("============================");

    statusBox.textContent =
        exceptions || anomalies
        ? "STATUS: CHECK RESULT"
        : "STATUS: NORMAL";

    button.disabled = false;
}

button.onclick = run;
</script>
