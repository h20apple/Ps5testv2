<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V35.3 TransformStream Iterator Mapper</title>

<style>
body {
    background:#111;
    color:#eee;
    font:16px monospace;
    padding:20px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

<h2>PS5 13.60 — V35.3</h2>
<p>TransformStream internal Array iterator mapper</p>

<button id="run">RUN V35.3</button>
<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const out = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const button = document.querySelector("#run");

const originalIterator =
    Array.prototype[Symbol.iterator];

function log(x) {
    out.textContent += x + "\n";
}

function restore() {
    Array.prototype[Symbol.iterator] =
        originalIterator;
}

function safeType(v) {

    if (v === null)
        return "null";

    if (Array.isArray(v))
        return "array";

    return typeof v;
}

function run() {

    button.disabled = true;
    out.textContent = "";

    statusBox.textContent =
        "STATUS: RUNNING";

    log("PS5 13.60 — V35.3");
    log("TransformStream Iterator Mapper");
    log("");
    log(navigator.userAgent);
    log("");

    if (
        typeof TransformStream !==
        "function"
    ) {
        log("TransformStream unsupported");

        statusBox.textContent =
            "STATUS: UNSUPPORTED";

        button.disabled = false;
        return;
    }

    /*
     * Do NOT log while the override is active.
     *
     * Logging/DOM operations may themselves
     * create or iterate arrays and contaminate
     * our observations.
     */

    const records = [];

    let iteratorNumber = 0;
    let totalNextCalls = 0;

    Array.prototype[Symbol.iterator] =
        function() {

            iteratorNumber++;

            const number =
                iteratorNumber;

            const array =
                this;

            const record = {
                iterator:number,
                initialLength:array.length,
                returned:[],
                doneCalls:0
            };

            records.push(record);

            let index = 0;

            return {
                next() {

                    totalNextCalls++;

                    if (
                        index >=
                        array.length
                    ) {

                        record.doneCalls++;

                        return {
                            done:true,
                            value:undefined
                        };
                    }

                    const value =
                        array[index];

                    /*
                     * Record only primitive metadata.
                     * Do not inspect object properties.
                     */

                    record.returned.push({
                        index:index,
                        type:safeType(value)
                    });

                    index++;

                    /*
                     * CONTROL:
                     * Return the original value
                     * completely unchanged.
                     */

                    return {
                        done:false,
                        value:value
                    };
                }
            };
        };

    let stream = null;
    let error = null;

    try {

        stream =
            new TransformStream();

    } catch(e) {

        error = {
            name:e.name,
            message:e.message
        };
    }

    /*
     * Restore BEFORE rendering anything.
     */

    restore();

    log("Constructor finished.");
    log("");

    if (error) {

        log(
            "EXCEPTION: " +
            error.name +
            ": " +
            error.message
        );

    } else {

        log(
            "TransformStream: SUCCESS"
        );

        log(
            "readable: " +
            typeof stream.readable
        );

        log(
            "writable: " +
            typeof stream.writable
        );
    }

    log("");
    log("==========================");
    log("ITERATOR MAP");
    log("==========================");

    log(
        "Iterator calls: " +
        records.length
    );

    log(
        "Total next() calls: " +
        totalNextCalls
    );

    log("");

    for (
        let i = 0;
        i < records.length;
        i++
    ) {

        const r =
            records[i];

        log(
            "Iterator #" +
            r.iterator
        );

        log(
            "  initial length = " +
            r.initialLength
        );

        log(
            "  values returned = " +
            r.returned.length
        );

        log(
            "  done calls = " +
            r.doneCalls
        );

        for (
            let j = 0;
            j < r.returned.length;
            j++
        ) {

            const v =
                r.returned[j];

            log(
                "  [" +
                v.index +
                "] type = " +
                v.type
            );
        }

        log("");
    }

    /*
     * Sanity check.
     */

    let accounted = 0;

    for (
        let i = 0;
        i < records.length;
        i++
    ) {

        accounted +=
            records[i].returned.length;

        accounted +=
            records[i].doneCalls;
    }

    log("==========================");

    log(
        "Accounted next() calls: " +
        accounted
    );

    log(
        "Observed next() calls: " +
        totalNextCalls
    );

    if (
        accounted ===
        totalNextCalls
    ) {

        log(
            "MAPPING: CONSISTENT"
        );

    } else {

        log(
            "MAPPING: CHECK RESULT"
        );
    }

    log("==========================");

    statusBox.textContent =
        "STATUS: COMPLETE";

    button.disabled = false;
}

button.onclick = run;

window.addEventListener(
    "pagehide",
    restore
);

window.addEventListener(
    "beforeunload",
    restore
);
</script>
