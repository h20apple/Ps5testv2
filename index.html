<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 — V18 SSV Lifetime Probe</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:16px monospace;
    padding:10px;
    margin:5px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok { color:#59ff7a; }
.bad { color:#ff6868; }
.warn { color:#ffd166; }
.info { color:#63caff; }
.spacer { height:1800px; }
</style>
</head>

<body>

<h2>PS5 13.60 — V18 SSV Lifetime Probe</h2>

<button onclick="runV18()">RUN V18</button>
<button onclick="clearCP()">CLEAR CHECKPOINT</button>

<div id="log"></div>

<div class="spacer"></div>

<a id="v18target" href="#v18target">
    V18 fragment target
</a>

<script>
"use strict";

const KEY = "PS5_V18_CP";

const logBox =
    document.getElementById("log");

let seq = 0;
let events = [];

function log(text, cls="") {

    const d =
        document.createElement("div");

    d.textContent = text;
    d.className = cls;

    logBox.appendChild(d);
}

function cp(name, extra="") {

    seq++;

    const entry = {
        n: seq,
        name: name,
        extra: extra,
        href: location.href,
        time: performance.now()
    };

    events.push(entry);

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                state:"RUNNING",
                last:entry,
                events:events.slice(-50)
            })
        );
    } catch(e) {}

    log(
        seq + ": " +
        name +
        (extra ? " — " + extra : ""),
        "info"
    );
}

function complete() {

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                state:"COMPLETE",
                events:events
            })
        );
    } catch(e) {}
}

function clearCP() {

    localStorage.removeItem(KEY);

    log(
        "Checkpoint cleared.",
        "warn"
    );
}

function previousRun() {

    try {

        const raw =
            localStorage.getItem(KEY);

        if (!raw)
            return;

        const data =
            JSON.parse(raw);

        if (data.state !== "RUNNING")
            return;

        log(
            "****************************",
            "bad"
        );

        log(
            "PREVIOUS RUN INCOMPLETE",
            "bad"
        );

        if (data.last) {

            log(
                "LAST CHECKPOINT: " +
                data.last.n +
                " / " +
                data.last.name,
                "bad"
            );
        }

        log(
            "****************************",
            "bad"
        );

    } catch(e) {}
}

function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

function describeState(state) {

    try {
        return JSON.stringify(state);
    } catch(e) {
        return "[unserializable]";
    }
}

function waitForPop() {

    return new Promise(
        (resolve,reject) => {

            const timer =
                setTimeout(() => {

                    reject(
                        new Error(
                            "popstate timeout"
                        )
                    );

                },5000);

            addEventListener(
                "popstate",
                function handler(e) {

                    clearTimeout(timer);

                    cp(
                        "POPSTATE_ENTER",
                        describeState(e.state)
                    );

                    /*
                     * Read the state exposed through
                     * both interfaces while inside
                     * the callback.
                     */

                    cp(
                        "POP_EVENT_STATE",
                        describeState(e.state)
                    );

                    cp(
                        "HISTORY_STATE_IN_POP",
                        describeState(history.state)
                    );

                    cp(
                        "POPSTATE_EXIT"
                    );

                    resolve(e);

                },
                {once:true}
            );
        }
    );
}

async function runV18() {

    logBox.innerHTML = "";

    previousRun();

    seq = 0;
    events = [];

    let blurCount = 0;
    let replaceCount = 0;
    let anomalyCount = 0;

    log(
        "V18 START",
        "info"
    );

    log(navigator.userAgent);
    log("");

    try {

        /*
         * Baseline.
         */

        cp("BASELINE");

        history.replaceState(
            {
                test:"v18-base",
                marker:0x1800
            },
            "",
            location.pathname
        );

        /*
         * State that will become the target
         * of history.back().
         */

        const originalState = {
            test:"v18-original",
            marker:0x1818,
            text:"ORIGINAL_STATE"
        };

        cp(
            "CREATE_ORIGINAL_STATE",
            describeState(originalState)
        );

        history.pushState(
            originalState,
            "",
            location.pathname +
            "#v18target"
        );

        cp("PUSH_ORIGINAL_COMPLETE");

        /*
         * Move to a second history entry.
         */

        history.pushState(
            {
                test:"v18-current",
                marker:0x1820,
                text:"CURRENT_STATE"
            },
            "",
            location.pathname
        );

        cp("PUSH_CURRENT_COMPLETE");

        /*
         * Focus target.
         */

        const input =
            document.createElement("input");

        input.value =
            "V18 focused input";

        document.body.insertBefore(
            input,
            document.body.firstChild
        );

        input.onfocus = function() {

            cp("INPUT_FOCUS");
        };

        input.onblur = function() {

            blurCount++;

            cp(
                "BLUR_ENTER",
                "count=" + blurCount
            );

            /*
             * Record what WebKit exposes before
             * replaceState.
             */

            const before =
                history.state;

            cp(
                "STATE_BEFORE_REPLACE",
                describeState(before)
            );

            /*
             * Replace the state while executing
             * from the blur callback.
             */

            const replacement = {
                test:"v18-replacement",
                marker:0x18FF,
                text:"REPLACEMENT_STATE"
            };

            cp(
                "BEFORE_REPLACE_STATE",
                describeState(replacement)
            );

            history.replaceState(
                replacement,
                "",
                location.href
            );

            replaceCount++;

            cp(
                "AFTER_REPLACE_STATE"
            );

            /*
             * Immediately observe the state again.
             */

            const after =
                history.state;

            cp(
                "STATE_AFTER_REPLACE",
                describeState(after)
            );

            if (
                !after ||
                after.test !==
                    "v18-replacement" ||
                after.marker !==
                    0x18FF
            ) {

                anomalyCount++;

                cp(
                    "ANOMALY_AFTER_REPLACE",
                    describeState(after)
                );
            }

            cp("BLUR_EXIT");
        };

        cp("BEFORE_INPUT_FOCUS");

        input.focus();

        cp("AFTER_INPUT_FOCUS");

        await sleep(100);

        /*
         * Same-document navigation back to
         * the fragment entry.
         */

        const pop =
            waitForPop();

        cp("BEFORE_HISTORY_BACK");

        history.back();

        cp(
            "AFTER_HISTORY_BACK_RETURN"
        );

        const popEvent =
            await pop;

        cp(
            "AFTER_POPSTATE",
            describeState(popEvent.state)
        );

        /*
         * Compare the state once the navigation
         * operation has completely settled.
         */

        await sleep(250);

        cp("SETTLED_CHECK");

        const finalHistoryState =
            history.state;

        const finalEventState =
            popEvent.state;

        cp(
            "FINAL_HISTORY_STATE",
            describeState(finalHistoryState)
        );

        cp(
            "FINAL_EVENT_STATE",
            describeState(finalEventState)
        );

        /*
         * We expect the replacement state to be
         * consistently visible after replacement.
         */

        if (
            !finalHistoryState ||
            finalHistoryState.test !==
                "v18-replacement" ||
            finalHistoryState.marker !==
                0x18FF
        ) {

            anomalyCount++;

            cp(
                "FINAL_HISTORY_ANOMALY",
                describeState(finalHistoryState)
            );
        }

        /*
         * Basic object integrity checks only.
         */

        cp("OBJECT_INTEGRITY_CHECK");

        if (
            originalState.test !==
                "v18-original" ||
            originalState.marker !==
                0x1818 ||
            originalState.text !==
                "ORIGINAL_STATE"
        ) {

            anomalyCount++;

            cp(
                "ORIGINAL_OBJECT_CHANGED",
                describeState(originalState)
            );
        }

        /*
         * Cleanup.
         */

        input.onblur = null;
        input.onfocus = null;
        input.remove();

        history.replaceState(
            null,
            "",
            location.pathname
        );

        cp("CLEANUP_COMPLETE");

        complete();

        log("");
        log(
            "======= V18 RESULT =======",
            "info"
        );

        log(
            "STATUS: " +
            (
                anomalyCount === 0
                ? "NORMAL"
                : "ANOMALY"
            ),
            anomalyCount === 0
                ? "ok"
                : "bad"
        );

        log(
            "BLUR CALLBACKS: " +
            blurCount
        );

        log(
            "REPLACE IN BLUR: " +
            replaceCount
        );

        log(
            "ANOMALIES: " +
            anomalyCount
        );

        log(
            "EVENTS: " +
            events.length
        );

        log(
            "==========================",
            "info"
        );

    } catch(e) {

        cp(
            "JS_EXCEPTION",
            String(e)
        );

        log("");
        log(
            "V18 EXCEPTION",
            "bad"
        );

        log(
            String(e),
            "bad"
        );
    }
}

previousRun();

</script>
</body>
</html>
