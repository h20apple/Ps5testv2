<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 V16 Same-Document Re-entry</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:16px monospace;
    padding:10px;
    margin:5px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok { color:#59ff7a; }
.bad { color:#ff6868; }
.warn { color:#ffd166; }
.info { color:#63caff; }

#targets {
    position:absolute;
    left:-10000px;
    top:-10000px;
}
</style>
</head>

<body>

<h2>PS5 13.60 — V16 Same-Document Re-entry</h2>

<button onclick="runV16()">RUN V16</button>
<button onclick="clearCP()">CLEAR CHECKPOINT</button>

<div id="log"></div>
<div id="targets"></div>

<script>
"use strict";

const KEY = "PS5_V16_CP";

const box =
    document.getElementById("log");

const targets =
    document.getElementById("targets");

let seq = 0;
let events = [];

function log(s, cls="") {

    const d =
        document.createElement("div");

    d.textContent = s;
    d.className = cls;

    box.appendChild(d);

    window.scrollTo(
        0,
        document.body.scrollHeight
    );
}

function checkpoint(phase) {

    seq++;

    const record = {
        n: seq,
        phase: phase,
        href: location.href,
        time: performance.now()
    };

    events.push(record);

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify({
                state:"RUNNING",
                last:record,
                events:events.slice(-30)
            })
        );

    } catch(e) {}

    log(
        seq + ": " + phase,
        "info"
    );
}

function finish() {

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify({
                state:"COMPLETE",
                events:events
            })
        );

    } catch(e) {}
}

function clearCP() {

    localStorage.removeItem(KEY);

    log(
        "Checkpoint cleared.",
        "warn"
    );
}

function showPrevious() {

    try {

        const raw =
            localStorage.getItem(KEY);

        if (!raw)
            return;

        const cp =
            JSON.parse(raw);

        if (cp.state !== "RUNNING")
            return;

        log(
            "******************************",
            "bad"
        );

        log(
            "PREVIOUS RUN DID NOT COMPLETE",
            "bad"
        );

        if (cp.last) {

            log(
                "LAST EVENT: " +
                cp.last.n +
                " / " +
                cp.last.phase,
                "bad"
            );

            log(
                "URL: " +
                cp.last.href,
                "bad"
            );
        }

        log(
            "******************************",
            "bad"
        );

    } catch(e) {}
}

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}

function waitForPop(timeout=5000) {

    return new Promise(
        (resolve,reject) => {

            const timer =
                setTimeout(() => {

                    removeEventListener(
                        "popstate",
                        handler
                    );

                    reject(
                        new Error(
                            "popstate timeout"
                        )
                    );

                }, timeout);

            function handler(e) {

                clearTimeout(timer);

                checkpoint(
                    "POPSTATE state=" +
                    String(e.state)
                );

                resolve(e);
            }

            addEventListener(
                "popstate",
                handler,
                {once:true}
            );
        }
    );
}

async function runV16() {

    box.innerHTML = "";

    showPrevious();

    seq = 0;
    events = [];

    log(
        "V16 START",
        "info"
    );

    log(
        navigator.userAgent
    );

    log("");

    try {

        /*
         * Clean baseline URL/state.
         */

        checkpoint(
            "BASELINE"
        );

        history.replaceState(
            {v16:0},
            "",
            location.pathname
        );

        /*
         * Focusable elements give us observable
         * JS callbacks around navigation.
         */

        checkpoint(
            "CREATE_TARGETS"
        );

        targets.innerHTML = "";

        const a =
            document.createElement("input");

        const b =
            document.createElement("input");

        a.id = "v16-a";
        b.id = "v16-b";

        targets.appendChild(a);
        targets.appendChild(b);

        a.addEventListener(
            "focus",
            () => checkpoint("A_FOCUS")
        );

        a.addEventListener(
            "blur",
            () => checkpoint("A_BLUR")
        );

        b.addEventListener(
            "focus",
            () => checkpoint("B_FOCUS")
        );

        b.addEventListener(
            "blur",
            () => checkpoint("B_BLUR")
        );

        /*
         * Observe hashchange separately from
         * popstate.
         */

        function hashHandler() {

            checkpoint(
                "HASHCHANGE"
            );
        }

        addEventListener(
            "hashchange",
            hashHandler
        );

        /*
         * Establish same-document history.
         */

        checkpoint(
            "PUSH_STATE_1"
        );

        history.pushState(
            {v16:1},
            "",
            location.pathname + "#v16-one"
        );

        checkpoint(
            "PUSH_STATE_2"
        );

        history.pushState(
            {v16:2},
            "",
            location.pathname + "#v16-two"
        );

        checkpoint(
            "PUSH_STATE_3"
        );

        history.pushState(
            {v16:3},
            "",
            location.pathname + "#v16-three"
        );

        /*
         * Start with a focused element.
         */

        checkpoint(
            "BEFORE_A_FOCUS"
        );

        a.focus();

        await sleep(0);

        checkpoint(
            "AFTER_A_FOCUS"
        );

        /*
         * FIRST SAME-DOCUMENT NAVIGATION
         */

        const pop1 =
            waitForPop();

        checkpoint(
            "BEFORE_BACK_1"
        );

        history.back();

        checkpoint(
            "AFTER_BACK_1_RETURN"
        );

        await pop1;

        checkpoint(
            "AFTER_POP_1"
        );

        /*
         * Force another observable focus
         * transition between navigations.
         */

        checkpoint(
            "BEFORE_B_FOCUS"
        );

        b.focus();

        checkpoint(
            "AFTER_B_FOCUS"
        );

        await sleep(0);

        /*
         * SECOND SAME-DOCUMENT NAVIGATION
         */

        const pop2 =
            waitForPop();

        checkpoint(
            "BEFORE_BACK_2"
        );

        history.back();

        checkpoint(
            "AFTER_BACK_2_RETURN"
        );

        await pop2;

        checkpoint(
            "AFTER_POP_2"
        );

        await sleep(50);

        checkpoint(
            "FINAL_STATE_CHECK"
        );

        const finalState =
            history.state;

        log("");
        log(
            "FINAL history.state = " +
            JSON.stringify(finalState)
        );

        log(
            "FINAL hash = " +
            location.hash
        );

        removeEventListener(
            "hashchange",
            hashHandler
        );

        targets.innerHTML = "";

        history.replaceState(
            null,
            "",
            location.pathname
        );

        checkpoint(
            "CLEANUP_COMPLETE"
        );

        finish();

        log("");
        log(
            "======= V16 RESULT =======",
            "info"
        );

        log(
            "STATUS: NORMAL",
            "ok"
        );

        log(
            "EVENTS: " +
            events.length
        );

        log(
            "==========================",
            "info"
        );

    } catch(e) {

        checkpoint(
            "JS_EXCEPTION " +
            String(e)
        );

        log("");
        log(
            "V16 EXCEPTION",
            "bad"
        );

        log(
            String(e),
            "bad"
        );
    }
}

showPrevious();

</script>
</body>
</html>
