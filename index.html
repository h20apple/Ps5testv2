<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V27 SVG Animation Reparent Diagnostic</title>

<style>
body {
    background:#111;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:16px 0;
    padding:12px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
svg {
    position:absolute;
    left:-10000px;
    top:-10000px;
}
</style>

<h2>PS5 13.60 — V27</h2>
<div>SVG/SMIL animation reparent diagnostic</div>

<p><button id="run">RUN V27</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";

const logBox = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const runButton = document.querySelector("#run");

let beginCount = 0;
let endCount = 0;
let repeatBegin = 0;
let exceptions = 0;
let anomalies = 0;

function log(text) {
    logBox.textContent += text + "\n";
    console.log(text);
}

function cp(stage) {
    try {
        localStorage.setItem("PS5_V27_CHECKPOINT", stage);
    } catch (_) {}

    log("[CP] " + stage);
}

function svg(name) {
    return document.createElementNS(NS, name);
}

function describe(node) {
    if (!node)
        return "null";

    return (
        node.nodeName +
        " connected=" + node.isConnected +
        " parent=" +
        (node.parentNode ? node.parentNode.nodeName : "null")
    );
}

function layout(node) {
    try {
        const r = node.getBoundingClientRect();

        log(
            "[LAYOUT] x=" + r.x +
            " y=" + r.y +
            " w=" + r.width +
            " h=" + r.height
        );

        void document.body.offsetHeight;

    } catch (e) {
        log("[LAYOUT_EXCEPTION] " + e);
    }
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function run() {

    runButton.disabled = true;
    logBox.textContent = "";

    beginCount = 0;
    endCount = 0;
    repeatBegin = 0;
    exceptions = 0;
    anomalies = 0;

    statusBox.textContent = "RUNNING";

    const previous =
        localStorage.getItem("PS5_V27_CHECKPOINT");

    if (previous)
        log("Previous checkpoint: " + previous);

    log("UA:");
    log(navigator.userAgent);
    log("");

    let root = null;

    try {

        cp("CREATE");

        root = svg("svg");
        root.setAttribute("width", "200");
        root.setAttribute("height", "100");

        const left = svg("rect");
        const right = svg("rect");

        left.id = "left";
        right.id = "right";

        left.setAttribute("x", "0");
        left.setAttribute("y", "0");
        left.setAttribute("width", "20");
        left.setAttribute("height", "20");

        right.setAttribute("x", "50");
        right.setAttribute("y", "0");
        right.setAttribute("width", "30");
        right.setAttribute("height", "20");

        const anim = svg("animate");

        anim.id = "animation";

        anim.setAttribute("attributeName", "width");
        anim.setAttribute("from", "20");
        anim.setAttribute("to", "80");
        anim.setAttribute("dur", "0.10s");
        anim.setAttribute("begin", "indefinite");
        anim.setAttribute("fill", "freeze");

        left.appendChild(anim);

        root.appendChild(left);
        root.appendChild(right);

        document.body.appendChild(root);

        log("[INITIAL]");
        log("left:  " + describe(left));
        log("right: " + describe(right));
        log("anim:  " + describe(anim));
        log("");

        /*
         * Important:
         * V26 appeared to deliver beginEvent more than once after
         * reparenting. V27 records that behaviour instead of assuming
         * that a second event is an error.
         */

        anim.addEventListener("beginEvent", function () {

            beginCount++;

            cp("BEGIN_" + beginCount + "_ENTER");

            log(
                "[BEGIN #" + beginCount + "] " +
                describe(anim)
            );

            /*
             * Only perform the reparent on the first callback.
             * Subsequent callbacks are observation-only.
             */

            if (beginCount === 1) {

                cp("BEFORE_REPARENT");

                log(
                    "[BEFORE REPARENT] " +
                    describe(anim)
                );

                right.appendChild(anim);

                cp("AFTER_REPARENT");

                log(
                    "[AFTER REPARENT] " +
                    describe(anim)
                );

                log(
                    "[OLD TARGET] " +
                    describe(left)
                );

                log(
                    "[NEW TARGET] " +
                    describe(right)
                );

                layout(root);

            } else {

                repeatBegin++;

                cp(
                    "REPEATED_BEGIN_" +
                    beginCount
                );

                log(
                    "[REPEATED BEGIN] count=" +
                    beginCount
                );

                log(
                    "[CURRENT OWNER] " +
                    describe(anim)
                );

                /*
                 * Retained old/new wrappers are intentionally read,
                 * but we don't perform heap reclamation or memory
                 * manipulation.
                 */

                log(
                    "[LEFT RETAINED] " +
                    describe(left)
                );

                log(
                    "[RIGHT RETAINED] " +
                    describe(right)
                );

                layout(root);
            }

            cp(
                "BEGIN_" +
                beginCount +
                "_EXIT"
            );
        });


        anim.addEventListener("endEvent", function () {

            endCount++;

            cp("END_" + endCount + "_ENTER");

            log(
                "[END #" + endCount + "] " +
                describe(anim)
            );

            log(
                "[LEFT] " +
                describe(left)
            );

            log(
                "[RIGHT] " +
                describe(right)
            );

            layout(root);

            cp(
                "END_" +
                endCount +
                "_EXIT"
            );
        });


        cp("BEFORE_BEGIN_ELEMENT");

        log("");
        log("[CALL] anim.beginElement()");

        anim.beginElement();

        cp("AFTER_BEGIN_ELEMENT_RETURN");

        /*
         * Give SMIL enough time to dispatch begin/end events.
         */

        await wait(500);

        cp("FINAL_VERIFY");

        log("");
        log("===== FINAL DOM STATE =====");

        log(
            "animation: " +
            describe(anim)
        );

        log(
            "left:      " +
            describe(left)
        );

        log(
            "right:     " +
            describe(right)
        );

        log("");
        log("===== EVENT COUNTS =====");

        log("beginEvent: " + beginCount);
        log("endEvent: " + endCount);
        log("repeated beginEvent: " + repeatBegin);

        /*
         * These aren't automatically treated as vulnerabilities.
         * We're recording unexpected observable state separately.
         */

        if (!anim.isConnected) {
            anomalies++;
            log(
                "[ANOMALY] animation unexpectedly disconnected"
            );
        }

        if (anim.parentNode !== right) {
            anomalies++;
            log(
                "[ANOMALY] final animation parent is not RIGHT"
            );
        }

        if (beginCount === 0) {
            anomalies++;
            log(
                "[ANOMALY] beginEvent never fired"
            );
        }

        cp("V27_COMPLETE");

    } catch (e) {

        exceptions++;

        cp("TOP_LEVEL_EXCEPTION");

        log("");
        log("[EXCEPTION] " + e);

        try {
            log(e.stack || "");
        } catch (_) {}

    }

    log("");
    log("==============================");
    log("V27 RESULT");
    log("==============================");

    log("BEGIN EVENTS: " + beginCount);
    log("END EVENTS: " + endCount);
    log("REPEATED BEGIN EVENTS: " + repeatBegin);
    log("EXCEPTIONS: " + exceptions);
    log("ANOMALIES: " + anomalies);

    if (!exceptions && !anomalies) {
        statusBox.textContent = "STATUS: NORMAL";
    } else {
        statusBox.textContent = "STATUS: CHECK RESULT";
    }

    log("==============================");

    /*
     * Don't automatically rerun this test.
     */
    runButton.disabled = false;
}

runButton.onclick = run;
</script>
