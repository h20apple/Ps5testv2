<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 — V19 SSV Crash/Repro Probe</title>
<style>
body{
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button,input{
    font:16px monospace;
    padding:9px;
    margin:4px;
}
#log{
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok{color:#59ff7a}
.bad{color:#ff6868}
.warn{color:#ffd166}
.info{color:#63caff}
#targetSpace{height:1400px}
</style>
</head>

<body>

<h2>PS5 13.60 — V19 SSV Crash/Repro Probe</h2>

Runs:
<input id="runs" type="number" value="25" min="1" max="100">

<button onclick="startV19()">RUN V19</button>
<button onclick="clearCheckpoint()">CLEAR CHECKPOINT</button>

<div id="log"></div>

<div id="targetSpace"></div>
<a id="v19target">V19 fragment target</a>

<script>
"use strict";

const KEY = "PS5_V19_CHECKPOINT";

const logBox =
    document.getElementById("log");

let totalBlur = 0;
let totalReplace = 0;
let anomalies = 0;

function log(s, cls="") {
    const d = document.createElement("div");
    d.textContent = s;
    d.className = cls;
    logBox.appendChild(d);
}

function saveCP(run, phase) {
    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"RUNNING",
                run:run,
                phase:phase,
                time:Date.now(),
                href:location.href
            })
        );
    } catch(e) {}
}

function markComplete(runs) {
    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"COMPLETE",
                runs:runs,
                blur:totalBlur,
                replace:totalReplace,
                anomalies:anomalies
            })
        );
    } catch(e) {}
}

function showPrevious() {
    try {
        const raw =
            localStorage.getItem(KEY);

        if (!raw)
            return;

        const cp =
            JSON.parse(raw);

        if (cp.status === "RUNNING") {
            log(
                "********************************",
                "bad"
            );
            log(
                "PREVIOUS V19 RUN DID NOT COMPLETE",
                "bad"
            );
            log(
                "LAST RUN: " + cp.run,
                "bad"
            );
            log(
                "LAST PHASE: " + cp.phase,
                "bad"
            );
            log(
                "********************************",
                "bad"
            );
        }
    } catch(e) {}
}

function clearCheckpoint() {
    localStorage.removeItem(KEY);
    log("Checkpoint cleared.", "warn");
}

function delay(ms) {
    return new Promise(
        r => setTimeout(r,ms)
    );
}

function waitForPop(timeout=3000) {
    return new Promise(
        (resolve,reject) => {

            let done = false;

            const timer =
                setTimeout(() => {
                    if (done)
                        return;

                    done = true;

                    removeEventListener(
                        "popstate",
                        handler
                    );

                    reject(
                        new Error(
                            "popstate timeout"
                        )
                    );
                },timeout);

            function handler(e) {
                if (done)
                    return;

                done = true;
                clearTimeout(timer);

                resolve(e);
            }

            addEventListener(
                "popstate",
                handler
            );
        }
    );
}

async function oneRun(n) {

    saveCP(n,"START");

    /*
     * Return to a known URL/state.
     */

    history.replaceState(
        "v19-base-" + n,
        "",
        location.pathname
    );

    saveCP(n,"CREATE_INPUT");

    const input =
        document.createElement("input");

    input.value =
        "V19 run " + n;

    document.body.insertBefore(
        input,
        document.body.firstChild
    );

    /*
     * Historical same-document arrangement.
     */

    saveCP(n,"PUSH_TARGET");

    history.pushState(
        "v19-state1-" + n,
        "",
        location.pathname + "#v19target"
    );

    saveCP(n,"PUSH_CURRENT");

    history.pushState(
        "v19-state2-" + n,
        "",
        location.pathname
    );

    let blurSeen = false;
    let replaceSeen = false;

    input.onblur = function() {

        blurSeen = true;
        totalBlur++;

        saveCP(
            n,
            "BLUR_ENTER"
        );

        /*
         * This is the documented lifetime
         * transition we're reproducing.
         */

        saveCP(
            n,
            "BEFORE_REPLACE"
        );

        history.replaceState(
            "v19-replacement-" + n,
            "",
            location.href
        );

        replaceSeen = true;
        totalReplace++;

        saveCP(
            n,
            "AFTER_REPLACE"
        );
    };

    saveCP(
        n,
        "BEFORE_FOCUS"
    );

    input.focus();

    await delay(20);

    const pop =
        waitForPop();

    saveCP(
        n,
        "BEFORE_BACK"
    );

    history.back();

    saveCP(
        n,
        "BACK_RETURNED"
    );

    const ev =
        await pop;

    saveCP(
        n,
        "POPSTATE"
    );

    await delay(20);

    /*
     * Browser-visible consistency checks.
     */

    if (!blurSeen) {
        anomalies++;
        log(
            "Run " + n +
            ": blur missing",
            "bad"
        );
    }

    if (!replaceSeen) {
        anomalies++;
        log(
            "Run " + n +
            ": replacement missing",
            "bad"
        );
    }

    const expected =
        "v19-replacement-" + n;

    if (history.state !== expected) {
        anomalies++;

        log(
            "Run " + n +
            ": state mismatch: " +
            String(history.state),
            "bad"
        );
    }

    /*
     * Observe event state as well.
     * Don't manipulate its backing storage.
     */

    if (ev.state == null) {
        anomalies++;

        log(
            "Run " + n +
            ": null popstate state",
            "bad"
        );
    }

    saveCP(
        n,
        "CLEANUP"
    );

    input.onblur = null;
    input.remove();

    history.replaceState(
        null,
        "",
        location.pathname
    );

    saveCP(
        n,
        "COMPLETE"
    );
}

async function startV19() {

    logBox.innerHTML = "";

    showPrevious();

    totalBlur = 0;
    totalReplace = 0;
    anomalies = 0;

    let runs =
        Number(
            document.getElementById("runs").value
        );

    if (!Number.isFinite(runs))
        runs = 25;

    runs =
        Math.max(
            1,
            Math.min(100,runs)
        );

    log("V19 START", "info");
    log(navigator.userAgent);
    log("");
    log("Runs requested: " + runs);
    log("");

    try {

        for (
            let n=1;
            n<=runs;
            n++
        ) {

            log(
                "RUN " +
                n +
                "/" +
                runs
            );

            await oneRun(n);

            /*
             * Give the event loop time to
             * settle between reproductions.
             */

            await delay(50);
        }

        markComplete(runs);

        log("");
        log(
            "======= V19 RESULT =======",
            "info"
        );

        log(
            "STATUS: " +
            (
                anomalies === 0
                ? "NORMAL"
                : "ANOMALY"
            ),
            anomalies === 0
                ? "ok"
                : "bad"
        );

        log(
            "COMPLETED: " + runs
        );

        log(
            "BLUR CALLBACKS: " +
            totalBlur
        );

        log(
            "REPLACE CALLBACKS: " +
            totalReplace
        );

        log(
            "ANOMALIES: " +
            anomalies
        );

        log(
            "==========================",
            "info"
        );

    } catch(e) {

        log("");
        log(
            "V19 STOPPED",
            "bad"
        );

        log(
            String(e),
            "bad"
        );
    }
}

showPrevious();

</script>
</body>
</html>
