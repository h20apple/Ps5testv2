<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V31 Range createContextualFragment Probe</title>

<style>
body {
    background:#111;
    color:#eee;
    font:15px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

<h2>PS5 13.60 — V31</h2>
<div>Range.createContextualFragment lifetime probe</div>

<p><button id="run">RUN V31</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

/*
 * V31
 *
 * Inspired by WebKit bug 312244:
 * "Use-after-free of Node in
 * Range::createContextualFragment"
 *
 * This is a browser-visible diagnostic.
 *
 * It does NOT perform heap reclamation,
 * spraying, address disclosure or memory
 * read/write primitive construction.
 */

const out =
    document.querySelector("#log");

const statusBox =
    document.querySelector("#status");

const button =
    document.querySelector("#run");

let pass = 0;
let exceptions = 0;
let anomalies = 0;

function log(s) {
    out.textContent += s + "\n";
    console.log(s);
}

function cp(s) {
    try {
        localStorage.setItem(
            "PS5_V31_CP",
            s
        );
    } catch (_) {}

    log("[CP] " + s);
}

function good(s) {
    pass++;
    log("[PASS] " + s);
}

function bad(s, reason) {
    anomalies++;
    log(
        "[ANOMALY] " +
        s +
        " :: " +
        reason
    );
}

function caught(s, e) {
    exceptions++;
    log(
        "[EXCEPTION] " +
        s +
        " :: " +
        e
    );
}

function sleep(ms) {
    return new Promise(
        r => setTimeout(r, ms)
    );
}


/* --------------------------------
   A — capability
-------------------------------- */

async function testA() {

    const name =
        "A_CAPABILITY";

    cp(name + ":START");

    try {

        const r =
            document.createRange();

        log(
            "[A] createContextualFragment=" +
            typeof r.createContextualFragment
        );

        log(
            "[A] trustedTypes=" +
            typeof window.trustedTypes
        );

        log(
            "[A] TrustedHTML=" +
            typeof window.TrustedHTML
        );

        if (
            typeof r.createContextualFragment
            !== "function"
        ) {
            bad(
                name,
                "API missing"
            );
            return;
        }

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/* --------------------------------
   B — ordinary contextual fragment
-------------------------------- */

async function testB() {

    const name =
        "B_BASIC_FRAGMENT";

    cp(name + ":CREATE");

    try {

        const host =
            document.createElement("div");

        host.innerHTML =
            "<div id='ctx'>context</div>";

        document.body.appendChild(host);

        const ctx =
            host.firstChild;

        const range =
            document.createRange();

        range.selectNodeContents(ctx);

        cp(name + ":BEFORE_CREATE");

        const fragment =
            range.createContextualFragment(
                "<span id='v31b'>hello</span>"
            );

        cp(name + ":AFTER_CREATE");

        const node =
            fragment.firstChild;

        log(
            "[B] node=" +
            node.nodeName
        );

        log(
            "[B] text=" +
            node.textContent
        );

        ctx.appendChild(fragment);

        log(
            "[B] inserted=" +
            !!document.getElementById(
                "v31b"
            )
        );

        host.remove();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/* --------------------------------
   C — remove context before use
-------------------------------- */

async function testC() {

    const name =
        "C_REMOVE_CONTEXT";

    cp(name + ":CREATE");

    try {

        const host =
            document.createElement("section");

        const context =
            document.createElement("div");

        context.textContent =
            "V31 context";

        host.appendChild(context);

        document.body.appendChild(host);

        const range =
            document.createRange();

        range.selectNodeContents(context);

        cp(name + ":REMOVE_CONTEXT");

        host.remove();

        log(
            "[C] context connected=" +
            context.isConnected
        );

        cp(name + ":CREATE_FRAGMENT");

        const fragment =
            range.createContextualFragment(
                "<b>detached-context</b>"
            );

        cp(name + ":CREATED");

        log(
            "[C] children=" +
            fragment.childNodes.length
        );

        log(
            "[C] text=" +
            fragment.textContent
        );

        log(
            "[C] range collapsed=" +
            range.collapsed
        );

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/* --------------------------------
   D — mutation immediately before call
-------------------------------- */

async function testD() {

    const name =
        "D_CONTEXT_MUTATION";

    cp(name + ":CREATE");

    try {

        const outer =
            document.createElement("div");

        outer.innerHTML =
            "<div><span>AAAA</span></div>";

        document.body.appendChild(outer);

        const context =
            outer.firstChild;

        const retained =
            context.firstChild;

        const range =
            document.createRange();

        range.selectNodeContents(context);

        cp(name + ":MUTATE");

        context.innerHTML =
            "<em>BBBB</em>";

        log(
            "[D] retained connected=" +
            retained.isConnected
        );

        cp(name + ":CREATE_FRAGMENT");

        const fragment =
            range.createContextualFragment(
                "<strong>CCCC</strong>"
            );

        cp(name + ":AFTER_CREATE");

        log(
            "[D] fragment=" +
            fragment.textContent
        );

        log(
            "[D] context=" +
            context.textContent
        );

        log(
            "[D] retained=" +
            retained.textContent
        );

        outer.remove();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/* --------------------------------
   E — custom element parser callback
-------------------------------- */

async function testE() {

    const name =
        "E_CUSTOM_ELEMENT_CALLBACK";

    cp(name + ":CREATE");

    try {

        if (
            !window.customElements
        ) {
            log(
                "[E] customElements unavailable"
            );

            good(name);
            return;
        }

        if (
            !customElements.get(
                "v31-callback"
            )
        ) {

            class V31Callback
                extends HTMLElement {

                constructor() {
                    super();

                    window.__v31ConstructorCount =
                        (
                            window.__v31ConstructorCount
                            || 0
                        ) + 1;

                    cp(
                        name +
                        ":CONSTRUCTOR"
                    );
                }

                connectedCallback() {

                    window.__v31ConnectedCount =
                        (
                            window.__v31ConnectedCount
                            || 0
                        ) + 1;

                    cp(
                        name +
                        ":CONNECTED"
                    );
                }
            }

            customElements.define(
                "v31-callback",
                V31Callback
            );
        }

        window.__v31ConstructorCount = 0;
        window.__v31ConnectedCount = 0;

        const host =
            document.createElement("div");

        document.body.appendChild(host);

        const range =
            document.createRange();

        range.selectNodeContents(host);

        cp(name + ":BEFORE_CREATE");

        const fragment =
            range.createContextualFragment(
                "<v31-callback>" +
                "callback" +
                "</v31-callback>"
            );

        cp(name + ":AFTER_CREATE");

        log(
            "[E] constructors=" +
            window.__v31ConstructorCount
        );

        host.appendChild(fragment);

        cp(name + ":AFTER_INSERT");

        log(
            "[E] connected callbacks=" +
            window.__v31ConnectedCount
        );

        host.remove();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


/* --------------------------------
   F — Trusted Types prerequisite
-------------------------------- */

async function testF() {

    const name =
        "F_TRUSTED_TYPES";

    cp(name + ":START");

    try {

        if (
            typeof window.trustedTypes
            === "undefined"
        ) {

            log(
                "[F] Trusted Types unavailable"
            );

            log(
                "[F] upstream 312244 path " +
                "cannot be assumed reachable"
            );

            cp(
                name +
                ":UNAVAILABLE"
            );

            good(name);
            return;
        }

        log(
            "[F] Trusted Types PRESENT"
        );

        log(
            "[F] createPolicy=" +
            typeof trustedTypes.createPolicy
        );

        if (
            typeof trustedTypes.createPolicy
            === "function"
        ) {

            const policy =
                trustedTypes.createPolicy(
                    "v31-" + Date.now(),
                    {
                        createHTML(input) {
                            cp(
                                name +
                                ":CREATE_HTML_CALLBACK"
                            );

                            return input;
                        }
                    }
                );

            const trusted =
                policy.createHTML(
                    "<i>trusted-v31</i>"
                );

            log(
                "[F] trusted object=" +
                String(trusted)
            );

            const host =
                document.createElement("div");

            document.body.appendChild(host);

            const range =
                document.createRange();

            range.selectNodeContents(host);

            cp(
                name +
                ":BEFORE_CONTEXTUAL_FRAGMENT"
            );

            const fragment =
                range.createContextualFragment(
                    trusted
                );

            cp(
                name +
                ":AFTER_CONTEXTUAL_FRAGMENT"
            );

            log(
                "[F] fragment text=" +
                fragment.textContent
            );

            host.remove();
        }

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {
        caught(name, e);
    }
}


async function run() {

    button.disabled = true;

    out.textContent = "";

    pass = 0;
    exceptions = 0;
    anomalies = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    const old =
        localStorage.getItem(
            "PS5_V31_CP"
        );

    if (old) {
        log(
            "Previous checkpoint: " +
            old
        );
    }

    log("PS5 13.60 — V31");
    log(
        "Range.createContextualFragment probe"
    );
    log("");

    log(navigator.userAgent);
    log("");

    await testA();
    await testB();
    await testC();
    await testD();
    await testE();
    await testF();

    cp("V31:COMPLETE");

    log("");
    log("============================");
    log("V31 RESULT");
    log("============================");
    log("TESTS: 6");
    log("PASS: " + pass);
    log(
        "EXCEPTIONS: " +
        exceptions
    );
    log(
        "ANOMALIES: " +
        anomalies
    );
    log("============================");

    if (
        exceptions === 0 &&
        anomalies === 0
    ) {
        statusBox.textContent =
            "STATUS: NORMAL";
    } else {
        statusBox.textContent =
            "STATUS: CHECK RESULT";
    }

    button.disabled = false;
}

button.onclick = run;
</script>
