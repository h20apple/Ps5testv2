<!doctype html>
<meta charset="utf-8">
<title>PS5 TransformStream Check</title>

<style>
body {
    background:#111;
    color:#eee;
    font:18px monospace;
    padding:20px;
}
</style>

<h2>TransformStream capability</h2>
<pre id="out"></pre>

<script>
const out = document.querySelector("#out");

function log(x) {
    out.textContent += x + "\n";
}

log(navigator.userAgent);
log("");

log("TransformStream: " + typeof TransformStream);
log("ReadableStream: " + typeof ReadableStream);
log("WritableStream: " + typeof WritableStream);

if (typeof TransformStream === "function") {
    try {
        const ts = new TransformStream();

        log("");
        log("new TransformStream(): SUCCESS");
        log("readable: " + typeof ts.readable);
        log("writable: " + typeof ts.writable);
        log(
            "readable instanceof ReadableStream: " +
            (
                typeof ReadableStream === "function" &&
                ts.readable instanceof ReadableStream
            )
        );
        log(
            "writable instanceof WritableStream: " +
            (
                typeof WritableStream === "function" &&
                ts.writable instanceof WritableStream
            )
        );
    } catch (e) {
        log("");
        log(
            "constructor exception: " +
            e.name + ": " + e.message
        );
    }
}
</script>
