<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 WebKit 13.60 PoC V3</title>

<style>
body {
  background:#101827;
  color:#eee;
  font:17px monospace;
  padding:20px;
}
button, select {
  font:17px monospace;
  padding:10px 15px;
  margin:4px;
}
#log {
  background:#17233a;
  padding:16px;
  margin-top:15px;
  white-space:pre-wrap;
}
.ok {color:#59ff7a}
.bad {color:#ff6868}
.info {color:#63caff}
.warn {color:#ffd166}
</style>
</head>

<body>

<h2>PS5 WebKit 13.60 — Reproducer V3</h2>

<select id="case">
  <option value="all">All diagnostic cases</option>
  <option value="typed">TypedArray integrity</option>
  <option value="view">DataView bounds</option>
  <option value="objects">Object churn</option>
  <option value="dom">DOM churn</option>
</select>

<select id="runs">
  <option value="100">100 runs</option>
  <option value="500" selected>500 runs</option>
  <option value="2000">2000 runs</option>
</select>

<button onclick="start()">Run V3</button>
<button onclick="stop()">Stop</button>
<button onclick="clearLog()">Clear</button>

<div id="log"></div>

<script>
"use strict";

const logbox = document.getElementById("log");

let abort = false;

let result = {
  tests:0,
  passed:0,
  failed:0,
  anomalies:0,
  last:0,
  start:0
};

function log(s,c="") {
  const d=document.createElement("div");
  d.textContent=s;
  d.className=c;
  logbox.appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);
}

function clearLog() {
  logbox.innerHTML="";
}

function stop() {
  abort=true;
  log("STOP requested","warn");
}

function reset() {
  abort=false;

  result={
    tests:0,
    passed:0,
    failed:0,
    anomalies:0,
    last:0,
    start:performance.now()
  };
}

/*
 Store progress in sessionStorage.

 If WebKit reloads, this gives us the last
 iteration that completed.
*/

function checkpoint(name,i) {

  try {

    sessionStorage.setItem(
      "v3_checkpoint",
      JSON.stringify({
        case:name,
        iteration:i,
        time:Date.now()
      })
    );

  } catch(e) {}
}

function previousCheckpoint() {

  try {

    const x=
      sessionStorage.getItem(
        "v3_checkpoint"
      );

    if(x) {

      const p=JSON.parse(x);

      log(
        "Previous checkpoint: "+
        p.case+
        " iteration "+
        p.iteration,
        "info"
      );
    }

  } catch(e) {}
}

function runTest(name,fn) {

  result.tests++;

  try {

    if(fn() !== true)
      throw new Error(
        "unexpected result"
      );

    result.passed++;
    return true;

  } catch(e) {

    result.failed++;

    log(
      "[FAIL] "+name+
      " :: "+e,
      "bad"
    );

    return false;
  }
}

/* -------------------------
   TypedArray integrity
-------------------------- */

function typedCase(iter) {

  const size=0x8000;

  const b=
    new ArrayBuffer(size);

  const a=
    new Uint32Array(b);

  for(let i=0;i<a.length;i++) {

    a[i]=(
      0x13572468 ^
      i ^
      iter
    )>>>0;
  }

  for(let i=0;i<a.length;i++) {

    const expected=(
      0x13572468 ^
      i ^
      iter
    )>>>0;

    if(a[i]!==expected) {

      result.anomalies++;

      log(
        "[ANOMALY] TypedArray "+
        "iteration="+iter+
        " index="+i,
        "bad"
      );

      return false;
    }
  }

  return true;
}

/* -------------------------
   DataView enforcement
-------------------------- */

function viewCase() {

  const b=
    new ArrayBuffer(128);

  const d=
    new DataView(b);

  d.setUint32(
    8,
    0x11223344
  );

  if(
    d.getUint32(8) !==
    0x11223344
  )
    return false;

  let caught=false;

  try {

    d.getUint32(130);

  } catch(e) {

    caught=true;
  }

  return caught;
}

/* -------------------------
   Object/GC pressure
-------------------------- */

function objectCase(iter) {

  let objects=[];

  for(let i=0;i<2000;i++) {

    objects.push({
      a:i,
      b:iter,
      c:"webkit-"+i,
      d:[i,i+1,i+2]
    });
  }

  for(let i=0;i<objects.length;i+=127) {

    if(
      objects[i].a !== i ||
      objects[i].b !== iter
    ) {

      result.anomalies++;
      return false;
    }
  }

  objects=null;

  return true;
}

/* -------------------------
   DOM lifecycle pressure
-------------------------- */

function domCase(iter) {

  const root=
    document.createElement("div");

  for(let i=0;i<250;i++) {

    const e=
      document.createElement("span");

    e.textContent=
      iter+":"+i;

    e.setAttribute(
      "data-test",
      String(i)
    );

    root.appendChild(e);
  }

  document.body.appendChild(root);

  const count=
    root.childNodes.length;

  root.remove();

  return count===250;
}

/* -------------------------
   Dispatcher
-------------------------- */

function execute(which,i) {

  if(which==="typed")
    return runTest(
      "TypedArray",
      ()=>typedCase(i)
    );

  if(which==="view")
    return runTest(
      "DataView",
      viewCase
    );

  if(which==="objects")
    return runTest(
      "Object churn",
      ()=>objectCase(i)
    );

  if(which==="dom")
    return runTest(
      "DOM churn",
      ()=>domCase(i)
    );

  return true;
}

/* -------------------------
   Main runner
-------------------------- */

async function start() {

  clearLog();
  reset();

  previousCheckpoint();

  const selected=
    document.getElementById(
      "case"
    ).value;

  const runs=
    Number(
      document.getElementById(
        "runs"
      ).value
    );

  log(
    "PS5 WebKit V3 starting...",
    "info"
  );

  log(
    "UA: "+
    navigator.userAgent
  );

  log(
    "Selected: "+
    selected
  );

  log(
    "Iterations: "+
    runs
  );

  log("");

  const cases=
    selected==="all"
    ?
    [
      "typed",
      "view",
      "objects",
      "dom"
    ]
    :
    [selected];

  for(let i=0;i<runs;i++) {

    if(abort)
      break;

    result.last=i;

    for(
      let n=0;
      n<cases.length;
      n++
    ) {

      const name=cases[n];

      checkpoint(
        name,
        i
      );

      execute(
        name,
        i
      );

      if(abort)
        break;
    }

    /*
      Let WebKit process pending UI,
      GC and event-loop activity.
    */

    if((i%25)===0) {

      log(
        "Iteration "+
        i+
        " / "+
        runs,
        "info"
      );

      await new Promise(
        resolve=>
          setTimeout(resolve,0)
      );
    }
  }

  const elapsed=
    performance.now()-
    result.start;

  log("");
  log(
    "========== V3 RESULT ==========",
    "info"
  );

  log(
    "Tests:      "+
    result.tests
  );

  log(
    "Passed:     "+
    result.passed,
    "ok"
  );

  log(
    "Failed:     "+
    result.failed,
    result.failed ?
      "bad":"ok"
  );

  log(
    "Anomalies:  "+
    result.anomalies,
    result.anomalies ?
      "bad":"ok"
  );

  log(
    "Last run:   "+
    result.last
  );

  log(
    "Runtime:    "+
    elapsed.toFixed(2)+
    " ms"
  );

  if(
    !abort &&
    result.failed===0 &&
    result.anomalies===0
  ) {

    log(
      "[PASS] Stable run",
      "ok"
    );
  }

  log(
    "===============================",
    "info"
  );
}

</script>
</body>
</html>
