<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V35.1 Minimal TransformStream Test</title>

<style>
body {
    background:#111;
    color:#eee;
    font:16px monospace;
    padding:20px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

<h2>PS5 13.60 — V35.1</h2>
<p>Minimal TransformStream iterator control</p>

<button id="run">RUN V35.1</button>
<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const out = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const button = document.querySelector("#run");

const originalIterator =
    Array.prototype[Symbol.iterator];

let iteratorCalls = 0;
let nextCalls = 0;

function log(x) {
    out.textContent += x + "\n";
    console.log(x);
}

function checkpoint(x) {
    /*
     * Use both localStorage and the URL hash.
     *
     * The hash gives us another browser-visible
     * indication if localStorage doesn't survive.
     */

    try {
        localStorage.setItem(
            "V351_CHECKPOINT",
            x
        );
    } catch(e) {}

    try {
        location.hash =
            encodeURIComponent(x);
    } catch(e) {}

    log("[CP] " + x);
}

function restore() {
    Array.prototype[Symbol.iterator] =
        originalIterator;
}

function previousCheckpoint() {

    let stored = null;

    try {
        stored =
            localStorage.getItem(
                "V351_CHECKPOINT"
            );
    } catch(e) {}

    if (stored) {
        log(
            "PREVIOUS CHECKPOINT: " +
            stored
        );
    }

    if (location.hash) {
        log(
            "URL CHECKPOINT: " +
            decodeURIComponent(
                location.hash.slice(1)
            )
        );
    }
}

async function run() {

    button.disabled = true;

    statusBox.textContent =
        "STATUS: RUNNING";

    log("");
    log("==========================");
    log("V35.1 START");
    log("==========================");

    log(navigator.userAgent);
    log("");

    if (
        typeof TransformStream !==
        "function"
    ) {
        log(
            "TransformStream unavailable"
        );

        statusBox.textContent =
            "UNSUPPORTED";

        button.disabled = false;
        return;
    }

    checkpoint(
        "01_BEFORE_OVERRIDE"
    );

    /*
     * Minimal control override.
     *
     * Every original array value is returned
     * unchanged.
     */

    Array.prototype[Symbol.iterator] =
        function() {

            iteratorCalls++;

            const array = this;
            let index = 0;

            /*
             * Avoid logging from inside here.
             *
             * console/logging code may itself use
             * arrays and would contaminate the test.
             */

            return {
                next() {

                    nextCalls++;

                    if (
                        index >=
                        array.length
                    ) {
                        return {
                            value:undefined,
                            done:true
                        };
                    }

                    return {
                        value:
                            array[index++],
                        done:false
                    };
                }
            };
        };

    checkpoint(
        "02_OVERRIDE_INSTALLED"
    );

    let stream = null;

    try {

        checkpoint(
            "03_BEFORE_TRANSFORMSTREAM"
        );

        stream =
            new TransformStream();

        checkpoint(
            "04_TRANSFORMSTREAM_RETURNED"
        );

    } catch(e) {

        /*
         * Restore before logging the exception.
         */

        restore();

        checkpoint(
            "04_CONSTRUCTOR_EXCEPTION"
        );

        log(
            "Constructor exception:"
        );

        log(
            e.name +
            ": " +
            e.message
        );

        statusBox.textContent =
            "STATUS: EXCEPTION";

        button.disabled = false;

        return;
    }

    /*
     * Restore immediately.
     */

    restore();

    checkpoint(
        "05_ITERATOR_RESTORED"
    );

    log("");
    log(
        "TransformStream constructor: SUCCESS"
    );

    log(
        "iteratorCalls = " +
        iteratorCalls
    );

    log(
        "nextCalls = " +
        nextCalls
    );

    if (stream) {

        log(
            "readable = " +
            typeof stream.readable
        );

        log(
            "writable = " +
            typeof stream.writable
        );
    }

    checkpoint(
        "06_COMPLETE"
    );

    log("");
    log("==========================");
    log("V35.1 RESULT");
    log("==========================");

    if (iteratorCalls === 0) {

        log(
            "Array iterator NOT observed"
        );

    } else {

        log(
            "Array iterator WAS observed"
        );
    }

    log(
        "iteratorCalls: " +
        iteratorCalls
    );

    log(
        "nextCalls: " +
        nextCalls
    );

    log("==========================");

    statusBox.textContent =
        "STATUS: COMPLETE";

    button.disabled = false;
}


/*
 * Show previous state before doing anything.
 */

previousCheckpoint();

button.onclick = run;

window.addEventListener(
    "pagehide",
    restore
);

window.addEventListener(
    "beforeunload",
    restore
);
</script>
