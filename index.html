<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V29 StructuredClone / Transfer Lifetime Probe</title>

<style>
body {
    background:#111;
    color:#eee;
    font:15px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

<h2>PS5 13.60 — V29</h2>
<div>StructuredClone / transferable lifetime probe</div>

<p><button id="run">RUN V29</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const output = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const runButton = document.querySelector("#run");

let pass = 0;
let exceptions = 0;
let anomalies = 0;

function log(s) {
    output.textContent += s + "\n";
    console.log(s);
}

function cp(stage) {
    try {
        localStorage.setItem(
            "PS5_V29_CHECKPOINT",
            stage
        );
    } catch (_) {}

    log("[CP] " + stage);
}

function good(name) {
    pass++;
    log("[PASS] " + name);
}

function bad(name, reason) {
    anomalies++;
    log(
        "[ANOMALY] " +
        name +
        " :: " +
        reason
    );
}

function caught(name, e) {
    exceptions++;
    log(
        "[EXCEPTION] " +
        name +
        " :: " +
        e
    );
}

function sleep(ms) {
    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

function makeBuffer(size) {

    const buffer =
        new ArrayBuffer(size);

    const view =
        new Uint8Array(buffer);

    for (
        let i = 0;
        i < view.length;
        i++
    ) {
        view[i] =
            (i * 17 + 23) & 255;
    }

    return {
        buffer,
        view
    };
}

function checksum(view) {

    let n = 0;

    for (
        let i = 0;
        i < view.length;
        i += 97
    ) {
        n =
            (n + view[i]) >>> 0;
    }

    return n;
}


/*
 * A
 *
 * Basic structuredClone transfer.
 *
 * The original ArrayBuffer should become
 * detached after successful transfer.
 */

async function testA() {

    const name =
        "A_BASIC_TRANSFER";

    cp(name + ":CREATE");

    try {

        const x =
            makeBuffer(65536);

        const expected =
            checksum(x.view);

        cp(name + ":BEFORE_CLONE");

        const clone =
            structuredClone(
                x.buffer,
                {
                    transfer:[
                        x.buffer
                    ]
                }
            );

        cp(name + ":AFTER_CLONE");

        log(
            "[A] original byteLength=" +
            x.buffer.byteLength
        );

        log(
            "[A] clone byteLength=" +
            clone.byteLength
        );

        const cloneView =
            new Uint8Array(clone);

        const actual =
            checksum(cloneView);

        log(
            "[A] expected checksum=" +
            expected
        );

        log(
            "[A] actual checksum=" +
            actual
        );

        if (
            x.buffer.byteLength !== 0
        ) {
            bad(
                name,
                "source buffer not detached"
            );
        }

        if (
            clone.byteLength !== 65536
        ) {
            bad(
                name,
                "unexpected clone size"
            );
        }

        if (
            expected !== actual
        ) {
            bad(
                name,
                "clone data mismatch"
            );
        }

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {

        caught(name, e);
    }
}


/*
 * B
 *
 * Retain a typed-array wrapper while its
 * underlying buffer is transferred.
 */

async function testB() {

    const name =
        "B_RETAINED_VIEW";

    cp(name + ":CREATE");

    try {

        const x =
            makeBuffer(32768);

        const retained =
            x.view;

        cp(name + ":TRANSFER");

        const clone =
            structuredClone(
                x.buffer,
                {
                    transfer:[
                        x.buffer
                    ]
                }
            );

        cp(name + ":READ_RETAINED");

        log(
            "[B] source buffer length=" +
            x.buffer.byteLength
        );

        log(
            "[B] retained view length=" +
            retained.length
        );

        log(
            "[B] retained byteLength=" +
            retained.byteLength
        );

        log(
            "[B] clone length=" +
            clone.byteLength
        );

        /*
         * Reading a detached view must not expose
         * the transferred buffer's old contents.
         */

        let readResult;

        try {
            readResult =
                retained[0];
        } catch(e) {
            readResult =
                "THREW:" + e.name;
        }

        log(
            "[B] retained[0]=" +
            readResult
        );

        if (
            x.buffer.byteLength !== 0
        ) {
            bad(
                name,
                "source buffer still attached"
            );
        }

        if (
            clone.byteLength !== 32768
        ) {
            bad(
                name,
                "clone size mismatch"
            );
        }

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {

        caught(name, e);
    }
}


/*
 * C
 *
 * MessageChannel transfer.
 */

async function testC() {

    const name =
        "C_MESSAGECHANNEL_TRANSFER";

    cp(name + ":CREATE");

    try {

        const channel =
            new MessageChannel();

        const x =
            makeBuffer(49152);

        const expected =
            checksum(x.view);

        const result =
            await new Promise(
                (resolve, reject) => {

                    const timer =
                        setTimeout(
                            () =>
                                reject(
                                    new Error(
                                        "MessageChannel timeout"
                                    )
                                ),
                            2000
                        );

                    channel.port2.onmessage =
                        function(event) {

                            clearTimeout(timer);

                            cp(
                                name +
                                ":MESSAGE_ENTER"
                            );

                            try {

                                const received =
                                    event.data;

                                const view =
                                    new Uint8Array(
                                        received
                                    );

                                const sum =
                                    checksum(view);

                                log(
                                    "[C] received length=" +
                                    received.byteLength
                                );

                                log(
                                    "[C] checksum=" +
                                    sum
                                );

                                cp(
                                    name +
                                    ":MESSAGE_EXIT"
                                );

                                resolve({
                                    length:
                                        received.byteLength,
                                    sum
                                });

                            } catch(e) {

                                reject(e);
                            }
                        };

                    cp(
                        name +
                        ":BEFORE_POST"
                    );

                    channel.port1.postMessage(
                        x.buffer,
                        [x.buffer]
                    );

                    cp(
                        name +
                        ":AFTER_POST"
                    );

                    log(
                        "[C] source after post=" +
                        x.buffer.byteLength
                    );
                }
            );

        if (
            x.buffer.byteLength !== 0
        ) {
            bad(
                name,
                "source not detached"
            );
        }

        if (
            result.length !== 49152
        ) {
            bad(
                name,
                "received size mismatch"
            );
        }

        if (
            result.sum !== expected
        ) {
            bad(
                name,
                "received data mismatch"
            );
        }

        channel.port1.close();
        channel.port2.close();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {

        caught(name, e);
    }
}


/*
 * D
 *
 * Transfer from inside a MessageChannel
 * callback.
 */

async function testD() {

    const name =
        "D_CALLBACK_TRANSFER";

    cp(name + ":CREATE");

    try {

        const channel =
            new MessageChannel();

        const x =
            makeBuffer(16384);

        const retained =
            x.view;

        await new Promise(
            (resolve, reject) => {

                const timer =
                    setTimeout(
                        () =>
                            reject(
                                new Error(
                                    "callback timeout"
                                )
                            ),
                        2000
                    );

                channel.port1.onmessage =
                    function() {

                        cp(
                            name +
                            ":CALLBACK_ENTER"
                        );

                        try {

                            const clone =
                                structuredClone(
                                    x.buffer,
                                    {
                                        transfer:[
                                            x.buffer
                                        ]
                                    }
                                );

                            cp(
                                name +
                                ":TRANSFER_RETURNED"
                            );

                            log(
                                "[D] source=" +
                                x.buffer.byteLength
                            );

                            log(
                                "[D] retained length=" +
                                retained.length
                            );

                            log(
                                "[D] clone=" +
                                clone.byteLength
                            );

                            /*
                             * Force additional ordinary JS work
                             * while the detached wrapper remains
                             * strongly referenced.
                             */

                            const objects = [];

                            for (
                                let i = 0;
                                i < 100;
                                i++
                            ) {
                                objects.push({
                                    i,
                                    text:
                                        "v29-" + i
                                });
                            }

                            log(
                                "[D] ordinary objects=" +
                                objects.length
                            );

                            cp(
                                name +
                                ":CALLBACK_EXIT"
                            );

                            clearTimeout(timer);
                            resolve();

                        } catch(e) {

                            clearTimeout(timer);
                            reject(e);
                        }
                    };

                channel.port2.postMessage(
                    "trigger"
                );
            }
        );

        channel.port1.close();
        channel.port2.close();

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {

        caught(name, e);
    }
}


/*
 * E
 *
 * Nested structuredClone operations.
 */

async function testE() {

    const name =
        "E_NESTED_CLONE";

    cp(name + ":CREATE");

    try {

        const state = {
            name:"v29",
            nested:{
                value:12345
            },
            list:[
                1,2,3,4,5
            ]
        };

        cp(name + ":CLONE_1");

        const a =
            structuredClone(state);

        cp(name + ":CLONE_2");

        const b =
            structuredClone(a);

        cp(name + ":VERIFY");

        if (
            b.name !== "v29" ||
            b.nested.value !== 12345 ||
            b.list.length !== 5
        ) {
            bad(
                name,
                "structured data mismatch"
            );
        }

        good(name);
        cp(name + ":COMPLETE");

    } catch(e) {

        caught(name, e);
    }
}


/*
 * F
 *
 * Worker round-trip transfer.
 */

async function testF() {

    const name =
        "F_WORKER_TRANSFER";

    cp(name + ":CREATE");

    let worker = null;
    let workerURL = null;

    try {

        const source = `
            self.onmessage = function(e) {

                const buffer = e.data;

                const view =
                    new Uint8Array(buffer);

                let sum = 0;

                for (
                    let i = 0;
                    i < view.length;
                    i += 97
                ) {
                    sum =
                        (sum + view[i]) >>> 0;
                }

                self.postMessage(
                    {
                        buffer:buffer,
                        sum:sum
                    },
                    [buffer]
                );
            };
        `;

        const blob =
            new Blob(
                [source],
                {
                    type:
                        "text/javascript"
                }
            );

        workerURL =
            URL.createObjectURL(blob);

        worker =
            new Worker(workerURL);

        const x =
            makeBuffer(65536);

        const expected =
            checksum(x.view);

        const result =
            await new Promise(
                (resolve, reject) => {

                    const timer =
                        setTimeout(
                            () =>
                                reject(
                                    new Error(
                                        "Worker timeout"
                                    )
                                ),
                            3000
                        );

                    worker.onerror =
                        function(e) {

                            clearTimeout(timer);

                            reject(
                                new Error(
                                    "Worker error: " +
                                    e.message
                                )
                            );
                        };

                    worker.onmessage =
                        function(e) {

                            clearTimeout(timer);

                            cp(
                                name +
                                ":WORKER_REPLY"
                            );

                            resolve(e.data);
                        };

                    cp(
                        name +
                        ":BEFORE_POST"
                    );

                    worker.postMessage(
                        x.buffer,
                        [x.buffer]
                    );

                    cp(
                        name +
                        ":AFTER_POST"
                    );

                    log(
                        "[F] source after post=" +
                        x.buffer.byteLength
                    );
                }
            );

        const returned =
            result.buffer;

        log(
            "[F] returned length=" +
            returned.byteLength
        );

        log(
            "[F] worker checksum=" +
            result.sum
        );

        const finalSum =
            checksum(
                new Uint8Array(
                    returned
                )
            );

        log(
            "[F] returned checksum=" +
            finalSum
        );

        if (
            returned.byteLength !== 65536
        ) {
            bad(
                name,
                "returned size mismatch"
            );
        }

        if (
            result.sum !== expected ||
            finalSum !== expected
        ) {
            bad(
                name,
                "worker data mismatch"
            );
        }

        cp(name + ":COMPLETE");
        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        try {
            if (worker)
                worker.terminate();
        } catch (_) {}

        try {
            if (workerURL)
                URL.revokeObjectURL(
                    workerURL
                );
        } catch (_) {}
    }
}


async function run() {

    runButton.disabled = true;

    output.textContent = "";

    pass = 0;
    exceptions = 0;
    anomalies = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    const previous =
        localStorage.getItem(
            "PS5_V29_CHECKPOINT"
        );

    if (previous)
        log(
            "Previous checkpoint: " +
            previous
        );

    log("PS5 13.60 - V29");
    log(navigator.userAgent);
    log("");

    log(
        "structuredClone: " +
        typeof structuredClone
    );

    log(
        "ArrayBuffer: " +
        typeof ArrayBuffer
    );

    log(
        "MessageChannel: " +
        typeof MessageChannel
    );

    log(
        "Worker: " +
        typeof Worker
    );

    log("");

    await testA();
    await testB();
    await testC();
    await testD();
    await testE();
    await testF();

    cp("V29:COMPLETE");

    log("");
    log("==============================");
    log("V29 RESULT");
    log("==============================");
    log("TESTS COMPLETED: 6");
    log("PASS: " + pass);
    log("EXCEPTIONS: " + exceptions);
    log("ANOMALIES: " + anomalies);
    log("==============================");

    statusBox.textContent =
        exceptions || anomalies
        ? "STATUS: CHECK RESULT"
        : "STATUS: NORMAL";

    runButton.disabled = false;
}

runButton.onclick = run;
</script>
