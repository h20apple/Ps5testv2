<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 — V20 SSV Lifetime Matrix</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:16px monospace;
    padding:10px;
    margin:5px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok   { color:#59ff7a; }
.bad  { color:#ff6868; }
.warn { color:#ffd166; }
.info { color:#63caff; }
#space { height:1500px; }
</style>
</head>

<body>

<h2>PS5 13.60 — V20 SSV Lifetime Matrix</h2>

<button onclick="runV20()">RUN V20</button>
<button onclick="clearCP()">CLEAR CHECKPOINT</button>

<div id="log"></div>

<div id="space"></div>

<a id="v20target" tabindex="0">
    V20 fragment target
</a>

<script>
"use strict";

const KEY = "PS5_V20_CP";

const box =
    document.getElementById("log");

let sequence = 0;
let anomalies = 0;
let blurCount = 0;
let replaceCount = 0;

function log(text, cls="") {

    const d =
        document.createElement("div");

    d.textContent = text;
    d.className = cls;

    box.appendChild(d);
}

function delay(ms) {
    return new Promise(
        resolve => setTimeout(resolve,ms)
    );
}

function cp(test, phase, extra="") {

    sequence++;

    const record = {
        status:"RUNNING",
        test:test,
        phase:phase,
        extra:extra,
        sequence:sequence,
        href:location.href,
        time:Date.now()
    };

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify(record)
        );
    } catch(e) {}

    log(
        sequence +
        ": [" +
        test +
        "] " +
        phase +
        (extra ? " — " + extra : ""),
        "info"
    );
}

function clearCP() {

    localStorage.removeItem(KEY);

    log(
        "Checkpoint cleared.",
        "warn"
    );
}

function showPrevious() {

    try {

        const raw =
            localStorage.getItem(KEY);

        if (!raw)
            return;

        const c =
            JSON.parse(raw);

        if (c.status !== "RUNNING")
            return;

        log(
            "********************************",
            "bad"
        );

        log(
            "PREVIOUS V20 DID NOT COMPLETE",
            "bad"
        );

        log(
            "TEST: " + c.test,
            "bad"
        );

        log(
            "LAST PHASE: " + c.phase,
            "bad"
        );

        if (c.extra) {
            log(
                "DETAIL: " + c.extra,
                "bad"
            );
        }

        log(
            "********************************",
            "bad"
        );

    } catch(e) {}
}

function complete() {

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"COMPLETE",
                anomalies:anomalies,
                blur:blurCount,
                replace:replaceCount,
                time:Date.now()
            })
        );

    } catch(e) {}
}

function stateText(x) {

    try {
        return JSON.stringify(x);
    } catch(e) {
        return "[cannot stringify]";
    }
}

function waitPop(timeout=5000) {

    return new Promise(
        (resolve,reject) => {

            let done = false;

            const timer =
                setTimeout(() => {

                    if (done)
                        return;

                    done = true;

                    removeEventListener(
                        "popstate",
                        handler
                    );

                    reject(
                        new Error(
                            "POPSTATE_TIMEOUT"
                        )
                    );

                },timeout);

            function handler(e) {

                if (done)
                    return;

                done = true;

                clearTimeout(timer);

                resolve(e);
            }

            addEventListener(
                "popstate",
                handler
            );
        }
    );
}

/*
 * Different state-object shapes.
 */

function originalState(test) {

    return {
        type:"original",
        test:test,
        marker:0x2020,
        text:"V20_ORIGINAL",
        nested:{
            a:1,
            b:2,
            c:"three"
        },
        array:[
            10,
            20,
            30,
            40
        ]
    };
}

function replacementState(test) {

    return {
        type:"replacement",
        test:test,
        marker:0x20FF,
        text:"V20_REPLACEMENT",
        nested:{
            x:"alpha",
            y:"beta"
        },
        array:[
            "A",
            "B",
            "C"
        ]
    };
}

async function oneTest(name, mode) {

    cp(
        name,
        "TEST_START"
    );

    /*
     * Clean starting entry.
     */

    history.replaceState(
        {
            type:"base",
            test:name
        },
        "",
        location.pathname
    );

    const original =
        originalState(name);

    cp(
        name,
        "PUSH_FRAGMENT",
        stateText(original)
    );

    history.pushState(
        original,
        "",
        location.pathname +
        "#v20target"
    );

    history.pushState(
        {
            type:"current",
            test:name,
            marker:0x2001
        },
        "",
        location.pathname
    );

    cp(
        name,
        "CREATE_FOCUS_ELEMENT"
    );

    const input =
        document.createElement("input");

    input.value =
        "V20 " + name;

    document.body.insertBefore(
        input,
        document.body.firstChild
    );

    let localBlur = 0;
    let localReplace = 0;

    input.onblur = function() {

        localBlur++;
        blurCount++;

        cp(
            name,
            "BLUR_ENTER"
        );

        cp(
            name,
            "STATE_AT_BLUR",
            stateText(history.state)
        );

        /*
         * MODE 1:
         * ordinary V17/V18-style replacement.
         */

        if (mode === 1) {

            cp(
                name,
                "BEFORE_REPLACE"
            );

            history.replaceState(
                replacementState(name),
                "",
                location.href
            );

            localReplace++;
            replaceCount++;

            cp(
                name,
                "AFTER_REPLACE",
                stateText(history.state)
            );
        }

        /*
         * MODE 2:
         * Remove the focused element while
         * its blur handler is executing.
         */

        if (mode === 2) {

            cp(
                name,
                "REMOVE_FOCUSED_ELEMENT"
            );

            input.remove();

            cp(
                name,
                "AFTER_ELEMENT_REMOVE"
            );

            history.replaceState(
                replacementState(name),
                "",
                location.href
            );

            localReplace++;
            replaceCount++;

            cp(
                name,
                "AFTER_REPLACE",
                stateText(history.state)
            );
        }

        /*
         * MODE 3:
         * Two sequential replacements from
         * the same callback.
         */

        if (mode === 3) {

            cp(
                name,
                "REPLACE_ONE"
            );

            history.replaceState(
                {
                    type:"intermediate",
                    test:name,
                    marker:0x2055
                },
                "",
                location.href
            );

            localReplace++;
            replaceCount++;

            cp(
                name,
                "REPLACE_TWO"
            );

            history.replaceState(
                replacementState(name),
                "",
                location.href
            );

            localReplace++;
            replaceCount++;

            cp(
                name,
                "AFTER_SECOND_REPLACE",
                stateText(history.state)
            );
        }

        /*
         * MODE 4:
         * More complicated structured state.
         */

        if (mode === 4) {

            const complex = {
                type:"complex",
                test:name,
                marker:0x20CC,

                strings:[
                    "one",
                    "two",
                    "three"
                ],

                numbers:[
                    1,
                    2,
                    3,
                    4,
                    5
                ],

                nested:{
                    level1:{
                        level2:{
                            value:
                            "V20_COMPLEX"
                        }
                    }
                }
            };

            cp(
                name,
                "COMPLEX_REPLACE",
                stateText(complex)
            );

            history.replaceState(
                complex,
                "",
                location.href
            );

            localReplace++;
            replaceCount++;

            cp(
                name,
                "AFTER_COMPLEX_REPLACE",
                stateText(history.state)
            );
        }

        cp(
            name,
            "BLUR_EXIT"
        );
    };

    cp(
        name,
        "BEFORE_FOCUS"
    );

    input.focus();

    cp(
        name,
        "AFTER_FOCUS"
    );

    await delay(100);

    const pop =
        waitPop();

    cp(
        name,
        "BEFORE_BACK"
    );

    history.back();

    cp(
        name,
        "BACK_RETURNED"
    );

    const event =
        await pop;

    cp(
        name,
        "POPSTATE",
        stateText(event.state)
    );

    cp(
        name,
        "HISTORY_STATE",
        stateText(history.state)
    );

    await delay(200);

    /*
     * Original JS object should remain intact.
     */

    cp(
        name,
        "ORIGINAL_INTEGRITY"
    );

    if (
        original.type !== "original" ||
        original.marker !== 0x2020 ||
        original.text !== "V20_ORIGINAL" ||
        original.nested.a !== 1 ||
        original.array[2] !== 30
    ) {

        anomalies++;

        cp(
            name,
            "ORIGINAL_OBJECT_ANOMALY",
            stateText(original)
        );
    }

    if (localBlur !== 1) {

        anomalies++;

        cp(
            name,
            "BLUR_COUNT_ANOMALY",
            String(localBlur)
        );
    }

    if (localReplace < 1) {

        anomalies++;

        cp(
            name,
            "REPLACE_COUNT_ANOMALY",
            String(localReplace)
        );
    }

    /*
     * Remove it here if mode 2 didn't
     * already remove it.
     */

    input.onblur = null;

    if (input.parentNode)
        input.remove();

    history.replaceState(
        null,
        "",
        location.pathname
    );

    cp(
        name,
        "TEST_COMPLETE"
    );

    /*
     * Keep well clear of the History API
     * rate limit encountered in V19.
     */

    await delay(1000);
}

async function runV20() {

    box.innerHTML = "";

    showPrevious();

    sequence = 0;
    anomalies = 0;
    blurCount = 0;
    replaceCount = 0;

    log(
        "V20 START",
        "info"
    );

    log(
        navigator.userAgent
    );

    log("");

    try {

        await oneTest(
            "A_NORMAL",
            1
        );

        await oneTest(
            "B_REMOVE_DURING_BLUR",
            2
        );

        await oneTest(
            "C_DOUBLE_REPLACE",
            3
        );

        await oneTest(
            "D_COMPLEX_STATE",
            4
        );

        complete();

        log("");
        log(
            "======= V20 RESULT =======",
            "info"
        );

        log(
            "STATUS: " +
            (
                anomalies === 0
                    ? "NORMAL"
                    : "ANOMALY"
            ),
            anomalies === 0
                ? "ok"
                : "bad"
        );

        log(
            "TESTS COMPLETED: 4"
        );

        log(
            "BLUR CALLBACKS: " +
            blurCount
        );

        log(
            "REPLACE CALLS: " +
            replaceCount
        );

        log(
            "ANOMALIES: " +
            anomalies
        );

        log(
            "==========================",
            "info"
        );

    } catch(e) {

        cp(
            "HARNESS",
            "JS_EXCEPTION",
            String(e)
        );

        log("");
        log(
            "V20 STOPPED",
            "bad"
        );

        log(
            String(e),
            "bad"
        );
    }
}

showPrevious();

</script>
</body>
</html>
