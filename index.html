<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V28 SMIL Reparent Comparison</title>

<style>
body {
    background:#111;
    color:#eee;
    font:15px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    border:1px solid #555;
    padding:10px;
    margin:15px 0;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
svg {
    position:absolute;
    left:-10000px;
    top:-10000px;
}
</style>

<h2>PS5 13.60 — V28</h2>
<div>SVG/SMIL synchronous reparent comparison</div>

<p><button id="run">RUN V28</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const NS = "http://www.w3.org/2000/svg";

const out = document.querySelector("#log");
const status = document.querySelector("#status");
const button = document.querySelector("#run");

let exceptions = 0;
let anomalies = 0;

function log(s) {
    out.textContent += s + "\n";
    console.log(s);
}

function cp(s) {
    try {
        localStorage.setItem("PS5_V28_CHECKPOINT", s);
    } catch (_) {}

    log("[CP] " + s);
}

function make(name) {
    return document.createElementNS(NS, name);
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function safe(fn) {
    try {
        return fn();
    } catch (e) {
        return "EXCEPTION:" + e.name;
    }
}

function info(root, anim, left, right) {

    const parent =
        anim.parentNode === left ? "LEFT" :
        anim.parentNode === right ? "RIGHT" :
        anim.parentNode ?
            anim.parentNode.nodeName :
            "null";

    return {
        parent: parent,

        connected: anim.isConnected,

        svgTime: safe(() =>
            root.getCurrentTime().toFixed(4)
        ),

        startTime: safe(() =>
            anim.getStartTime().toFixed(4)
        ),

        leftWidth: safe(() =>
            left.getAttribute("width")
        ),

        rightWidth: safe(() =>
            right.getAttribute("width")
        )
    };
}

function dump(label, data) {

    log(
        label +
        " parent=" + data.parent +
        " connected=" + data.connected +
        " svgTime=" + data.svgTime +
        " startTime=" + data.startTime +
        " leftWidth=" + data.leftWidth +
        " rightWidth=" + data.rightWidth
    );
}

function buildTree() {

    const root = make("svg");

    root.setAttribute("width", "200");
    root.setAttribute("height", "100");

    const left = make("rect");

    left.setAttribute("x", "0");
    left.setAttribute("y", "0");
    left.setAttribute("width", "20");
    left.setAttribute("height", "20");

    const right = make("rect");

    right.setAttribute("x", "50");
    right.setAttribute("y", "0");
    right.setAttribute("width", "30");
    right.setAttribute("height", "20");

    const anim = make("animate");

    anim.setAttribute("attributeName", "width");
    anim.setAttribute("from", "20");
    anim.setAttribute("to", "80");
    anim.setAttribute("dur", "0.10s");
    anim.setAttribute("begin", "indefinite");
    anim.setAttribute("fill", "freeze");

    left.appendChild(anim);

    root.appendChild(left);
    root.appendChild(right);

    document.body.appendChild(root);

    return {
        root,
        left,
        right,
        anim
    };
}


/*
 * CASE A
 *
 * Control:
 * beginElement() with no reparent.
 */

async function caseA() {

    const name = "A_CONTROL";

    cp(name + ":CREATE");

    const {
        root,
        left,
        right,
        anim
    } = buildTree();

    let begins = 0;
    let ends = 0;

    try {

        anim.addEventListener(
            "beginEvent",
            function(e) {

                begins++;

                cp(
                    name +
                    ":BEGIN_" +
                    begins
                );

                log(
                    "[A BEGIN #" +
                    begins +
                    "] eventTime=" +
                    e.timeStamp
                );

                dump(
                    "[A STATE]",
                    info(
                        root,
                        anim,
                        left,
                        right
                    )
                );
            }
        );

        anim.addEventListener(
            "endEvent",
            function(e) {

                ends++;

                cp(
                    name +
                    ":END_" +
                    ends
                );

                log(
                    "[A END #" +
                    ends +
                    "] eventTime=" +
                    e.timeStamp
                );

                dump(
                    "[A END STATE]",
                    info(
                        root,
                        anim,
                        left,
                        right
                    )
                );
            }
        );

        cp(name + ":BEFORE_BEGIN");

        anim.beginElement();

        cp(name + ":AFTER_BEGIN_RETURN");

        await sleep(400);

        dump(
            "[A FINAL]",
            info(
                root,
                anim,
                left,
                right
            )
        );

        log(
            "[A RESULT] begins=" +
            begins +
            " ends=" +
            ends
        );

        return {
            begins,
            ends
        };

    } finally {

        root.remove();

        cp(name + ":COMPLETE");
    }
}


/*
 * CASE B
 *
 * Reparent synchronously while WebKit
 * is delivering beginEvent.
 */

async function caseB() {

    const name = "B_SYNC_REPARENT";

    cp(name + ":CREATE");

    const {
        root,
        left,
        right,
        anim
    } = buildTree();

    let begins = 0;
    let ends = 0;
    let moved = false;

    try {

        anim.addEventListener(
            "beginEvent",
            function(e) {

                begins++;

                cp(
                    name +
                    ":BEGIN_" +
                    begins +
                    "_ENTER"
                );

                log(
                    "[B BEGIN #" +
                    begins +
                    "] eventTime=" +
                    e.timeStamp
                );

                dump(
                    "[B BEFORE]",
                    info(
                        root,
                        anim,
                        left,
                        right
                    )
                );

                if (!moved) {

                    moved = true;

                    cp(
                        name +
                        ":BEFORE_SYNC_MOVE"
                    );

                    right.appendChild(anim);

                    cp(
                        name +
                        ":AFTER_SYNC_MOVE"
                    );

                    dump(
                        "[B AFTER MOVE]",
                        info(
                            root,
                            anim,
                            left,
                            right
                        )
                    );

                    /*
                     * Force observable style/layout work
                     * while retained DOM wrappers remain
                     * available.
                     */

                    safe(() =>
                        root.getBoundingClientRect()
                    );

                    safe(() =>
                        left.getBoundingClientRect()
                    );

                    safe(() =>
                        right.getBoundingClientRect()
                    );

                    void document.body.offsetHeight;
                }

                cp(
                    name +
                    ":BEGIN_" +
                    begins +
                    "_EXIT"
                );
            }
        );

        anim.addEventListener(
            "endEvent",
            function(e) {

                ends++;

                cp(
                    name +
                    ":END_" +
                    ends
                );

                log(
                    "[B END #" +
                    ends +
                    "] eventTime=" +
                    e.timeStamp
                );

                dump(
                    "[B END STATE]",
                    info(
                        root,
                        anim,
                        left,
                        right
                    )
                );
            }
        );

        cp(name + ":BEFORE_BEGIN");

        anim.beginElement();

        cp(name + ":AFTER_BEGIN_RETURN");

        await sleep(400);

        dump(
            "[B FINAL]",
            info(
                root,
                anim,
                left,
                right
            )
        );

        log(
            "[B RESULT] begins=" +
            begins +
            " ends=" +
            ends
        );

        return {
            begins,
            ends
        };

    } finally {

        root.remove();

        cp(name + ":COMPLETE");
    }
}


/*
 * CASE C
 *
 * Reparent outside the callback.
 *
 * This establishes whether moving an active
 * animation normally causes another beginEvent.
 */

async function caseC() {

    const name = "C_ASYNC_REPARENT";

    cp(name + ":CREATE");

    const {
        root,
        left,
        right,
        anim
    } = buildTree();

    let begins = 0;
    let ends = 0;

    try {

        anim.addEventListener(
            "beginEvent",
            function(e) {

                begins++;

                cp(
                    name +
                    ":BEGIN_" +
                    begins
                );

                log(
                    "[C BEGIN #" +
                    begins +
                    "] eventTime=" +
                    e.timeStamp
                );

                dump(
                    "[C BEGIN STATE]",
                    info(
                        root,
                        anim,
                        left,
                        right
                    )
                );
            }
        );

        anim.addEventListener(
            "endEvent",
            function(e) {

                ends++;

                cp(
                    name +
                    ":END_" +
                    ends
                );

                log(
                    "[C END #" +
                    ends +
                    "] eventTime=" +
                    e.timeStamp
                );

                dump(
                    "[C END STATE]",
                    info(
                        root,
                        anim,
                        left,
                        right
                    )
                );
            }
        );

        cp(name + ":BEFORE_BEGIN");

        anim.beginElement();

        cp(name + ":AFTER_BEGIN_RETURN");

        /*
         * Important difference from B:
         * this executes after beginElement()
         * and its immediate event processing
         * have returned.
         */

        await sleep(20);

        cp(name + ":BEFORE_ASYNC_MOVE");

        dump(
            "[C BEFORE MOVE]",
            info(
                root,
                anim,
                left,
                right
            )
        );

        right.appendChild(anim);

        cp(name + ":AFTER_ASYNC_MOVE");

        dump(
            "[C AFTER MOVE]",
            info(
                root,
                anim,
                left,
                right
            )
        );

        safe(() =>
            root.getBoundingClientRect()
        );

        void document.body.offsetHeight;

        await sleep(400);

        dump(
            "[C FINAL]",
            info(
                root,
                anim,
                left,
                right
            )
        );

        log(
            "[C RESULT] begins=" +
            begins +
            " ends=" +
            ends
        );

        return {
            begins,
            ends
        };

    } finally {

        root.remove();

        cp(name + ":COMPLETE");
    }
}


async function run() {

    button.disabled = true;

    out.textContent = "";

    exceptions = 0;
    anomalies = 0;

    status.textContent = "RUNNING";

    const old =
        localStorage.getItem(
            "PS5_V28_CHECKPOINT"
        );

    if (old) {
        log(
            "Previous checkpoint: " +
            old
        );
    }

    log("PS5 13.60 - V28");
    log(navigator.userAgent);

    log("");
    log(
        "SVGAnimationElement=" +
        typeof SVGAnimationElement
    );

    log("");

    let A = null;
    let B = null;
    let C = null;

    try {

        A = await caseA();

        await sleep(100);

        B = await caseB();

        await sleep(100);

        C = await caseC();

        cp("V28:FINAL_ANALYSIS");

        log("");
        log("==============================");
        log("V28 COMPARISON");
        log("==============================");

        log(
            "CONTROL      begins=" +
            A.begins +
            " ends=" +
            A.ends
        );

        log(
            "SYNC MOVE    begins=" +
            B.begins +
            " ends=" +
            B.ends
        );

        log(
            "ASYNC MOVE   begins=" +
            C.begins +
            " ends=" +
            C.ends
        );

        /*
         * This isn't automatically a security
         * anomaly. It highlights the behavioural
         * difference we're investigating.
         */

        if (
            B.begins > A.begins &&
            B.begins > C.begins
        ) {

            log("");
            log(
                "[OBSERVATION] Extra beginEvent is specific " +
                "to synchronous callback reparenting."
            );

        } else if (
            B.begins > A.begins &&
            C.begins > A.begins
        ) {

            log("");
            log(
                "[OBSERVATION] Reparenting itself restarts/" +
                "reinitializes the animation."
            );

        } else {

            log("");
            log(
                "[OBSERVATION] No unique synchronous " +
                "reparent behaviour detected."
            );
        }

        cp("V28:COMPLETE");

    } catch (e) {

        exceptions++;

        cp("V28:EXCEPTION");

        log("");
        log("[EXCEPTION] " + e);

        try {
            log(e.stack || "");
        } catch (_) {}
    }

    log("");
    log("==============================");
    log("V28 RESULT");
    log("==============================");
    log("EXCEPTIONS: " + exceptions);
    log("ANOMALIES: " + anomalies);
    log("==============================");

    status.textContent =
        exceptions || anomalies ?
        "STATUS: CHECK RESULT" :
        "STATUS: NORMAL";

    button.disabled = false;
}

button.onclick = run;
</script>
