<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 — V21.1 Detached Range Diagnostic</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:16px monospace;
    padding:10px;
    margin-right:8px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok   { color:#59ff7a; }
.bad  { color:#ff6868; }
.info { color:#63caff; }
.warn { color:#ffd166; }
</style>
</head>

<body>

<h2>PS5 13.60 — V21.1 Detached Range Diagnostic</h2>

<button onclick="runV211()">RUN V21.1</button>
<button onclick="clearCP()">CLEAR CHECKPOINT</button>

<div id="log"></div>
<div id="sandbox"></div>

<script>
"use strict";

const KEY = "PS5_V211_CP";

const logBox =
    document.getElementById("log");

const sandbox =
    document.getElementById("sandbox");

let seq = 0;

function log(text, cls="") {

    const d =
        document.createElement("div");

    d.textContent = text;
    d.className = cls;

    logBox.appendChild(d);
}

function checkpoint(phase, detail="") {

    seq++;

    const record = {
        status:"RUNNING",
        phase:phase,
        detail:detail,
        sequence:seq,
        time:Date.now()
    };

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify(record)
        );
    } catch(e) {}

    log(
        seq + ": " +
        phase +
        (detail ? " — " + detail : ""),
        "info"
    );
}

function clearCP() {

    try {
        localStorage.removeItem(KEY);
    } catch(e) {}

    log("Checkpoint cleared.", "warn");
}

function previous() {

    try {

        const raw =
            localStorage.getItem(KEY);

        if (!raw)
            return;

        const x =
            JSON.parse(raw);

        if (x.status !== "RUNNING")
            return;

        log(
            "******************************",
            "bad"
        );

        log(
            "PREVIOUS V21.1 DID NOT COMPLETE",
            "bad"
        );

        log(
            "LAST PHASE: " + x.phase,
            "bad"
        );

        if (x.detail)
            log(
                "DETAIL: " + x.detail,
                "bad"
            );

        log(
            "******************************",
            "bad"
        );

    } catch(e) {}
}

function complete() {

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify({
                status:"COMPLETE",
                time:Date.now()
            })
        );

    } catch(e) {}
}

function delay(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );
}

function nodeDescription(node) {

    if (!node)
        return "NULL";

    let result =
        "type=" + node.nodeType +
        " name=" + node.nodeName;

    if (node.nodeType === 3) {

        result +=
            ' data="' +
            node.data +
            '"';
    }

    if (node.id)
        result +=
            " id=" + node.id;

    return result;
}

function rangeSnapshot(label, range) {

    let text;

    try {
        text = range.toString();
    } catch(e) {
        text =
            "[toString exception: " +
            e.name + "]";
    }

    log(
        "----- " + label + " -----",
        "warn"
    );

    try {

        log(
            "text = [" + text + "]"
        );

        log(
            "collapsed = " +
            range.collapsed
        );

        log(
            "startOffset = " +
            range.startOffset
        );

        log(
            "endOffset = " +
            range.endOffset
        );

        log(
            "startContainer = " +
            nodeDescription(
                range.startContainer
            )
        );

        log(
            "endContainer = " +
            nodeDescription(
                range.endContainer
            )
        );

        log(
            "commonAncestor = " +
            nodeDescription(
                range.commonAncestorContainer
            )
        );

    } catch(e) {

        log(
            "SNAPSHOT EXCEPTION: " +
            e.name + ": " +
            e.message,
            "bad"
        );
    }
}

async function runV211() {

    logBox.innerHTML = "";

    previous();

    seq = 0;

    log(
        "V21.1 START",
        "info"
    );

    log(navigator.userAgent);
    log("");

    try {

        checkpoint(
            "CREATE_DOM"
        );

        sandbox.innerHTML =
            '<div id="outside">OUTSIDE</div>' +
            '<div id="root">' +
                '<div id="parent">' +
                    '<span id="span">AAAA</span>' +
                    '<b id="bold">BBBB</b>' +
                '</div>' +
            '</div>';

        const root =
            document.getElementById("root");

        const parent =
            document.getElementById("parent");

        const span =
            document.getElementById("span");

        const text =
            span.firstChild;

        /*
         * Keep explicit JS references to all
         * relevant nodes after detachment.
         */

        checkpoint(
            "CREATE_RANGE"
        );

        const range =
            document.createRange();

        range.setStart(
            text,
            0
        );

        range.setEnd(
            text,
            text.length
        );

        checkpoint(
            "BEFORE_REMOVE"
        );

        rangeSnapshot(
            "BEFORE REMOVE",
            range
        );

        log(
            "text.data before = [" +
            text.data +
            "]"
        );

        log(
            "root.isConnected before = " +
            root.isConnected
        );

        log(
            "text.isConnected before = " +
            text.isConnected
        );

        /*
         * This is the exact operation that
         * produced the V21 mismatch.
         */

        checkpoint(
            "REMOVE_ROOT"
        );

        root.remove();

        checkpoint(
            "IMMEDIATELY_AFTER_REMOVE"
        );

        rangeSnapshot(
            "IMMEDIATELY AFTER REMOVE",
            range
        );

        log(
            "text.data after = [" +
            text.data +
            "]"
        );

        log(
            "root.isConnected after = " +
            root.isConnected
        );

        log(
            "parent.isConnected after = " +
            parent.isConnected
        );

        log(
            "text.isConnected after = " +
            text.isConnected
        );

        /*
         * Check again after the current
         * synchronous JS execution finishes.
         */

        checkpoint(
            "BEFORE_MICROTASK"
        );

        await Promise.resolve();

        checkpoint(
            "AFTER_MICROTASK"
        );

        rangeSnapshot(
            "AFTER MICROTASK",
            range
        );

        log(
            "detached text.data = [" +
            text.data +
            "]"
        );

        /*
         * And once more after an event-loop
         * turn.
         */

        checkpoint(
            "BEFORE_DELAY"
        );

        await delay(100);

        checkpoint(
            "AFTER_100MS"
        );

        rangeSnapshot(
            "AFTER 100MS",
            range
        );

        log(
            "detached text.data = [" +
            text.data +
            "]"
        );

        /*
         * Directly verify that our retained
         * detached node remains coherent.
         */

        checkpoint(
            "DETACHED_NODE_INTEGRITY"
        );

        let nodeOK =
            text.data === "AAAA" &&
            text.parentNode === span &&
            span.parentNode === parent &&
            parent.parentNode === root &&
            root.isConnected === false;

        log(
            "Detached subtree integrity = " +
            (nodeOK ? "OK" : "UNEXPECTED"),
            nodeOK ? "ok" : "bad"
        );

        checkpoint(
            "FINAL_RANGE_READ"
        );

        let finalText =
            range.toString();

        log(
            "FINAL range.toString() = [" +
            finalText +
            "]"
        );

        complete();

        log("");
        log(
            "======= V21.1 RESULT =======",
            "info"
        );

        log(
            "COMPLETED: YES",
            "ok"
        );

        log(
            "DETACHED NODE TEXT: [" +
            text.data +
            "]"
        );

        log(
            "RANGE TEXT: [" +
            finalText +
            "]"
        );

        log(
            "NODE INTEGRITY: " +
            (nodeOK ? "OK" : "UNEXPECTED"),
            nodeOK ? "ok" : "bad"
        );

        log(
            "============================",
            "info"
        );

    } catch(e) {

        checkpoint(
            "EXCEPTION",
            e.name + ": " + e.message
        );

        log("");
        log(
            "V21.1 STOPPED",
            "bad"
        );

        log(
            e.name + ": " +
            e.message,
            "bad"
        );
    }
}

previous();

</script>
</body>
</html>
