<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 V17 SSV Callback Probe</title>

<style>
body{
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button{
    font:16px monospace;
    padding:10px;
    margin:5px;
}
#log{
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok{color:#59ff7a}
.bad{color:#ff6868}
.warn{color:#ffd166}
.info{color:#63caff}

.spacer{
    height:1800px;
}
</style>
</head>

<body>

<h2>PS5 13.60 — V17 SSV Callback Probe</h2>

<button onclick="runV17()">RUN V17</button>
<button onclick="clearCP()">CLEAR CHECKPOINT</button>

<div id="log"></div>

<div class="spacer"></div>

<a id="foo" href="#foo">
    V17 fragment target
</a>

<script>
"use strict";

const KEY = "PS5_V17_CP";

const box =
    document.getElementById("log");

let seq = 0;
let events = [];

function log(text, cls="") {

    const d =
        document.createElement("div");

    d.textContent = text;
    d.className = cls;

    box.appendChild(d);
}

function checkpoint(name) {

    seq++;

    const e = {
        n:seq,
        name:name,
        href:location.href,
        time:performance.now()
    };

    events.push(e);

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify({
                state:"RUNNING",
                last:e,
                events:events.slice(-40)
            })
        );

    } catch(x) {}

    log(
        seq + ": " + name,
        "info"
    );
}

function finished() {

    try {

        localStorage.setItem(
            KEY,
            JSON.stringify({
                state:"COMPLETE",
                events:events
            })
        );

    } catch(x) {}
}

function clearCP() {

    localStorage.removeItem(KEY);

    log(
        "Checkpoint cleared.",
        "warn"
    );
}

function showPrevious() {

    try {

        const raw =
            localStorage.getItem(KEY);

        if(!raw)
            return;

        const cp =
            JSON.parse(raw);

        if(cp.state !== "RUNNING")
            return;

        log(
            "****************************",
            "bad"
        );

        log(
            "PREVIOUS RUN INCOMPLETE",
            "bad"
        );

        if(cp.last) {

            log(
                "LAST EVENT: " +
                cp.last.n +
                " / " +
                cp.last.name,
                "bad"
            );
        }

        log(
            "****************************",
            "bad"
        );

    } catch(e) {}
}

function sleep(ms) {

    return new Promise(
        r => setTimeout(r,ms)
    );
}

function waitPop() {

    return new Promise(
        (resolve,reject) => {

            const timer =
                setTimeout(() => {

                    reject(
                        new Error(
                            "popstate timeout"
                        )
                    );

                },5000);

            addEventListener(
                "popstate",
                function handler(e) {

                    clearTimeout(timer);

                    checkpoint(
                        "POPSTATE state=" +
                        String(e.state)
                    );

                    resolve(e);

                },
                {once:true}
            );
        }
    );
}

async function runV17() {

    box.innerHTML = "";

    showPrevious();

    seq = 0;
    events = [];

    let blurCount = 0;
    let replaceCount = 0;

    log(
        "V17 START",
        "info"
    );

    log(
        navigator.userAgent
    );

    log("");

    try {

        /*
         * Clean starting state.
         */

        checkpoint(
            "BASELINE"
        );

        history.replaceState(
            "v17-base",
            "",
            location.pathname
        );

        /*
         * Create the element which will
         * initially hold focus.
         */

        checkpoint(
            "CREATE_INPUT"
        );

        const input =
            document.createElement("input");

        input.id =
            "v17-input";

        input.value =
            "focused element";

        document.body.insertBefore(
            input,
            document.body.firstChild
        );

        /*
         * This is the callback we're testing.
         *
         * It intentionally performs only the
         * History API operation documented in
         * the historical trigger.
         */

        input.onblur = function() {

            blurCount++;

            checkpoint(
                "BLUR_ENTER"
            );

            try {

                checkpoint(
                    "BEFORE_REPLACE_FROM_BLUR"
                );

                history.replaceState(
                    "v17-replaced",
                    "",
                    location.href
                );

                replaceCount++;

                checkpoint(
                    "AFTER_REPLACE_FROM_BLUR"
                );

            } catch(e) {

                checkpoint(
                    "REPLACE_EXCEPTION " +
                    String(e)
                );
            }

            checkpoint(
                "BLUR_EXIT"
            );
        };

        input.onfocus = function() {

            checkpoint(
                "INPUT_FOCUS"
            );
        };

        /*
         * Establish the same-document history
         * arrangement.
         *
         * First entry contains #foo.
         * Second entry is the current state.
         */

        checkpoint(
            "PUSH_FRAGMENT_STATE"
        );

        history.pushState(
            "v17-state1",
            "",
            location.pathname + "#foo"
        );

        checkpoint(
            "PUSH_CURRENT_STATE"
        );

        history.pushState(
            "v17-state2",
            "",
            location.pathname
        );

        /*
         * Give input the focus before navigating
         * back to the fragment.
         */

        checkpoint(
            "BEFORE_INPUT_FOCUS"
        );

        input.focus();

        checkpoint(
            "AFTER_INPUT_FOCUS"
        );

        await sleep(100);

        /*
         * history.back() should navigate to
         * the #foo history entry.
         *
         * We're recording whether blur and
         * replaceState occur before/after
         * history.back() returns.
         */

        const pop =
            waitPop();

        checkpoint(
            "BEFORE_HISTORY_BACK"
        );

        history.back();

        checkpoint(
            "AFTER_HISTORY_BACK_RETURN"
        );

        await pop;

        checkpoint(
            "AFTER_POPSTATE"
        );

        await sleep(250);

        checkpoint(
            "FINAL_CHECK"
        );

        log("");
        log(
            "blur callbacks = " +
            blurCount
        );

        log(
            "replaceState in blur = " +
            replaceCount
        );

        log(
            "final state = " +
            String(history.state)
        );

        log(
            "final hash = " +
            location.hash
        );

        /*
         * Cleanup.
         */

        input.onblur = null;
        input.onfocus = null;

        input.remove();

        history.replaceState(
            null,
            "",
            location.pathname
        );

        checkpoint(
            "CLEANUP_COMPLETE"
        );

        finished();

        log("");
        log(
            "======= V17 RESULT =======",
            "info"
        );

        log(
            "STATUS: NORMAL",
            "ok"
        );

        log(
            "BLUR: " +
            blurCount
        );

        log(
            "REPLACE IN BLUR: " +
            replaceCount
        );

        log(
            "EVENTS: " +
            events.length
        );

        log(
            "==========================",
            "info"
        );

    } catch(e) {

        checkpoint(
            "JS_EXCEPTION " +
            String(e)
        );

        log("");
        log(
            "V17 EXCEPTION",
            "bad"
        );

        log(
            String(e),
            "bad"
        );
    }
}

showPrevious();

</script>
</body>
</html>
