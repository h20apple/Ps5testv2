<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V35.4 TransformStream Targeted Substitution</title>

<style>
body {
    background:#111;
    color:#eee;
    font:16px monospace;
    padding:20px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

<h2>PS5 13.60 — V35.4</h2>
<p>TransformStream targeted iterator substitution</p>

<button id="run">RUN V35.4</button>
<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const out = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const button = document.querySelector("#run");

const originalIterator =
    Array.prototype[Symbol.iterator];

let iteratorCalls = 0;
let nextCalls = 0;
let substitutions = 0;

function log(x) {
    out.textContent += x + "\n";
    console.log(x);
}

function checkpoint(x) {
    try {
        localStorage.setItem(
            "V354_CHECKPOINT",
            x
        );
    } catch (_) {}

    log("[CP] " + x);
}

function restore() {
    Array.prototype[Symbol.iterator] =
        originalIterator;
}

function showPrevious() {
    try {
        const x =
            localStorage.getItem(
                "V354_CHECKPOINT"
            );

        if (x)
            log("PREVIOUS CHECKPOINT: " + x);

    } catch (_) {}
}

function run() {

    button.disabled = true;
    out.textContent = "";

    iteratorCalls = 0;
    nextCalls = 0;
    substitutions = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    log("PS5 13.60 — V35.4");
    log("Target: iterator #2 / length 3 / index 1");
    log("");
    log(navigator.userAgent);
    log("");

    if (typeof TransformStream !== "function") {

        log("TransformStream unsupported");

        statusBox.textContent =
            "STATUS: UNSUPPORTED";

        button.disabled = false;
        return;
    }

    checkpoint("01_BEFORE_OVERRIDE");

    /*
     * V35.3 established:
     *
     * Iterator #1:
     *   length = 2
     *
     * Iterator #2:
     *   length = 3
     *
     * This testcase changes ONLY index 1
     * from the second iterator.
     */

    Array.prototype[Symbol.iterator] =
        function() {

            iteratorCalls++;

            const iteratorID =
                iteratorCalls;

            const array = this;
            const initialLength =
                array.length;

            let index = 0;

            return {
                next() {

                    nextCalls++;

                    if (index >= array.length) {

                        return {
                            done:true,
                            value:undefined
                        };
                    }

                    let value =
                        array[index];

                    if (
                        iteratorID === 2 &&
                        initialLength === 3 &&
                        index === 1
                    ) {

                        /*
                         * Ordinary JS object only.
                         */

                        value = {
                            marker:"V354",
                            index:1
                        };

                        substitutions++;
                    }

                    index++;

                    return {
                        done:false,
                        value:value
                    };
                }
            };
        };

    checkpoint("02_OVERRIDE_INSTALLED");

    let stream = null;
    let thrown = null;

    try {

        checkpoint(
            "03_BEFORE_TRANSFORMSTREAM"
        );

        stream =
            new TransformStream();

        /*
         * If the constructor reaches here,
         * the substituted value did not cause
         * a synchronous exception.
         */

        checkpoint(
            "04_TRANSFORMSTREAM_RETURNED"
        );

    } catch(e) {

        /*
         * Save primitive information before
         * restoring the iterator.
         */

        thrown = {
            name:
                String(e.name),

            message:
                String(e.message),

            isTypeError:
                e instanceof TypeError
        };
    }

    /*
     * Restore immediately.
     */

    restore();

    checkpoint(
        "05_ITERATOR_RESTORED"
    );

    log("");
    log("==========================");
    log("OBSERVATION");
    log("==========================");

    log(
        "iteratorCalls = " +
        iteratorCalls
    );

    log(
        "nextCalls = " +
        nextCalls
    );

    log(
        "substitutions = " +
        substitutions
    );

    log("");

    if (thrown) {

        log(
            "Constructor threw:"
        );

        log(
            thrown.name +
            ": " +
            thrown.message
        );

        log(
            "TypeError = " +
            thrown.isTypeError
        );

        if (thrown.isTypeError) {

            log("");
            log(
                "RESULT: NORMAL TYPEERROR"
            );

        } else {

            log("");
            log(
                "RESULT: NON-TYPEERROR EXCEPTION"
            );
        }

    } else {

        log(
            "TransformStream returned normally"
        );

        if (stream) {

            log(
                "readable = " +
                typeof stream.readable
            );

            log(
                "writable = " +
                typeof stream.writable
            );
        }

        log("");

        if (substitutions === 1) {

            log(
                "RESULT: TARGET SUBSTITUTION REACHED"
            );

        } else {

            log(
                "RESULT: TARGET WAS NOT REACHED"
            );
        }
    }

    checkpoint("06_COMPLETE");

    log("");
    log("==========================");
    log("V35.4 COMPLETE");
    log("==========================");

    statusBox.textContent =
        "STATUS: COMPLETE";

    button.disabled = false;
}

showPrevious();

button.onclick = run;

window.addEventListener(
    "pagehide",
    restore
);

window.addEventListener(
    "beforeunload",
    restore
);
</script>
