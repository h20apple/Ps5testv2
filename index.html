<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 — V21 Range Lifetime Probe</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    padding:10px;
    font:16px monospace;
}
#log {
    margin-top:12px;
    padding:14px;
    background:#17233a;
    white-space:pre-wrap;
}
.ok { color:#59ff7a }
.bad { color:#ff6868 }
.info { color:#63caff }
</style>

<h2>PS5 13.60 — V21 Range Lifetime Probe</h2>

<button onclick="run()">RUN V21</button>

<div id="log"></div>
<div id="sandbox"></div>

<script>
"use strict";

const KEY = "PS5_V21_CP";

const out =
    document.getElementById("log");

const sandbox =
    document.getElementById("sandbox");

let tests = 0;
let pass = 0;
let exceptions = 0;
let anomalies = 0;

function log(x, c="") {
    const d = document.createElement("div");
    d.textContent = x;
    d.className = c;
    out.appendChild(d);
}

function cp(test, phase) {

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                state:"RUNNING",
                test:test,
                phase:phase,
                time:Date.now()
            })
        );
    } catch(e) {}

    log(
        "[" + test + "] " + phase,
        "info"
    );
}

function previous() {

    try {

        const x =
            JSON.parse(
                localStorage.getItem(KEY)
            );

        if (
            x &&
            x.state === "RUNNING"
        ) {

            log(
                "PREVIOUS V21 DID NOT COMPLETE",
                "bad"
            );

            log(
                "TEST: " + x.test,
                "bad"
            );

            log(
                "LAST PHASE: " + x.phase,
                "bad"
            );
        }

    } catch(e) {}
}

function finish() {

    localStorage.setItem(
        KEY,
        JSON.stringify({
            state:"COMPLETE"
        })
    );
}

function resetDOM() {

    sandbox.innerHTML =
        "<div id='root'>" +
            "<div id='a'>" +
                "<span>AAAA</span>" +
                "<b>BBBB</b>" +
            "</div>" +
            "<div id='b'>" +
                "<i>CCCC</i>" +
                "<em>DDDD</em>" +
            "</div>" +
        "</div>";
}

function execute(name, fn) {

    tests++;

    cp(name,"START");

    try {

        resetDOM();

        cp(name,"DOM_READY");

        fn();

        cp(name,"COMPLETE");

        pass++;

    } catch(e) {

        exceptions++;

        log(
            "[" + name + "] " +
            e.name + ": " +
            e.message
        );
    }
}

/*
 * 1 — Extract a range spanning
 * different branches.
 */

function extractCrossBranch() {

    const root =
        sandbox.querySelector("#root");

    const a =
        sandbox.querySelector("#a span")
               .firstChild;

    const b =
        sandbox.querySelector("#b em")
               .firstChild;

    const r =
        document.createRange();

    r.setStart(a,1);
    r.setEnd(b,3);

    cp(
        "A_EXTRACT",
        "BEFORE_EXTRACT"
    );

    const frag =
        r.extractContents();

    cp(
        "A_EXTRACT",
        "AFTER_EXTRACT"
    );

    if (!frag)
        anomalies++;

    void root.offsetHeight;
}

/*
 * 2 — Clone while DOM changes.
 */

function cloneThenRemove() {

    const root =
        sandbox.querySelector("#root");

    const a =
        sandbox.querySelector("#a");

    const b =
        sandbox.querySelector("#b");

    const r =
        document.createRange();

    r.setStartBefore(a);
    r.setEndAfter(b);

    cp(
        "B_CLONE_REMOVE",
        "BEFORE_CLONE"
    );

    const clone =
        r.cloneContents();

    cp(
        "B_CLONE_REMOVE",
        "REMOVE_CONTAINER"
    );

    root.remove();

    cp(
        "B_CLONE_REMOVE",
        "AFTER_REMOVE"
    );

    if (!clone)
        anomalies++;
}

/*
 * 3 — Keep Range alive after
 * its subtree is detached.
 */

function detachedRange() {

    const root =
        sandbox.querySelector("#root");

    const text =
        sandbox.querySelector("#a span")
               .firstChild;

    const r =
        document.createRange();

    r.setStart(text,0);
    r.setEnd(text,4);

    cp(
        "C_DETACHED",
        "DETACH_ROOT"
    );

    root.remove();

    cp(
        "C_DETACHED",
        "READ_RANGE"
    );

    const value =
        r.toString();

    if (value !== "AAAA") {

        anomalies++;

        log(
            "Detached Range mismatch: " +
            value,
            "bad"
        );
    }
}

/*
 * 4 — Delete contents spanning
 * several ancestors.
 */

function deleteCrossBranch() {

    const root =
        sandbox.querySelector("#root");

    const t1 =
        sandbox.querySelector("#a span")
               .firstChild;

    const t2 =
        sandbox.querySelector("#b em")
               .firstChild;

    const r =
        document.createRange();

    r.setStart(t1,2);
    r.setEnd(t2,2);

    cp(
        "D_DELETE",
        "BEFORE_DELETE"
    );

    r.deleteContents();

    cp(
        "D_DELETE",
        "AFTER_DELETE"
    );

    void root.offsetHeight;
}

/*
 * 5 — Extract then mutate the
 * surviving Range/container.
 */

function extractAndMutate() {

    const root =
        sandbox.querySelector("#root");

    const a =
        sandbox.querySelector("#a");

    const b =
        sandbox.querySelector("#b");

    const r =
        document.createRange();

    r.setStartBefore(a);
    r.setEndAfter(b);

    cp(
        "E_EXTRACT_MUTATE",
        "EXTRACT"
    );

    const fragment =
        r.extractContents();

    cp(
        "E_EXTRACT_MUTATE",
        "MUTATE"
    );

    root.appendChild(
        document.createTextNode(
            "replacement"
        )
    );

    cp(
        "E_EXTRACT_MUTATE",
        "READ_RANGE"
    );

    r.toString();

    if (!fragment)
        anomalies++;
}

async function run() {

    out.innerHTML = "";

    previous();

    tests = 0;
    pass = 0;
    exceptions = 0;
    anomalies = 0;

    log(
        "V21 START",
        "info"
    );

    log(navigator.userAgent);
    log("");

    execute(
        "A_EXTRACT",
        extractCrossBranch
    );

    await new Promise(
        r => setTimeout(r,100)
    );

    execute(
        "B_CLONE_REMOVE",
        cloneThenRemove
    );

    await new Promise(
        r => setTimeout(r,100)
    );

    execute(
        "C_DETACHED",
        detachedRange
    );

    await new Promise(
        r => setTimeout(r,100)
    );

    execute(
        "D_DELETE",
        deleteCrossBranch
    );

    await new Promise(
        r => setTimeout(r,100)
    );

    execute(
        "E_EXTRACT_MUTATE",
        extractAndMutate
    );

    finish();

    log("");
    log(
        "======= V21 RESULT =======",
        "info"
    );

    log(
        "STATUS: " +
        (
            anomalies === 0
                ? "NORMAL"
                : "ANOMALY"
        ),
        anomalies === 0
            ? "ok"
            : "bad"
    );

    log("TESTS: " + tests);
    log("PASS: " + pass);
    log("EXCEPTIONS: " + exceptions);
    log("ANOMALIES: " + anomalies);

    log(
        "==========================",
        "info"
    );
}

previous();
</script>
