<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 WebKit 13.60 V4 Regression PoC</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:17px monospace;
    padding:20px;
}
button,select {
    font:17px monospace;
    padding:10px 14px;
    margin:4px;
}
#log {
    background:#17233a;
    padding:16px;
    margin-top:15px;
    white-space:pre-wrap;
}
.ok { color:#59ff7a; }
.bad { color:#ff6868; }
.info { color:#63caff; }
.warn { color:#ffd166; }
</style>
</head>

<body>

<h2>PS5 WebKit 13.60 — V4 Regression PoC</h2>

<select id="case">
<option value="all">All cases</option>
<option value="dom">DOM lifetime</option>
<option value="mutation">Callback mutation</option>
<option value="iframe">Iframe teardown</option>
<option value="worker">Worker / ArrayBuffer</option>
</select>

<select id="runs">
<option value="100">100</option>
<option value="500" selected>500</option>
<option value="2000">2000</option>
</select>

<button onclick="start()">Run V4</button>
<button onclick="requestStop()">Stop</button>
<button onclick="clearLog()">Clear</button>

<div id="log"></div>

<script>
"use strict";

const box = document.getElementById("log");

let stopping = false;

let stats = {
    tests:0,
    pass:0,
    fail:0,
    anomaly:0,
    iteration:0,
    start:0
};

function log(text, cls="") {
    const e = document.createElement("div");
    e.textContent = text;
    e.className = cls;
    box.appendChild(e);
    window.scrollTo(0,document.body.scrollHeight);
}

function clearLog() {
    box.innerHTML="";
}

function requestStop() {
    stopping=true;
    log("STOP requested","warn");
}

function checkpoint(test,iteration) {
    try {
        sessionStorage.setItem(
            "webkit-v4-checkpoint",
            JSON.stringify({
                test:test,
                iteration:iteration,
                timestamp:Date.now()
            })
        );
    } catch(e) {}
}

function showPreviousCheckpoint() {
    try {
        const raw =
            sessionStorage.getItem(
                "webkit-v4-checkpoint"
            );

        if (!raw)
            return;

        const c=JSON.parse(raw);

        log(
            "Previous checkpoint: "+
            c.test+
            " @ iteration "+
            c.iteration,
            "warn"
        );

    } catch(e) {}
}

function record(ok,name) {

    stats.tests++;

    if(ok) {
        stats.pass++;
        return;
    }

    stats.fail++;

    log(
        "[FAIL] "+name,
        "bad"
    );
}

/*
 ========================================
 CASE 1
 DOM lifetime changes during callbacks
 ========================================
*/

async function domLifetime(iter) {

    const parent =
        document.createElement("div");

    const victim =
        document.createElement("div");

    parent.appendChild(victim);
    document.body.appendChild(parent);

    let calls=0;

    function callback() {

        calls++;

        victim.remove();

        /*
         JS wrapper remains a valid JS
         object even after DOM removal.
        */

        victim.setAttribute(
            "data-after-remove",
            String(iter)
        );
    }

    victim.addEventListener(
        "v4event",
        callback
    );

    victim.dispatchEvent(
        new Event("v4event")
    );

    victim.removeEventListener(
        "v4event",
        callback
    );

    parent.remove();

    return (
        calls===1 &&
        victim.getAttribute(
            "data-after-remove"
        )===String(iter)
    );
}

/*
 ========================================
 CASE 2
 Mutation while callback executes
 ========================================
*/

async function mutationCase(iter) {

    const root =
        document.createElement("div");

    document.body.appendChild(root);

    const nodes=[];

    for(let i=0;i<64;i++) {

        const n=
            document.createElement("span");

        n.textContent=
            iter+":"+i;

        nodes.push(n);
        root.appendChild(n);
    }

    let calls=0;

    function mutate() {

        calls++;

        while(root.firstChild)
            root.removeChild(
                root.firstChild
            );

        for(let i=0;i<32;i++) {

            const n=
                document.createElement("i");

            n.textContent=
                "new-"+i;

            root.appendChild(n);
        }
    }

    root.addEventListener(
        "v4mutation",
        mutate
    );

    root.dispatchEvent(
        new Event("v4mutation")
    );

    const good =
        calls===1 &&
        root.childNodes.length===32;

    root.remove();

    return good;
}

/*
 ========================================
 CASE 3
 Document / iframe teardown
 ========================================
*/

async function iframeCase(iter) {

    return new Promise(resolve=>{

        const frame=
            document.createElement(
                "iframe"
            );

        let finished=false;

        const timer=setTimeout(()=>{

            if(finished)
                return;

            finished=true;

            try { frame.remove(); }
            catch(e) {}

            resolve(false);

        },1000);

        frame.onload=function(){

            if(finished)
                return;

            try {

                const doc=
                    frame.contentDocument;

                const element=
                    doc.createElement("div");

                element.textContent=
                    "iteration-"+iter;

                doc.body.appendChild(
                    element
                );

                frame.remove();

                /*
                 Retain JS references after
                 document teardown and inspect
                 ordinary JS-visible state.
                */

                const ok=
                    element.textContent===
                    "iteration-"+iter;

                finished=true;
                clearTimeout(timer);

                resolve(ok);

            } catch(e) {

                finished=true;
                clearTimeout(timer);

                try { frame.remove(); }
                catch(x) {}

                resolve(false);
            }
        };

        frame.src="about:blank";

        document.body.appendChild(
            frame
        );
    });
}

/*
 ========================================
 CASE 4
 Worker / ArrayBuffer lifecycle
 ========================================
*/

async function workerCase(iter) {

    return new Promise(resolve=>{

        if(typeof Worker==="undefined") {
            resolve(true);
            return;
        }

        const source=`
        self.onmessage=function(e) {
            const a=new Uint32Array(e.data);

            const good=
                a.length===64 &&
                a[0]===e.data.byteLength;

            self.postMessage({
                good:good,
                first:a[0]
            });
        };
        `;

        const blob=
            new Blob(
                [source],
                {type:"text/javascript"}
            );

        const url=
            URL.createObjectURL(blob);

        const worker=
            new Worker(url);

        const buffer=
            new ArrayBuffer(256);

        const view=
            new Uint32Array(buffer);

        view[0]=256;

        let finished=false;

        const timer=setTimeout(()=>{

            if(finished)
                return;

            finished=true;

            worker.terminate();
            URL.revokeObjectURL(url);

            resolve(false);

        },1500);

        worker.onmessage=function(e){

            if(finished)
                return;

            finished=true;
            clearTimeout(timer);

            const ok=
                e.data &&
                e.data.good===true &&
                e.data.first===256;

            worker.terminate();
            URL.revokeObjectURL(url);

            resolve(ok);
        };

        worker.onerror=function(){

            if(finished)
                return;

            finished=true;
            clearTimeout(timer);

            worker.terminate();
            URL.revokeObjectURL(url);

            resolve(false);
        };

        worker.postMessage(buffer);
    });
}

const tests={
    dom:domLifetime,
    mutation:mutationCase,
    iframe:iframeCase,
    worker:workerCase
};

async function start() {

    clearLog();

    stopping=false;

    stats={
        tests:0,
        pass:0,
        fail:0,
        anomaly:0,
        iteration:0,
        start:performance.now()
    };

    showPreviousCheckpoint();

    const selected=
        document.getElementById(
            "case"
        ).value;

    const runs=
        Number(
            document.getElementById(
                "runs"
            ).value
        );

    const selectedTests=
        selected==="all"
        ? Object.keys(tests)
        : [selected];

    log(
        "PS5 WebKit V4 starting...",
        "info"
    );

    log(
        "UA: "+navigator.userAgent
    );

    log(
        "Cases: "+
        selectedTests.join(", ")
    );

    log(
        "Iterations: "+runs
    );

    log("");

    for(let i=0;i<runs;i++) {

        if(stopping)
            break;

        stats.iteration=i;

        for(const name of selectedTests) {

            if(stopping)
                break;

            checkpoint(name,i);

            try {

                const ok=
                    await tests[name](i);

                record(
                    ok===true,
                    name+
                    " iteration "+
                    i
                );

            } catch(e) {

                stats.tests++;
                stats.fail++;
                stats.anomaly++;

                log(
                    "[EXCEPTION] "+
                    name+
                    " iteration="+
                    i+
                    " :: "+
                    e,
                    "bad"
                );
            }
        }

        if((i%25)===0) {

            log(
                "Iteration "+
                i+
                " / "+
                runs,
                "info"
            );

            await new Promise(
                r=>setTimeout(r,0)
            );
        }
    }

    const runtime=
        performance.now()-
        stats.start;

    log("");
    log(
        "========== V4 RESULT ==========",
        "info"
    );

    log("Tests:     "+stats.tests);
    log("Passed:    "+stats.pass,"ok");

    log(
        "Failed:    "+stats.fail,
        stats.fail ? "bad":"ok"
    );

    log(
        "Anomalies: "+stats.anomaly,
        stats.anomaly ? "bad":"ok"
    );

    log(
        "Last run:  "+
        stats.iteration
    );

    log(
        "Runtime:   "+
        runtime.toFixed(2)+
        " ms"
    );

    if(
        !stopping &&
        stats.fail===0 &&
        stats.anomaly===0
    ) {
        log(
            "[PASS] Stable run",
            "ok"
        );
    }

    log(
        "===============================",
        "info"
    );
}

</script>
</body>
</html>
