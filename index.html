<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 — V24 Capability Fingerprint</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:16px monospace;
    padding:10px;
    margin-right:8px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.yes  { color:#59ff7a; }
.no   { color:#ff6868; }
.info { color:#63caff; }
.warn { color:#ffd166; }
</style>
</head>

<body>

<h2>PS5 13.60 — V24 Capability Fingerprint</h2>

<button onclick="runV24()">RUN V24</button>

<div id="log"></div>

<script>
"use strict";

const out = document.getElementById("log");

let yes = 0;
let no = 0;
let errors = 0;

function log(text, cls="") {
    const d = document.createElement("div");
    d.textContent = text;
    d.className = cls;
    out.appendChild(d);
}

function section(name) {
    log("");
    log("===== " + name + " =====", "info");
}

function result(name, supported, detail="") {

    if (supported) yes++;
    else no++;

    log(
        (supported ? "[YES] " : "[NO ] ") +
        name +
        (detail ? " — " + detail : ""),
        supported ? "yes" : "no"
    );
}

function exists(name, value) {
    result(name, typeof value !== "undefined",
        typeof value);
}

function css(name, property, value) {

    let supported = false;

    try {
        supported =
            !!window.CSS &&
            typeof CSS.supports === "function" &&
            CSS.supports(property, value);
    } catch(e) {
        errors++;
    }

    result(
        name,
        supported,
        property + ": " + value
    );
}

async function runV24() {

    out.innerHTML = "";

    yes = 0;
    no = 0;
    errors = 0;

    log("V24 START", "info");
    log(navigator.userAgent);

    /*
     * JavaScript / memory
     */

    section("JAVASCRIPT / MEMORY");

    exists("ArrayBuffer", window.ArrayBuffer);
    exists("SharedArrayBuffer", window.SharedArrayBuffer);
    exists("DataView", window.DataView);
    exists("Uint8Array", window.Uint8Array);
    exists("BigInt", window.BigInt);
    exists("BigInt64Array", window.BigInt64Array);
    exists("WebAssembly", window.WebAssembly);
    exists("Atomics", window.Atomics);
    exists("Proxy", window.Proxy);
    exists("WeakRef", window.WeakRef);
    exists("FinalizationRegistry", window.FinalizationRegistry);
    exists("structuredClone", window.structuredClone);

    /*
     * Workers / async
     */

    section("WORKERS / ASYNC");

    exists("Worker", window.Worker);
    exists("SharedWorker", window.SharedWorker);
    exists("MessageChannel", window.MessageChannel);
    exists("BroadcastChannel", window.BroadcastChannel);
    exists("queueMicrotask", window.queueMicrotask);
    exists("requestIdleCallback", window.requestIdleCallback);

    /*
     * Storage
     */

    section("STORAGE");

    exists("localStorage", window.localStorage);
    exists("sessionStorage", window.sessionStorage);
    exists("indexedDB", window.indexedDB);
    exists("caches", window.caches);

    /*
     * DOM
     */

    section("DOM");

    exists("MutationObserver", window.MutationObserver);
    exists("IntersectionObserver", window.IntersectionObserver);
    exists("ResizeObserver", window.ResizeObserver);
    exists("DOMParser", window.DOMParser);
    exists("XMLSerializer", window.XMLSerializer);
    exists("Range", window.Range);
    exists("Selection", window.Selection);
    exists("NodeIterator", window.NodeIterator);
    exists("TreeWalker", window.TreeWalker);
    exists("ShadowRoot", window.ShadowRoot);
    exists("customElements", window.customElements);

    let attachShadow = false;

    try {
        attachShadow =
            typeof document.createElement("div")
                .attachShadow === "function";
    } catch(e) {
        errors++;
    }

    result("Element.attachShadow", attachShadow);

    /*
     * Events
     */

    section("EVENTS");

    exists("Event", window.Event);
    exists("CustomEvent", window.CustomEvent);
    exists("FocusEvent", window.FocusEvent);
    exists("MouseEvent", window.MouseEvent);
    exists("PointerEvent", window.PointerEvent);
    exists("TouchEvent", window.TouchEvent);
    exists("InputEvent", window.InputEvent);
    exists("KeyboardEvent", window.KeyboardEvent);

    /*
     * Fonts
     */

    section("FONTS");

    exists("FontFace", window.FontFace);

    result(
        "document.fonts",
        typeof document.fonts !== "undefined"
    );

    if (document.fonts) {

        result(
            "FontFaceSet.add",
            typeof document.fonts.add === "function"
        );

        result(
            "FontFaceSet.delete",
            typeof document.fonts.delete === "function"
        );

        result(
            "FontFaceSet.check",
            typeof document.fonts.check === "function"
        );

        result(
            "FontFaceSet.ready",
            typeof document.fonts.ready !== "undefined"
        );
    }

    /*
     * Graphics
     */

    section("GRAPHICS");

    exists("CanvasRenderingContext2D",
        window.CanvasRenderingContext2D);

    exists("WebGLRenderingContext",
        window.WebGLRenderingContext);

    exists("WebGL2RenderingContext",
        window.WebGL2RenderingContext);

    exists("ImageBitmap",
        window.ImageBitmap);

    exists("OffscreenCanvas",
        window.OffscreenCanvas);

    /*
     * SVG
     */

    section("SVG");

    exists("SVGElement", window.SVGElement);
    exists("SVGSVGElement", window.SVGSVGElement);
    exists("SVGPathElement", window.SVGPathElement);
    exists("SVGAnimationElement", window.SVGAnimationElement);

    /*
     * Networking
     */

    section("NETWORK");

    exists("fetch", window.fetch);
    exists("XMLHttpRequest", window.XMLHttpRequest);
    exists("WebSocket", window.WebSocket);
    exists("EventSource", window.EventSource);
    exists("URL", window.URL);
    exists("URLSearchParams", window.URLSearchParams);

    /*
     * Crypto
     */

    section("CRYPTO");

    result(
        "crypto",
        typeof window.crypto !== "undefined"
    );

    result(
        "crypto.subtle",
        !!(
            window.crypto &&
            window.crypto.subtle
        )
    );

    /*
     * Media
     */

    section("MEDIA");

    exists("AudioContext", window.AudioContext);
    exists("webkitAudioContext", window.webkitAudioContext);
    exists("MediaSource", window.MediaSource);
    exists("MediaRecorder", window.MediaRecorder);
    exists("RTCPeerConnection", window.RTCPeerConnection);

    /*
     * History / navigation
     */

    section("HISTORY");

    result(
        "history.pushState",
        typeof history.pushState === "function"
    );

    result(
        "history.replaceState",
        typeof history.replaceState === "function"
    );

    result(
        "history.back",
        typeof history.back === "function"
    );

    /*
     * CSS
     */

    section("CSS");

    result(
        "CSS.supports",
        !!window.CSS &&
        typeof CSS.supports === "function"
    );

    css("Flexbox",
        "display",
        "flex");

    css("Grid",
        "display",
        "grid");

    css("CSS variables",
        "--v24",
        "1");

    css("Filter",
        "filter",
        "blur(1px)");

    css("Backdrop filter",
        "backdrop-filter",
        "blur(1px)");

    css("Clip path",
        "clip-path",
        "circle(20px)");

    css("Contain",
        "contain",
        "layout");

    css("Content visibility",
        "content-visibility",
        "hidden");

    css("Aspect ratio",
        "aspect-ratio",
        "1 / 1");

    css("Object fit",
        "object-fit",
        "cover");

    css("Writing mode",
        "writing-mode",
        "vertical-rl");

    css("CSS animation",
        "animation-name",
        "v24");

    css("CSS transform",
        "transform",
        "translateX(1px)");

    css("CSS perspective",
        "perspective",
        "100px");

    css("CSS mask",
        "-webkit-mask-image",
        "linear-gradient(black,transparent)");

    css("CSS columns",
        "column-count",
        "2");

    css("Position sticky",
        "position",
        "sticky");

    css("Position fixed",
        "position",
        "fixed");

    /*
     * Newer CSS features.
     */

    css("Anchor positioning",
        "anchor-name",
        "--v24-anchor");

    css("Container queries",
        "container-type",
        "inline-size");

    /*
     * Selector support.
     */

    section("SELECTORS");

    function selectorTest(name, selector) {

        let ok = false;

        try {

            if (
                window.CSS &&
                typeof CSS.supports === "function"
            ) {
                ok =
                    CSS.supports(
                        "selector(" +
                        selector +
                        ")"
                    );
            }

        } catch(e) {
            errors++;
        }

        result(name, ok, selector);
    }

    selectorTest(":has()", ":has(div)");
    selectorTest(":is()", ":is(div,span)");
    selectorTest(":where()", ":where(div)");
    selectorTest(":focus-visible", ":focus-visible");

    /*
     * HTML elements / APIs.
     */

    section("HTML FEATURES");

    function elementFeature(name, tag, property) {

        let supported = false;

        try {
            const e =
                document.createElement(tag);

            supported =
                property in e;

        } catch(e) {
            errors++;
        }

        result(
            name,
            supported,
            tag + "." + property
        );
    }

    elementFeature(
        "dialog.showModal",
        "dialog",
        "showModal"
    );

    elementFeature(
        "details.open",
        "details",
        "open"
    );

    elementFeature(
        "template.content",
        "template",
        "content"
    );

    elementFeature(
        "iframe.srcdoc",
        "iframe",
        "srcdoc"
    );

    /*
     * Small live checks.
     */

    section("LIVE CHECKS");

    try {

        const r =
            document.createRange();

        result(
            "createRange()",
            !!r
        );

    } catch(e) {

        errors++;
        result("createRange()", false);
    }

    try {

        const div =
            document.createElement("div");

        div.innerHTML =
            "<span>V24</span>";

        const clone =
            div.cloneNode(true);

        result(
            "DOM clone",
            clone.textContent === "V24"
        );

    } catch(e) {

        errors++;
        result("DOM clone", false);
    }

    try {

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                "<root><x>V24</x></root>",
                "text/xml"
            );

        result(
            "DOMParser XML",
            doc.documentElement
               .firstChild
               .textContent === "V24"
        );

    } catch(e) {

        errors++;
        result("DOMParser XML", false);
    }

    /*
     * Result
     */

    section("V24 RESULT");

    log(
        "SUPPORTED: " + yes,
        "yes"
    );

    log(
        "UNSUPPORTED: " + no,
        "no"
    );

    log(
        "TEST ERRORS: " + errors,
        errors ? "warn" : "yes"
    );

    log("");
    log(
        "V24 COMPLETE",
        "info"
    );
}

</script>
</body>
</html>
