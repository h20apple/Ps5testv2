<!doctype html>
<meta charset="utf-8">
<title>PS5 WebKit 13.60 V6 Fuzzer</title>

<style>
body {
  background:#101827;
  color:#eee;
  font:17px monospace;
  padding:20px;
}
button,input {
  font:17px monospace;
  padding:9px;
  margin:4px;
}
#log {
  background:#17233a;
  padding:15px;
  margin-top:12px;
  white-space:pre-wrap;
}
.ok {color:#59ff7a}
.bad {color:#ff6868}
.info {color:#63caff}
.warn {color:#ffd166}
</style>

<h2>PS5 WebKit 13.60 — V6 Seeded Fuzzer</h2>

Seed:
<input id="seed" value="1360605" size="12">

Iterations:
<input id="runs" value="5000" size="7">

<button onclick="start()">Start</button>
<button onclick="stopRun()">Stop</button>
<button onclick="replay()">Replay Last</button>
<button onclick="clearLog()">Clear</button>

<div id="log"></div>

<script>
"use strict";

const box=document.getElementById("log");

let stopped=false;
let lastSeed=0;

let stats={
  tests:0,
  pass:0,
  fail:0,
  exceptions:0,
  start:0
};

function log(s,c=""){
  const d=document.createElement("div");
  d.textContent=s;
  d.className=c;
  box.appendChild(d);
  window.scrollTo(0,document.body.scrollHeight);
}

function clearLog(){
  box.innerHTML="";
}

function stopRun(){
  stopped=true;
  log("STOP requested","warn");
}

/*
 Seeded PRNG.

 Same seed => same operation sequence.
*/

function RNG(seed){

  let x=seed>>>0;

  return function(){

    x ^= x << 13;
    x ^= x >>> 17;
    x ^= x << 5;

    return (x>>>0)/4294967296;
  };
}

function randInt(rng,max){
  return Math.floor(rng()*max);
}

function checkpoint(seed,iteration,operation){

  try{

    localStorage.setItem(
      "v6-checkpoint",
      JSON.stringify({
        seed,
        iteration,
        operation,
        state:"RUNNING"
      })
    );

  }catch(e){}
}

function complete(seed,iteration){

  try{

    localStorage.setItem(
      "v6-checkpoint",
      JSON.stringify({
        seed,
        iteration,
        state:"COMPLETE"
      })
    );

  }catch(e){}
}

function showPrevious(){

  try{

    const raw=
      localStorage.getItem(
        "v6-checkpoint"
      );

    if(!raw) return;

    const c=JSON.parse(raw);

    if(c.state==="RUNNING"){

      log(
        "Previous incomplete run:",
        "warn"
      );

      log(
        "Seed: "+c.seed+
        " Iteration: "+c.iteration+
        " Operation: "+c.operation,
        "warn"
      );
    }

  }catch(e){}
}

/* =====================================
   Operation 0 — DOM create/remove
===================================== */

function opDOM(rng,i){

  const root=
    document.createElement("div");

  document.body.appendChild(root);

  const count=
    10+randInt(rng,100);

  for(let n=0;n<count;n++){

    const e=
      document.createElement(
        randInt(rng,2) ?
        "span":"div"
      );

    e.textContent=
      i+":"+n;

    root.appendChild(e);
  }

  while(root.firstChild){

    const index=
      randInt(
        rng,
        root.childNodes.length
      );

    root.removeChild(
      root.childNodes[index]
    );
  }

  const ok=
    root.childNodes.length===0;

  root.remove();

  return ok;
}

/* =====================================
   Operation 1 — ArrayBuffer integrity
===================================== */

function opBuffer(rng,i){

  const words=
    64+randInt(rng,4096);

  const buffer=
    new ArrayBuffer(words*4);

  const a=
    new Uint32Array(buffer);

  const marker=
    randInt(rng,0xffffffff)>>>0;

  for(let n=0;n<a.length;n++)
    a[n]=(marker^n^i)>>>0;

  for(let n=0;n<a.length;n++){

    if(
      a[n] !==
      ((marker^n^i)>>>0)
    )
      return false;
  }

  return true;
}

/* =====================================
   Operation 2 — Event mutation
===================================== */

function opEvent(rng,i){

  const root=
    document.createElement("div");

  document.body.appendChild(root);

  const count=
    5+randInt(rng,60);

  for(let n=0;n<count;n++){

    const x=
      document.createElement("span");

    x.textContent=String(n);

    root.appendChild(x);
  }

  let calls=0;

  function handler(){

    calls++;

    while(root.firstChild)
      root.removeChild(
        root.firstChild
      );

    const replacement=
      document.createElement("b");

    replacement.textContent=
      "iteration-"+i;

    root.appendChild(
      replacement
    );
  }

  root.addEventListener(
    "v6",
    handler
  );

  root.dispatchEvent(
    new Event("v6")
  );

  root.removeEventListener(
    "v6",
    handler
  );

  const ok=
    calls===1 &&
    root.childNodes.length===1;

  root.remove();

  return ok;
}

/* =====================================
   Operation 3 — detached wrappers
===================================== */

function opDetached(rng,i){

  const parent=
    document.createElement("div");

  const child=
    document.createElement("div");

  parent.appendChild(child);
  document.body.appendChild(parent);

  child.setAttribute(
    "data-before",
    String(i)
  );

  child.remove();

  const value=
    randInt(rng,0xffffff);

  child.setAttribute(
    "data-after",
    String(value)
  );

  const ok=
    child.getAttribute(
      "data-after"
    )===String(value);

  parent.remove();

  return ok;
}

/* =====================================
   Operation 4 — DataView boundaries
===================================== */

function opDataView(rng){

  const size=
    32+randInt(rng,512);

  const b=
    new ArrayBuffer(size);

  const d=
    new DataView(b);

  const offset=
    randInt(rng,size-4);

  const value=
    randInt(rng,0xffffffff)>>>0;

  d.setUint32(offset,value);

  if(d.getUint32(offset)!==value)
    return false;

  let trapped=false;

  try{

    d.getUint32(size+8);

  }catch(e){

    trapped=true;
  }

  return trapped;
}

/* =====================================
   Operation 5 — object churn
===================================== */

function opObjects(rng,i){

  const count=
    100+randInt(rng,1500);

  let objects=[];

  for(let n=0;n<count;n++){

    objects.push({
      n:n,
      iteration:i,
      value:randInt(
        rng,
        0xffffff
      ),
      text:"v6-"+n
    });
  }

  for(
    let n=0;
    n<objects.length;
    n+=37
  ){

    if(
      objects[n].n!==n ||
      objects[n].iteration!==i
    )
      return false;
  }

  objects=null;

  return true;
}

const operations=[
  opDOM,
  opBuffer,
  opEvent,
  opDetached,
  opDataView,
  opObjects
];

const names=[
  "DOM",
  "ArrayBuffer",
  "Event mutation",
  "Detached DOM",
  "DataView",
  "Object churn"
];

async function runSeed(seed,runs){

  stopped=false;

  stats={
    tests:0,
    pass:0,
    fail:0,
    exceptions:0,
    start:performance.now()
  };

  lastSeed=seed;

  const rng=RNG(seed);

  log(
    "V6 starting",
    "info"
  );

  log("Seed: "+seed);
  log("Iterations: "+runs);
  log("UA: "+navigator.userAgent);
  log("");

  for(let i=0;i<runs;i++){

    if(stopped)
      break;

    /*
     Choose operation deterministically
     from the seeded generator.
    */

    const op=
      randInt(
        rng,
        operations.length
      );

    checkpoint(
      seed,
      i,
      names[op]
    );

    stats.tests++;

    try{

      const result=
        operations[op](
          rng,
          i
        );

      if(result===true){

        stats.pass++;

      }else{

        stats.fail++;

        log(
          "[FAIL] seed="+seed+
          " iteration="+i+
          " operation="+names[op],
          "bad"
        );
      }

    }catch(e){

      stats.exceptions++;

      log(
        "[EXCEPTION] seed="+seed+
        " iteration="+i+
        " operation="+names[op]+
        " :: "+e,
        "bad"
      );
    }

    complete(seed,i);

    if((i%100)===0){

      log(
        "Iteration "+
        i+
        "/"+
        runs,
        "info"
      );

      await new Promise(
        r=>setTimeout(r,0)
      );
    }
  }

  const elapsed=
    performance.now()-
    stats.start;

  log("");
  log(
    "======= V6 RESULT =======",
    "info"
  );

  log("Seed:       "+seed);

  log(
    "PASS:       "+stats.pass,
    "ok"
  );

  log(
    "FAIL:       "+stats.fail,
    stats.fail ?
      "bad":"ok"
  );

  log(
    "EXCEPTIONS: "+
    stats.exceptions,
    stats.exceptions ?
      "bad":"ok"
  );

  log(
    "Runtime:    "+
    elapsed.toFixed(2)+
    " ms"
  );

  log(
    "=========================",
    "info"
  );
}

function start(){

  clearLog();
  showPrevious();

  const seed=
    Number(
      document.getElementById(
        "seed"
      ).value
    )>>>0;

  const runs=
    Math.max(
      1,
      Number(
        document.getElementById(
          "runs"
        ).value
      )
    );

  runSeed(seed,runs);
}

function replay(){

  clearLog();

  try{

    const raw=
      localStorage.getItem(
        "v6-checkpoint"
      );

    if(!raw){

      log(
        "No previous run",
        "warn"
      );

      return;
    }

    const c=
      JSON.parse(raw);

    document.getElementById(
      "seed"
    ).value=c.seed;

    /*
     Replay far enough to reach the
     previous checkpoint.
    */

    const runs=
      (c.iteration||0)+2;

    document.getElementById(
      "runs"
    ).value=runs;

    log(
      "Replaying seed "+
      c.seed+
      " through iteration "+
      c.iteration,
      "warn"
    );

    runSeed(
      c.seed,
      runs
    );

  }catch(e){

    log(
      "Replay error: "+e,
      "bad"
    );
  }
}

showPrevious();

</script>
