<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PS5 13.60 V13 WebKit Verification</title>

<style>
body {
    background:#101827;
    color:#eee;
    font:16px monospace;
    padding:18px;
}
button {
    font:16px monospace;
    padding:10px;
    margin:5px;
}
#log {
    background:#17233a;
    padding:14px;
    margin-top:12px;
    white-space:pre-wrap;
}
.ok { color:#59ff7a; }
.bad { color:#ff6868; }
.warn { color:#ffd166; }
.info { color:#63caff; }

#testarea {
    position:absolute;
    left:-10000px;
    top:-10000px;
}
</style>
</head>

<body>

<h2>PS5 13.60 — V13 WebKit Verification</h2>

<button onclick="start()">RUN V13</button>
<button onclick="replay()">REPLAY LAST PHASE</button>
<button onclick="resetCP()">RESET CHECKPOINT</button>

<div id="log"></div>
<div id="testarea"></div>

<script>
"use strict";

const logBox = document.getElementById("log");
const area = document.getElementById("testarea");

const KEY = "PS5_V13_CHECKPOINT";

let stats = {
    pass: 0,
    fail: 0,
    exception: 0
};

function log(msg, cls="") {
    const d = document.createElement("div");
    d.textContent = msg;
    d.className = cls;
    logBox.appendChild(d);

    window.scrollTo(
        0,
        document.body.scrollHeight
    );
}

function checkpoint(test, phase, iteration) {

    const cp = {
        version: "V13",
        test,
        phase,
        iteration,
        state: "RUNNING",
        time: Date.now()
    };

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify(cp)
        );
    } catch(e) {}
}

function completed() {

    try {
        localStorage.setItem(
            KEY,
            JSON.stringify({
                version:"V13",
                state:"COMPLETE",
                time:Date.now()
            })
        );
    } catch(e) {}
}

function previousCrash() {

    try {

        const raw =
            localStorage.getItem(KEY);

        if (!raw)
            return;

        const cp =
            JSON.parse(raw);

        if (cp.state === "RUNNING") {

            log(
                "*****************************",
                "bad"
            );

            log(
                "PREVIOUS RUN DID NOT COMPLETE",
                "bad"
            );

            log(
                "TEST: " + cp.test,
                "bad"
            );

            log(
                "PHASE: " + cp.phase,
                "bad"
            );

            log(
                "ITERATION: " +
                cp.iteration,
                "bad"
            );

            log(
                "*****************************",
                "bad"
            );
        }

    } catch(e) {}
}

function resetCP() {

    localStorage.removeItem(KEY);

    log(
        "Checkpoint cleared.",
        "warn"
    );
}

function delay() {
    return new Promise(
        r => setTimeout(r,0)
    );
}

/* =========================================
   STATE/LIFETIME TEST
========================================= */

async function stateLifetime(iteration) {

    checkpoint(
        "stateLifetime",
        "create",
        iteration
    );

    const root =
        document.createElement("div");

    const child =
        document.createElement("span");

    child.textContent =
        "state-" + iteration;

    root.appendChild(child);
    area.appendChild(root);

    checkpoint(
        "stateLifetime",
        "retain",
        iteration
    );

    const retained = child;

    checkpoint(
        "stateLifetime",
        "detach",
        iteration
    );

    root.remove();

    checkpoint(
        "stateLifetime",
        "post-detach-mutation",
        iteration
    );

    retained.textContent =
        "retained-" + iteration;

    return (
        retained.textContent ===
        "retained-" + iteration
    );
}

/* =========================================
   RANGE STATE TEST
========================================= */

async function rangeState(iteration) {

    checkpoint(
        "rangeState",
        "create",
        iteration
    );

    const root =
        document.createElement("div");

    const text =
        document.createTextNode(
            "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        );

    root.appendChild(text);
    area.appendChild(root);

    const range =
        document.createRange();

    range.setStart(text,4);
    range.setEnd(text,24);

    checkpoint(
        "rangeState",
        "tree-mutation",
        iteration
    );

    text.deleteData(5,10);

    checkpoint(
        "rangeState",
        "detach-tree",
        iteration
    );

    root.remove();

    checkpoint(
        "rangeState",
        "range-read",
        iteration
    );

    const result =
        range.toString();

    return typeof result === "string";
}

/* =========================================
   DOCUMENT LIFETIME TEST
========================================= */

async function documentState(iteration) {

    checkpoint(
        "documentState",
        "frame-create",
        iteration
    );

    const f =
        document.createElement("iframe");

    area.appendChild(f);

    await delay();

    const d =
        f.contentDocument;

    if (!d)
        throw new Error(
            "No iframe document"
        );

    const retained =
        d.createElement("div");

    retained.textContent =
        "before";

    d.body.appendChild(retained);

    checkpoint(
        "documentState",
        "document-replace",
        iteration
    );

    d.open();

    d.write(
        "<!doctype html>" +
        "<html><body>" +
        "replacement" +
        "</body></html>"
    );

    d.close();

    checkpoint(
        "documentState",
        "old-wrapper-access",
        iteration
    );

    retained.textContent =
        "after";

    const result =
        retained.textContent;

    checkpoint(
        "documentState",
        "frame-remove",
        iteration
    );

    f.remove();

    return result === "after";
}

/* =========================================
   EVENT RE-ENTRY TEST
========================================= */

async function eventState(iteration) {

    checkpoint(
        "eventState",
        "create",
        iteration
    );

    const outer =
        document.createElement("div");

    const target =
        document.createElement("button");

    outer.appendChild(target);
    area.appendChild(outer);

    let count = 0;

    target.addEventListener(
        "v13",
        function handler() {

            checkpoint(
                "eventState",
                "callback-enter",
                iteration
            );

            count++;

            outer.remove();

            target.textContent =
                "removed";

            checkpoint(
                "eventState",
                "callback-after-remove",
                iteration
            );
        }
    );

    checkpoint(
        "eventState",
        "dispatch",
        iteration
    );

    target.dispatchEvent(
        new Event(
            "v13",
            {bubbles:true}
        )
    );

    return count === 1;
}

/* =========================================
   FONT / STYLE LIFETIME
========================================= */

async function fontState(iteration) {

    if (typeof FontFace !== "function")
        return true;

    checkpoint(
        "fontState",
        "font-create",
        iteration
    );

    const name =
        "V13_" + iteration;

    const font =
        new FontFace(
            name,
            "local(Arial)"
        );

    checkpoint(
        "fontState",
        "font-add",
        iteration
    );

    document.fonts.add(font);

    const e =
        document.createElement("span");

    e.style.fontFamily =
        name;

    e.textContent =
        "V13FONT";

    area.appendChild(e);

    checkpoint(
        "fontState",
        "layout",
        iteration
    );

    const width =
        e.offsetWidth;

    void width;

    checkpoint(
        "fontState",
        "remove-element",
        iteration
    );

    e.remove();

    checkpoint(
        "fontState",
        "remove-font",
        iteration
    );

    document.fonts.delete(font);

    return true;
}

/* =========================================
   ARRAY BUFFER INTEGRITY CONTROL
========================================= */

async function memoryControl(iteration) {

    checkpoint(
        "memoryControl",
        "allocate",
        iteration
    );

    const ab =
        new ArrayBuffer(0x10000);

    const u8 =
        new Uint8Array(ab);

    checkpoint(
        "memoryControl",
        "pattern-write",
        iteration
    );

    for (
        let i=0;
        i<u8.length;
        i++
    ) {
        u8[i] =
            (i ^ iteration) & 0xff;
    }

    checkpoint(
        "memoryControl",
        "pattern-check",
        iteration
    );

    for (
        let i=0;
        i<u8.length;
        i+=257
    ) {

        const expected =
            (i ^ iteration) & 0xff;

        if (u8[i] !== expected)
            return false;
    }

    return true;
}

/* ========================================= */

const TESTS = [
    ["stateLifetime", stateLifetime],
    ["rangeState", rangeState],
    ["documentState", documentState],
    ["eventState", eventState],
    ["fontState", fontState],
    ["memoryControl", memoryControl]
];

async function runTest(
    name,
    fn,
    iteration
) {

    try {

        const result =
            await fn(iteration);

        if (result) {

            stats.pass++;

        } else {

            stats.fail++;

            log(
                "FAIL: " +
                name +
                " #" +
                iteration,
                "bad"
            );
        }

    } catch(e) {

        stats.exception++;

        log(
            "EXCEPTION: " +
            name +
            " #" +
            iteration +
            " : " +
            e,
            "bad"
        );
    }
}

/* ========================================= */

async function start() {

    logBox.innerHTML = "";

    previousCrash();

    stats = {
        pass:0,
        fail:0,
        exception:0
    };

    log(
        "PS5 V13 START",
        "info"
    );

    log(
        navigator.userAgent
    );

    log("");

    const startTime =
        performance.now();

    /*
       Intentionally modest.

       We're looking for reproducibility,
       not memory exhaustion.
    */

    const RUNS = 100;

    for (
        const [name,fn]
        of TESTS
    ) {

        log(
            ">>> " + name,
            "info"
        );

        for (
            let i=0;
            i<RUNS;
            i++
        ) {

            await runTest(
                name,
                fn,
                i
            );

            if ((i % 10) === 0)
                await delay();
        }
    }

    completed();

    const elapsed =
        performance.now() -
        startTime;

    log("");

    log(
        "====== V13 RESULT ======",
        "info"
    );

    log(
        "PASS: " +
        stats.pass,
        stats.fail === 0 ?
            "ok" : ""
    );

    log(
        "FAIL: " +
        stats.fail,
        stats.fail ?
            "bad" : "ok"
    );

    log(
        "EXCEPTIONS: " +
        stats.exception,
        stats.exception ?
            "bad" : "ok"
    );

    log(
        "RUNTIME: " +
        elapsed.toFixed(0) +
        " ms"
    );

    log(
        "========================",
        "info"
    );
}

/* ========================================= */

async function replay() {

    let cp;

    try {
        cp =
            JSON.parse(
                localStorage.getItem(KEY)
            );
    } catch(e) {}

    if (
        !cp ||
        cp.state !== "RUNNING"
    ) {

        log(
            "No incomplete checkpoint.",
            "warn"
        );

        return;
    }

    const found =
        TESTS.find(
            x => x[0] === cp.test
        );

    if (!found) {

        log(
            "Checkpoint test not found.",
            "bad"
        );

        return;
    }

    log(
        "REPLAYING:",
        "warn"
    );

    log(
        cp.test +
        " / " +
        cp.phase +
        " / #" +
        cp.iteration
    );

    await runTest(
        found[0],
        found[1],
        cp.iteration
    );

    log(
        "Replay returned normally.",
        "ok"
    );
}

previousCrash();

</script>
</body>
</html>
