<!doctype html>
<meta charset="utf-8">
<title>PS5 13.60 - V30 MediaSource Lifecycle Probe</title>

<style>
body {
    background:#111;
    color:#eee;
    font:15px monospace;
    padding:18px;
}
button {
    font:18px monospace;
    padding:10px 18px;
}
#status {
    margin:15px 0;
    padding:10px;
    border:1px solid #555;
}
pre {
    white-space:pre-wrap;
    word-break:break-word;
}
video {
    position:absolute;
    left:-10000px;
    top:-10000px;
    width:1px;
    height:1px;
}
</style>

<h2>PS5 13.60 — V30</h2>
<div>MediaSource lifecycle / callback teardown probe</div>

<p><button id="run">RUN V30</button></p>

<div id="status">READY</div>
<pre id="log"></pre>

<script>
"use strict";

const output = document.querySelector("#log");
const statusBox = document.querySelector("#status");
const runButton = document.querySelector("#run");

let pass = 0;
let exceptions = 0;
let anomalies = 0;
let unsupported = 0;

function log(s) {
    output.textContent += s + "\n";
    console.log(s);
}

function cp(stage) {
    try {
        localStorage.setItem(
            "PS5_V30_CHECKPOINT",
            stage
        );
    } catch (_) {}

    log("[CP] " + stage);
}

function good(name) {
    pass++;
    log("[PASS] " + name);
}

function bad(name, reason) {
    anomalies++;
    log("[ANOMALY] " + name + " :: " + reason);
}

function caught(name, e) {
    exceptions++;
    log("[EXCEPTION] " + name + " :: " + e);
}

function skip(name, why) {
    unsupported++;
    log("[UNSUPPORTED] " + name + " :: " + why);
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function state(ms) {
    try {
        return ms.readyState;
    } catch (e) {
        return "THREW:" + e.name;
    }
}

function makeVideo() {
    const video = document.createElement("video");
    video.muted = true;
    video.preload = "none";
    document.body.appendChild(video);
    return video;
}

function cleanup(video, url) {
    try {
        if (video) {
            video.removeAttribute("src");
            video.load();
            video.remove();
        }
    } catch (_) {}

    try {
        if (url)
            URL.revokeObjectURL(url);
    } catch (_) {}
}


/*
 * A — Basic attach / detach.
 */

async function testA() {

    const name = "A_BASIC_ATTACH";

    cp(name + ":CREATE");

    let video = null;
    let url = null;

    try {

        const ms = new MediaSource();

        video = makeVideo();

        url = URL.createObjectURL(ms);

        log("[A] initial=" + state(ms));

        cp(name + ":SET_SRC");

        video.src = url;

        video.load();

        await sleep(150);

        log("[A] after attach=" + state(ms));

        cp(name + ":DETACH");

        video.removeAttribute("src");
        video.load();

        await sleep(100);

        log("[A] after detach=" + state(ms));

        cp(name + ":READ_RETAINED");

        log(
            "[A] retained readyState=" +
            state(ms)
        );

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        cleanup(video, url);
    }
}


/*
 * B — Revoke object URL while attached.
 */

async function testB() {

    const name = "B_REVOKE_ATTACHED";

    cp(name + ":CREATE");

    let video = null;
    let url = null;

    try {

        const ms = new MediaSource();

        video = makeVideo();

        url = URL.createObjectURL(ms);

        video.src = url;
        video.load();

        await sleep(100);

        cp(name + ":BEFORE_REVOKE");

        log(
            "[B] before revoke=" +
            state(ms)
        );

        URL.revokeObjectURL(url);

        url = null;

        cp(name + ":AFTER_REVOKE");

        log(
            "[B] after revoke=" +
            state(ms)
        );

        /*
         * Retain both wrappers and perform
         * ordinary observable reads.
         */

        log(
            "[B] video.src length=" +
            video.src.length
        );

        log(
            "[B] mediaSource state=" +
            state(ms)
        );

        await sleep(150);

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        cleanup(video, url);
    }
}


/*
 * C — Remove media element from sourceopen.
 */

async function testC() {

    const name = "C_REMOVE_ON_SOURCEOPEN";

    cp(name + ":CREATE");

    let video = null;
    let url = null;

    try {

        const ms = new MediaSource();

        video = makeVideo();

        url = URL.createObjectURL(ms);

        let opened = 0;

        ms.addEventListener(
            "sourceopen",
            function() {

                opened++;

                cp(
                    name +
                    ":SOURCEOPEN_ENTER"
                );

                log(
                    "[C] sourceopen #" +
                    opened +
                    " state=" +
                    state(ms)
                );

                /*
                 * Synchronous DOM teardown while
                 * sourceopen is being delivered.
                 */

                video.remove();

                cp(
                    name +
                    ":VIDEO_REMOVED"
                );

                log(
                    "[C] video connected=" +
                    video.isConnected
                );

                log(
                    "[C] retained MS=" +
                    state(ms)
                );

                /*
                 * Ordinary DOM work while retained
                 * references are alive.
                 */

                const marker =
                    document.createElement("div");

                marker.textContent =
                    "v30-marker";

                document.body.appendChild(marker);

                void marker.offsetHeight;

                marker.remove();

                cp(
                    name +
                    ":SOURCEOPEN_EXIT"
                );
            }
        );

        cp(name + ":SET_SRC");

        video.src = url;
        video.load();

        await sleep(500);

        log(
            "[C] sourceopen count=" +
            opened
        );

        log(
            "[C] final state=" +
            state(ms)
        );

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        cleanup(video, url);
    }
}


/*
 * D — Detach src from sourceopen callback.
 */

async function testD() {

    const name = "D_DETACH_ON_SOURCEOPEN";

    cp(name + ":CREATE");

    let video = null;
    let url = null;

    try {

        const ms = new MediaSource();

        video = makeVideo();

        url = URL.createObjectURL(ms);

        let opened = 0;

        ms.addEventListener(
            "sourceopen",
            function() {

                opened++;

                cp(
                    name +
                    ":SOURCEOPEN_ENTER"
                );

                log(
                    "[D] enter state=" +
                    state(ms)
                );

                video.removeAttribute("src");

                cp(
                    name +
                    ":SRC_REMOVED"
                );

                video.load();

                cp(
                    name +
                    ":LOAD_CALLED"
                );

                log(
                    "[D] callback state=" +
                    state(ms)
                );

                log(
                    "[D] video.src=" +
                    video.src
                );

                cp(
                    name +
                    ":SOURCEOPEN_EXIT"
                );
            }
        );

        video.src = url;
        video.load();

        await sleep(500);

        log(
            "[D] sourceopen count=" +
            opened
        );

        log(
            "[D] final state=" +
            state(ms)
        );

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        cleanup(video, url);
    }
}


/*
 * E — Remove + reattach same video.
 */

async function testE() {

    const name = "E_REMOVE_REATTACH";

    cp(name + ":CREATE");

    let video = null;
    let url = null;

    try {

        const ms = new MediaSource();

        video = makeVideo();

        url = URL.createObjectURL(ms);

        video.src = url;
        video.load();

        await sleep(120);

        cp(name + ":REMOVE_VIDEO");

        video.remove();

        log(
            "[E] connected after remove=" +
            video.isConnected
        );

        log(
            "[E] MS after remove=" +
            state(ms)
        );

        await sleep(50);

        cp(name + ":REATTACH_VIDEO");

        document.body.appendChild(video);

        log(
            "[E] connected after attach=" +
            video.isConnected
        );

        void video.offsetHeight;

        await sleep(150);

        log(
            "[E] final MS=" +
            state(ms)
        );

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        cleanup(video, url);
    }
}


/*
 * F — Retain MediaSource after full teardown.
 */

async function testF() {

    const name = "F_RETAIN_AFTER_TEARDOWN";

    cp(name + ":CREATE");

    let video = null;
    let url = null;

    try {

        const ms = new MediaSource();

        video = makeVideo();

        url = URL.createObjectURL(ms);

        video.src = url;
        video.load();

        await sleep(120);

        cp(name + ":TEARDOWN");

        video.removeAttribute("src");
        video.load();
        video.remove();

        URL.revokeObjectURL(url);
        url = null;

        await sleep(100);

        cp(name + ":READ_RETAINED");

        log(
            "[F] readyState=" +
            state(ms)
        );

        log(
            "[F] sourceBuffers length=" +
            ms.sourceBuffers.length
        );

        log(
            "[F] activeSourceBuffers length=" +
            ms.activeSourceBuffers.length
        );

        /*
         * Ordinary allocations only — not a heap
         * reclamation/spray operation.
         */

        const temp = [];

        for (let i = 0; i < 100; i++) {
            temp.push({
                id:i,
                text:"v30-" + i
            });
        }

        log(
            "[F] ordinary objects=" +
            temp.length
        );

        log(
            "[F] retained state again=" +
            state(ms)
        );

        cp(name + ":COMPLETE");

        good(name);

    } catch(e) {

        caught(name, e);

    } finally {

        cleanup(video, url);
    }
}


async function run() {

    runButton.disabled = true;

    output.textContent = "";

    pass = 0;
    exceptions = 0;
    anomalies = 0;
    unsupported = 0;

    statusBox.textContent =
        "STATUS: RUNNING";

    const previous =
        localStorage.getItem(
            "PS5_V30_CHECKPOINT"
        );

    if (previous) {
        log(
            "Previous checkpoint: " +
            previous
        );
    }

    log("PS5 13.60 - V30");
    log(navigator.userAgent);
    log("");

    log(
        "MediaSource: " +
        typeof MediaSource
    );

    log(
        "URL.createObjectURL: " +
        typeof URL.createObjectURL
    );

    log("");

    if (
        typeof MediaSource !==
        "function"
    ) {

        skip(
            "V30",
            "MediaSource unavailable"
        );

    } else {

        await testA();
        await testB();
        await testC();
        await testD();
        await testE();
        await testF();
    }

    cp("V30:COMPLETE");

    log("");
    log("==============================");
    log("V30 RESULT");
    log("==============================");

    log(
        "TESTS COMPLETED: " +
        (
            pass +
            exceptions
        )
    );

    log("PASS: " + pass);
    log("EXCEPTIONS: " + exceptions);
    log("ANOMALIES: " + anomalies);
    log("UNSUPPORTED: " + unsupported);

    log("==============================");

    statusBox.textContent =
        exceptions || anomalies
        ? "STATUS: CHECK RESULT"
        : unsupported
        ? "STATUS: UNSUPPORTED"
        : "STATUS: NORMAL";

    runButton.disabled = false;
}

runButton.onclick = run;
</script>
